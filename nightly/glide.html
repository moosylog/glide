                                                            <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto">
                                                                {!stepSearch.trim() && layerNames.map((n, li) => (
                                                                    <button key={`mo-${li}`} onClick={() => { updateStep(i, { binding: { value: '&mo', params: [{ value: li, params: [] }] } }); setStepPickerIdx(null); }} className="px-2 py-1 text-[10px] font-bold rounded border border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card">&amp;mo {n}</button>
                                                                ))}
                                                                {(stepSearch.trim() ? searchAcrossAllPalette(stepSearch) : ALL_PALETTE_SECTIONS).flatMap((section) => section.items).slice(0, 80).map((item, ii) => (
                                                                    <button key={ii} onClick={() => { updateStep(i, { binding: bindingFromPaletteItem(item) }); setStepPickerIdx(null); }} className="px-2 py-1 text-[10px] font-bold rounded border border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card">{item.label || item.code || item.type}</button>
                                                                ))}
                                                            </div>
                                                            <div className="flex items-center gap-1.5 pt-1 border-t border-app-borderHighlight">
                                                                <span className="text-[10px] text-app-textMuted shrink-0">Other:</span>
                                                                <input type="text" placeholder="&behavior_name" defaultValue={step.binding.value} onBlur={(e) => { const v = e.target.value.trim(); if (v) updateStep(i, { binding: { value: v.startsWith('&') ? v : `&${v}` } }); }} className="flex-1 min-w-0 bg-app-card border border-app-borderHighlight rounded px-2 py-1 text-[11px] font-mono text-app-text outline-none" />
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {step.kind === 'mode' && (
                                                <div className="flex gap-2 flex-1 pt-0.5">
                                                    {['tap', 'press', 'release'].map((m) => (
                                                        <button key={m} onClick={() => updateStep(i, { mode: m })} className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-all ${step.mode === m ? 'bg-app-accent text-white border-app-accent shadow-sm' : 'border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-surface'}`}>{MACRO_MODE_LABELS[m]}</button>
                                                    ))}
                                                </div>
                                            )}

                                            {step.kind === 'pauseForRelease' && (
                                                <span className="flex-1 text-[11px] text-app-textMuted italic py-1.5">Everything above runs on press; everything below runs on release.</span>
                                            )}

                                            {(step.kind === 'waitTime' || step.kind === 'tapTime') && (
                                                <div className="flex items-center gap-2 flex-1 pt-0.5">
                                                    <span className="text-xs font-bold text-app-textMuted shrink-0">{step.kind === 'waitTime' ? 'Wait' : 'Tap'}</span>
                                                    <input type="number" min="0" value={step.ms} onChange={(e) => updateStep(i, { ms: Math.max(0, Number(e.target.value) || 0) })} className="w-20 bg-app-surface border border-app-borderHighlight rounded px-2 py-1 text-xs font-mono text-app-text outline-none" />
                                                    <span className="text-xs text-app-textMuted">ms</span>
                                                </div>
                                            )}

                                            {step.kind === 'paramForward' && (
                                                <div className="flex items-center gap-2 flex-1 pt-0.5 text-xs font-bold text-app-textMuted">
                                                    Forward param
                                                    <select value={step.from} onChange={(e) => updateStep(i, { from: Number(e.target.value) })} className="bg-app-surface border border-app-borderHighlight rounded px-1.5 py-1 outline-none">
                                                        <option value={1}>1</option><option value={2}>2</option>
                                                    </select>
                                                    →
                                                    <select value={step.to} onChange={(e) => updateStep(i, { to: Number(e.target.value) })} className="bg-app-surface border border-app-borderHighlight rounded px-1.5 py-1 outline-none">
                                                        <option value={1}>1</option><option value={2}>2</option>
                                                    </select>
                                                </div>
                                            )}

                                            <button onClick={() => removeStep(i)} className="w-6 h-6 flex items-center justify-center text-app-textMuted hover:text-red-400 hover:bg-red-900/30 rounded transition-colors shrink-0" title="Remove step">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 px-6 py-4 border-t border-app-borderHighlight shrink-0">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-textMuted hover:text-app-text hover:bg-app-card transition-all">Cancel</button>
                            <button onClick={handleApply} className="px-5 py-2.5 rounded-xl text-xs font-bold btn-active shadow-lg border-none hover:-translate-y-px transition-all">Apply</button>
                        </div>
                    </div>
                </div>
            );
        };

        // -- Sticky Key Builder --
        // Much smaller surface than the Macro Builder above: a sticky key has no ordered step
        // sequence, just four flat properties (ZMK: zmk.dev/docs/keymaps/behaviors/sticky-key).
        const StickyKeyBuilderModal = ({ name, config, onClose, onSave }) => {
            const stickyKey = (config.stickyKeys || []).find((s) => s.name === name);
            const [parsed, setParsed] = useState(() => parseStickyKey(stickyKey));
            const [nameField, setNameField] = useState(() => (stickyKey?.name || '').replace(/^&/, ''));

            if (!stickyKey) return null;

            const handleApply = () => {
                const trimmed = nameField.trim();
                let finalName = stickyKey.name;
                if (trimmed && trimmed.replace(/^&/, '') !== stickyKey.name.replace(/^&/, '')) {
                    const configWithout = { ...config, stickyKeys: (config.stickyKeys || []).filter((s) => s.name !== stickyKey.name) };
                    finalName = uniqueStickyKeyName(configWithout, trimmed);
                }
                onSave(stickyKey.name, { ...parsed, name: finalName });
            };

            const Toggle = ({ label, hint, checked, onChange }) => (
                <label className="flex items-center justify-between gap-3 cursor-pointer select-none py-1">
                    <div>
                        <span className="text-xs font-bold text-app-text">{label}</span>
                        {hint && <p className="text-[11px] text-app-textMuted mt-0.5">{hint}</p>}
                    </div>
                    <span className="relative inline-block w-10 h-5 shrink-0">
                        <input type="checkbox" checked={!!checked} onChange={(e) => onChange(e.target.checked)} className="peer sr-only" />
                        <span className="absolute inset-0 rounded-full bg-app-card border border-app-borderHighlight peer-checked:bg-app-accent peer-checked:border-app-accent transition-colors"></span>
                        <span className="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
                    </span>
                </label>
            );

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onClick={onClose}>
                    <div data-testid="stickykey-modal" className="bg-app-surface border border-app-borderHighlight rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-6 py-4 border-b border-app-borderHighlight shrink-0">
                            <div className="flex items-center gap-2 flex-1 min-w-0">
                                <span className="text-app-accent shrink-0">📌</span>
                                <span className="text-app-textMuted font-mono text-sm shrink-0">&amp;</span>
                                <input value={nameField} onChange={(e) => setNameField(e.target.value)} className="flex-1 min-w-0 bg-transparent text-sm font-bold font-mono text-app-text outline-none border-b border-transparent focus:border-app-accent py-0.5" />
                            </div>
                            <button onClick={onClose} className="text-app-textMuted hover:text-app-text text-xl leading-none shrink-0 ml-3">&times;</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-5">
                            <div className="flex flex-col gap-1.5">
                                <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Description</label>
                                <input type="text" value={parsed.description} onChange={(e) => setParsed((p) => ({ ...p, description: e.target.value }))} placeholder="What does this sticky key do?" className="w-full bg-app-card border border-app-borderHighlight rounded-lg px-3 py-2 text-xs text-app-text placeholder-app-textMuted outline-none focus:border-app-accent transition-colors" />
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Release After (ms)</label>
                                <input type="number" min="0" placeholder="Device default (1000ms)" value={parsed.releaseAfterMs ?? ''} onChange={(e) => setParsed((p) => ({ ...p, releaseAfterMs: e.target.value === '' ? undefined : Math.max(0, Number(e.target.value) || 0) }))} className="w-full bg-app-card border border-app-borderHighlight rounded-lg px-3 py-2 text-xs font-mono text-app-text placeholder-app-textMuted outline-none focus:border-app-accent transition-colors" />
                                <p className="text-[11px] text-app-textMuted italic">How long the key stays active waiting for another keypress. Leave blank to use the device's compiled-in default.</p>
                            </div>

                            <div className="flex flex-col divide-y divide-app-borderHighlight border-t border-b border-app-borderHighlight px-1">
                                <Toggle label="Quick Release" hint="Deactivate on the next key press rather than its release — prevents accidentally capitalizing more than one letter." checked={parsed.quickRelease ?? false} onChange={(v) => setParsed((p) => ({ ...p, quickRelease: v }))} />
                                <Toggle label="Lazy" hint="Delay activation until just before another key is pressed, rather than immediately — helps avoid unintended menu/hint triggers." checked={parsed.lazy ?? false} onChange={(v) => setParsed((p) => ({ ...p, lazy: v }))} />
                                <Toggle label="Ignore Modifiers" hint="Let another sticky key stack onto this one before it releases, so multiple modifiers can combine (e.g. Ctrl+Shift) from separate taps." checked={parsed.ignoreModifiers ?? true} onChange={(v) => setParsed((p) => ({ ...p, ignoreModifiers: v }))} />
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Wraps Behavior</label>
                                <input type="text" value={(parsed.bindings || ['&kp'])[0]} onChange={(e) => { const v = e.target.value.trim(); setParsed((p) => ({ ...p, bindings: [v.startsWith('&') ? v : `&${v || 'kp'}`] })); }} className="w-full bg-app-card border border-app-borderHighlight rounded-lg px-3 py-2 text-xs font-mono text-app-text outline-none focus:border-app-accent transition-colors" />
                                <p className="text-[11px] text-app-textMuted italic">Almost always <code>&amp;kp</code> — the behavior this sticky key applies to whatever it's assigned before. Only change this if you know you need something else.</p>
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 px-6 py-4 border-t border-app-borderHighlight shrink-0">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-textMuted hover:text-app-text hover:bg-app-card transition-all">Cancel</button>
                            <button onClick={handleApply} className="px-5 py-2.5 rounded-xl text-xs font-bold btn-active shadow-lg border-none hover:-translate-y-px transition-all">Apply</button>
                        </div>
                    </div>
                </div>
            );
        };

        // -- Mod-Morph Builder --
        // A user-authored &mod_morph always has exactly two cases (see core/zmk/modMorph.js's
        // header) — a default and a "when these mods are held" alternative — so this doesn't need
        // an add/remove/reorder step list like the Macro Builder; it's two fixed binding pickers
        // (reusing the same palette Change/search UI macro steps use) plus a mods/keepMods toggle
        // grid for the second case.
        const MOD_MORPH_FLAG_OPTIONS = ['MOD_LSFT', 'MOD_RSFT', 'MOD_LCTL', 'MOD_RCTL', 'MOD_LALT', 'MOD_RALT', 'MOD_LGUI', 'MOD_RGUI'];

        const ModMorphBindingPicker = ({ label, binding, onChange, layerNames }) => {
            const [open, setOpen] = useState(false);
            const [search, setSearch] = useState('');
            return (
                <div className="flex flex-col gap-1.5">
                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">{label}</label>
                    <div className="flex items-center gap-2">
                        <code className="flex-1 min-w-0 truncate text-[11px] bg-app-card border border-app-borderHighlight rounded px-2 py-1.5 text-app-text">{describeBindingStep(binding)}</code>
                        <button onClick={() => { setOpen(!open); setSearch(''); }} className="px-2.5 py-1.5 text-[11px] font-bold rounded-lg border border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card shrink-0">{open ? 'Close' : 'Change'}</button>
                    </div>
                    {open && (
                        <div className="p-2 bg-app-card border border-app-borderHighlight rounded-lg flex flex-col gap-2">
                            <input autoFocus type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search keys & behaviors..." className="w-full bg-app-surface border border-app-borderHighlight rounded px-2 py-1 text-[11px] text-app-text outline-none" />
                            <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto">
                                {!search.trim() && (layerNames || []).map((n, li) => (
                                    <button key={`mo-${li}`} onClick={() => { onChange({ value: '&mo', params: [{ value: li, params: [] }] }); setOpen(false); }} className="px-2 py-1 text-[10px] font-bold rounded border border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-surface">&amp;mo {n}</button>
                                ))}
                                {(search.trim() ? searchAcrossAllPalette(search) : ALL_PALETTE_SECTIONS).flatMap((section) => section.items).slice(0, 80).map((item, ii) => (
                                    <button key={ii} onClick={() => { onChange(bindingFromPaletteItem(item)); setOpen(false); }} className="px-2 py-1 text-[10px] font-bold rounded border border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-surface">{item.label || item.code || item.type}</button>
                                ))}
                            </div>
                            <div className="flex items-center gap-1.5 pt-1 border-t border-app-borderHighlight">
                                <span className="text-[10px] text-app-textMuted shrink-0">Other:</span>
                                <input type="text" placeholder="&behavior_name" defaultValue={binding.value} onBlur={(e) => { const v = e.target.value.trim(); if (v) onChange({ value: v.startsWith('&') ? v : `&${v}` }); }} className="flex-1 min-w-0 bg-app-surface border border-app-borderHighlight rounded px-2 py-1 text-[11px] font-mono text-app-text outline-none" />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ModMorphBuilderModal = ({ name, config, layerNames, onClose, onSave }) => {
            const modMorph = (config.modMorphs || []).find((m) => m.name === name);
            const [parsed, setParsed] = useState(() => ({ description: modMorph?.description || '', cases: normalizeModMorphCases(modMorph?.cases) }));
            const [nameField, setNameField] = useState(() => (modMorph?.name || '').replace(/^&/, ''));

            if (!modMorph) return null;

            const toggleMod = (mod) => setParsed((p) => {
                const next = structuredClone(p);
                const mods = next.cases[1].mods;
                next.cases[1].mods = mods.includes(mod) ? mods.filter((m) => m !== mod) : [...mods, mod];
                // keepMods can only ever keep a mod that's actually in mods — drop it from
                // keepMods too the moment it's toggled off, rather than leaving a stale entry.
                next.cases[1].keepMods = next.cases[1].keepMods.filter((m) => next.cases[1].mods.includes(m));
                return next;
            });
            const toggleKeepMod = (mod) => setParsed((p) => {
                const next = structuredClone(p);
                const keepMods = next.cases[1].keepMods;
                next.cases[1].keepMods = keepMods.includes(mod) ? keepMods.filter((m) => m !== mod) : [...keepMods, mod];
                return next;
            });

            const handleApply = () => {
                const trimmed = nameField.trim();
                let finalName = modMorph.name;
                if (trimmed && trimmed.replace(/^&/, '') !== modMorph.name.replace(/^&/, '')) {
                    const configWithout = { ...config, modMorphs: (config.modMorphs || []).filter((m) => m.name !== modMorph.name) };
                    finalName = uniqueModMorphName(configWithout, trimmed);
                }
                onSave(modMorph.name, { ...parsed, name: finalName });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onClick={onClose}>
                    <div data-testid="modmorph-modal" className="bg-app-surface border border-app-borderHighlight rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-6 py-4 border-b border-app-borderHighlight shrink-0">
                            <div className="flex items-center gap-2 flex-1 min-w-0">
                                <span className="text-app-accent shrink-0">⇄</span>
                                <span className="text-app-textMuted font-mono text-sm shrink-0">&amp;</span>
                                <input value={nameField} onChange={(e) => setNameField(e.target.value)} className="flex-1 min-w-0 bg-transparent text-sm font-bold font-mono text-app-text outline-none border-b border-transparent focus:border-app-accent py-0.5" />
                            </div>
                            <button onClick={onClose} className="text-app-textMuted hover:text-app-text text-xl leading-none shrink-0 ml-3">&times;</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-5">
                            <div className="flex flex-col gap-1.5">
                                <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Description</label>
                                <input type="text" value={parsed.description} onChange={(e) => setParsed((p) => ({ ...p, description: e.target.value }))} placeholder="What does this mod-morph do?" className="w-full bg-app-card border border-app-borderHighlight rounded-lg px-3 py-2 text-xs text-app-text placeholder-app-textMuted outline-none focus:border-app-accent transition-colors" />
                            </div>

                            <ModMorphBindingPicker label="Default (no mods held)" binding={parsed.cases[0].binding} layerNames={layerNames} onChange={(b) => setParsed((p) => { const n = structuredClone(p); n.cases[0].binding = b; return n; })} />

                            <div className="flex flex-col gap-2">
                                <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Triggering Mods</label>
                                <div className="flex flex-wrap gap-1.5">
                                    {MOD_MORPH_FLAG_OPTIONS.map((mod) => {
                                        const active = parsed.cases[1].mods.includes(mod);
                                        return <button key={mod} onClick={() => toggleMod(mod)} className={`px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-colors ${active ? 'bg-app-accent text-white border-app-accent' : 'bg-app-card text-app-textMuted border-app-borderHighlight hover:text-app-text hover:border-app-textMuted'}`}>{mod.replace('MOD_', '')}</button>;
                                    })}
                                </div>
                                <p className="text-[11px] text-app-textMuted italic">Fires when any one of the checked mods is held (not all of them at once).</p>
                            </div>

                            <ModMorphBindingPicker label="When triggering mods are held" binding={parsed.cases[1].binding} layerNames={layerNames} onChange={(b) => setParsed((p) => { const n = structuredClone(p); n.cases[1].binding = b; return n; })} />

                            {parsed.cases[1].mods.length > 0 && (
                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Keep Held</label>
                                    <div className="flex flex-wrap gap-1.5">
                                        {parsed.cases[1].mods.map((mod) => {
                                            const active = parsed.cases[1].keepMods.includes(mod);
                                            return <button key={mod} onClick={() => toggleKeepMod(mod)} className={`px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition-colors ${active ? 'bg-app-accent text-white border-app-accent' : 'bg-app-card text-app-textMuted border-app-borderHighlight hover:text-app-text hover:border-app-textMuted'}`}>{mod.replace('MOD_', '')}</button>;
                                        })}
                                    </div>
                                    <p className="text-[11px] text-app-textMuted italic">Checked mods are still sent alongside the morphed key, instead of being consumed by triggering it — off by default.</p>
                                </div>
                            )}
                        </div>

                        <div className="flex justify-end gap-2 px-6 py-4 border-t border-app-borderHighlight shrink-0">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-textMuted hover:text-app-text hover:bg-app-card transition-all">Cancel</button>
                            <button onClick={handleApply} className="px-5 py-2.5 rounded-xl text-xs font-bold btn-active shadow-lg border-none hover:-translate-y-px transition-all">Apply</button>
                        </div>
                    </div>
                </div>
            );
        };

        // -- Hold-Tap Builder --
        // Unlike the Mod-Morph Builder's two full binding pickers, a hold-tap's `bindings` are
        // plain behavior-NAME strings (see core/zmk/holdTap.js's header) — no params to pick, so a
        // simple text field per slot is enough, matching the Sticky Key Builder's "Wraps Behavior"
        // field rather than ModMorphBindingPicker's full palette search.
        const HoldTapBuilderModal = ({ name, config, onClose, onSave }) => {
            const holdTap = (config.holdTaps || []).find((h) => h.name === name);
            const [parsed, setParsed] = useState(() => normalizeHoldTapFields(holdTap));
            const [nameField, setNameField] = useState(() => (holdTap?.name || '').replace(/^&/, ''));

            if (!holdTap) return null;

            const handleApply = () => {
                const trimmed = nameField.trim();
                let finalName = holdTap.name;
                if (trimmed && trimmed.replace(/^&/, '') !== holdTap.name.replace(/^&/, '')) {
                    const configWithout = { ...config, holdTaps: (config.holdTaps || []).filter((h) => h.name !== holdTap.name) };
                    finalName = uniqueHoldTapName(configWithout, trimmed);
                }
                onSave(holdTap.name, { ...parsed, name: finalName });
            };

            const Toggle = ({ label, hint, checked, onChange }) => (
                <label className="flex items-center justify-between gap-3 cursor-pointer select-none py-1">
                    <div>
                        <span className="text-xs font-bold text-app-text">{label}</span>
                        {hint && <p className="text-[11px] text-app-textMuted mt-0.5">{hint}</p>}
                    </div>
                    <span className="relative inline-block w-10 h-5 shrink-0">
                        <input type="checkbox" checked={!!checked} onChange={(e) => onChange(e.target.checked)} className="peer sr-only" />
                        <span className="absolute inset-0 rounded-full bg-app-card border border-app-borderHighlight peer-checked:bg-app-accent peer-checked:border-app-accent transition-colors"></span>
                        <span className="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
                    </span>
                </label>
            );

            const NumberField = (label, key, hint, placeholder) => (
                <div className="flex flex-col gap-1.5">
                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">{label}</label>
                    <input type="number" placeholder={placeholder} value={parsed[key] ?? ''} onChange={(e) => setParsed((p) => ({ ...p, [key]: e.target.value === '' ? undefined : Number(e.target.value) || 0 }))} className="w-full bg-app-card border border-app-borderHighlight rounded-lg px-3 py-2 text-xs font-mono text-app-text placeholder-app-textMuted outline-none focus:border-app-accent transition-colors" />
                    {hint && <p className="text-[11px] text-app-textMuted italic">{hint}</p>}
                </div>
            );

            const BindingNameField = (label, idx) => (
                <div className="flex flex-col gap-1.5">
                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">{label}</label>
                    <div className="flex items-center gap-2">
                        <span className="text-app-textMuted font-mono text-xs shrink-0">&amp;</span>

        const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

        const mainLabelSizeClass = (text) => {

                const layerLabel = formatParam(p1, layerNames);

            if (val === '&lt') return renderStructured(formatKeycode(p2, osMode), formatParam(p1, layerNames), '⏱️');
           
            if (val === '&bt') return renderStructured(`BT ${String(p1).replace('BT_','')}`, '', '📶');

        };

        const paletteLabel = (item, osMode) => {

        const KeyComponent = memo(({ index, geo, binding, isSelected, isComboSelected, isZenMode, onSelect, osMode, onContextMenu, onKeyMouseDown, isDragSource, isDragOver, showLeds, isTouchpad, onOpenTouchpad, config, layerNames }) => {

            const hasCustomBg = !isZenMode && showLeds && !isTouchpad && binding?.value !== '&trans' && binding?.value !== '&none' && binding?.decoration?.background;

                <div className={`p-key-outer ${isSelected ? 'selected' : ''} ${isComboSelected ? 'combo-highlight' : ''} ${isDragOver ? 'drag-over' : ''} ${isTouchpad ? 'is-touchpad cursor-pointer' : ''}`} style={outerStyle} data-key-idx={index} title={isTouchpad ? `${TOUCHPAD_LABEL_BY_INDEX[index]} — click to configure` : undefined} onClick={(e) => { e.stopPropagation(); if (isTouchpad) onOpenTouchpad(index); else onSelect(index); }} onContextMenu={(e) => { if (isTouchpad) { e.preventDefault(); } else onContextMenu(e, index); }} onPointerDown={(e) => { if (!isTouchpad) onKeyMouseDown(e, index); }}>
                    <div className={`p-key ${hasCustomBg ? 'has-bg' : ''} ${isDragSource ? 'drag-source' : ''} ${isDragOver ? 'drag-over' : ''} ${geo.isRound ? 'is-round' : ''} ${isComboSelected ? 'combo-selected' : ''}`} style={innerStyle}>
                        {isTouchpad ? (
                            <div className="w-full h-full flex items-center justify-center text-app-textMuted/70 hover:text-app-accent transition-colors">
                                <svg className="w-1/3 h-1/3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="2" strokeWidth="1.6"></rect><path d="M3 13h18" strokeWidth="1.6" strokeLinecap="round"></path></svg>

        });

const KeyboardContainer = ({ keyboardGeo, activeLayerBindings, selectedKey, onSelectKey, scale, setScale, osMode, onContextAction, clipboard, styleClipboard, onSwapKeys, showLeds, isGo60, config, isZenMode, selectedComboKeys, layerNames, stopZenMode, onOpenTouchpad }) => {

            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            const [dragSourceIdx, setDragSourceIdx] = useState(null);
            const [dragOverIdx, setDragOverIdx] = useState(null);

            const bounds = useMemo(() => {
                let maxX = 0, maxY = 0;
                keyboardGeo.forEach(k => { maxX = Math.max(maxX, k.x + (k.w || KEY_SIZE)); const extraHeight = k.r ? 60 : 0; maxY = Math.max(maxY, k.y + (k.h || KEY_SIZE) + extraHeight); });

            }, [keyboardGeo, bounds]);

            // Pointer Events (not mouse-only) throughout this component: one code path handles

            // on a phone or tablet — plain mousedown/mousemove/mouseup never fire for touch input.
            const handlePointerDown = (e) => {
                // Excludes actual key tiles (so drag-to-swap/long-press on a key still works,

                // Without the button exclusion, setPointerCapture below grabs the pointer for the

            const swapKeys = useCallback((a, b) => {

                                            {(selectedKey === null && editingComboIdx === null) && (
                                                <div className="bg-amber-500/10 border border-amber-500/20 text-amber-500/80 rounded-lg p-3 text-xs font-semibold flex items-center gap-2 mb-2">
                                                    <span>ℹ️</span> Select a key on the canvas to assign layer actions.
                                                </div>
                                            )}
                                            <div className="bg-app-card border border-app-borderHighlight p-4 rounded-xl flex items-center justify-between shadow-inner">
                                                <span className="text-xs font-bold text-app-textMuted uppercase tracking-widest pl-2">Target Layer</span>
                                                <select className="bg-app-surface border border-app-borderHighlight text-app-text text-sm rounded-lg px-4 py-2.5 outline-none w-72 shadow-sm cursor-pointer" value={targetLayerIdx} onChange={e => setTargetLayerIdx(parseInt(e.target.value))}>
                                                    {layerNames.map((dName, i) => <option key={i} value={i}>{dName}</option>)}
                                                </select>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-[#b4b4ff] font-bold text-sm tracking-wide">Momentary (&mo)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignAction({ type: '&mo', param1: targetLayerIdx })} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${isItemActive({type: '&mo', param1: targetLayerIdx}) ? 'bg-[#b4b4ff] text-black border border-[#b4b4ff]' : 'bg-[#b4b4ff]/10 text-[#b4b4ff] hover:bg-[#b4b4ff]/20 border border-[#b4b4ff]/20'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Enables a layer while a key is pressed.</p>
                                                    <div className="mt-auto pt-4 border-t border-app-borderHighlight"><p className="text-[#b4b4ff]/70 text-[10px] italic leading-relaxed">💡 Tip: Assign this to "When held" alongside a tapped key to automatically create a Layer-Tap (&lt).</p></div>
                                                </div>
                                               
                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-purple-400 font-bold text-sm tracking-wide">Layer-Tap (&lt)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignLayerTap(targetLayerIdx)} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${(parsedSlots.hold && parsedSlots.hold.value === '&mo' && String(parsedSlots.hold.params?.[0]?.value) === String(targetLayerIdx)) ? 'bg-purple-400 text-black border border-purple-400' : 'bg-purple-900/20 text-purple-400 hover:bg-purple-900/40 border border-purple-900/30'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Enables a layer when held, outputs key press when tapped.</p>
                                                </div>
                                               
                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-amber-400 font-bold text-sm tracking-wide">Sticky (&sl)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignAction({ type: '&sl', param1: targetLayerIdx })} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${isItemActive({type: '&sl', param1: targetLayerIdx}) ? 'bg-amber-400 text-black border border-amber-400' : 'bg-amber-900/20 text-amber-400 hover:bg-amber-900/40 border border-amber-900/30'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Enables a layer until the next key press.</p>
                                                </div>

                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-emerald-400 font-bold text-sm tracking-wide">Toggle (&tog)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignAction({ type: '&tog', param1: targetLayerIdx })} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${isItemActive({type: '&tog', param1: targetLayerIdx}) ? 'bg-emerald-400 text-black border border-emerald-400' : 'bg-emerald-900/20 text-emerald-400 hover:bg-emerald-900/40 border border-emerald-900/30'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Enables a layer until manually disabled.</p>
                                                </div>
                                               
                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-blue-400 font-bold text-sm tracking-wide">Switch To (&to)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignAction({ type: '&to', param1: targetLayerIdx })} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${isItemActive({type: '&to', param1: targetLayerIdx}) ? 'bg-blue-400 text-black border border-blue-400' : 'bg-blue-900/20 text-blue-400 hover:bg-blue-900/40 border border-blue-900/30'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Enables a layer and disables all other layers except default.</p>
                                                </div>

                                                <div className="bg-app-panel border border-app-borderHighlight rounded-xl p-5 flex flex-col gap-3 shadow-sm hover:-translate-y-[2px] hover:shadow-xl hover:border-app-text transition-all group">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-pink-400 font-bold text-sm tracking-wide">MoErgo Layer (&layer)</span>
                                                        <button disabled={selectedKey === null && editingComboIdx === null} onClick={() => assignAction({ type: '&layer', param1: targetLayerIdx })} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all disabled:opacity-50 disabled:cursor-not-allowed ${isItemActive({type: '&layer', param1: targetLayerIdx}) ? 'bg-pink-400 text-black border border-pink-400' : 'bg-pink-900/20 text-pink-400 hover:bg-pink-900/40 border border-pink-900/30'}`}>Assign</button>
                                                    </div>
                                                    <p className="text-app-textMuted text-xs leading-relaxed">Proprietary syntax layer momentary toggle.</p>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeVerticalTab === 'Lighting' && (
                                        <div className="flex flex-col gap-8 w-full text-app-text pl-2">
                                            <div className="flex flex-col gap-3">
                                                <div className="text-[11px] text-app-textMuted font-bold tracking-wide uppercase">LED View Toggle</div>
                                                <div className="h-px w-full max-w-[600px] bg-app-borderHighlight"></div>
                                                <button onClick={() => setShowLeds(!showLeds)} className={`w-8 h-8 mt-1 flex items-center justify-center rounded transition-colors border cursor-pointer ${showLeds ? 'btn-active border-none' : 'text-app-textMuted border-transparent hover:border-app-borderHighlight'}`}>
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                                </button>
                                            </div>
                                            <div className="flex flex-col gap-3">
                                                <div className="text-[11px] text-app-textMuted font-bold tracking-wide uppercase">LED Color Palette</div>
                                                <div className="h-px w-full max-w-[600px] bg-app-borderHighlight"></div>
                                                <div className="flex items-center gap-3 mt-1 flex-wrap">
                                                    <button onClick={() => setKeyDecoration(null)} title="Turns LED OFF" className="w-6 h-6 rounded-full flex items-center justify-center text-gray-500 relative shrink-0 group">
                                                        <div className="absolute inset-0 rounded-full border-2 border-gray-500 group-hover:border-white transition-colors"></div>
                                                        <div className="absolute w-[2px] h-[120%] bg-gray-500 group-hover:bg-white transition-colors rotate-45"></div>
                                                    </button>
                                                    <div className="w-px h-6 bg-app-borderHighlight shrink-0 mx-1"></div>
                                                    {KEY_COLOR_PRESETS.map(c => <button key={c} onClick={() => setKeyDecoration(c)} className="w-5 h-5 rounded-full hover:scale-125 transition-transform" style={{backgroundColor: c}}></button>)}
                                                    {usedLayoutColors.length > 0 && <div className="w-px h-6 bg-app-borderHighlight shrink-0 mx-1"></div>}
                                                    {usedLayoutColors.map(c => <button key={c} onClick={() => setKeyDecoration(c)} className="w-5 h-5 rounded-full hover:scale-125 transition-transform" style={{backgroundColor: c}}></button>)}

                                                    <div className="flex items-center gap-2 ml-2 bg-app-card rounded-full border border-app-borderHighlight px-2 py-1 shadow-inner">
                                                        <div className="w-5 h-5 rounded-full overflow-hidden shrink-0 border border-app-borderHighlight relative hover:scale-110 transition-transform">
                                                            <input type="color" className="absolute -top-2 -left-2 w-10 h-10 cursor-pointer" value={currentLayerBindings[selectedKey]?.decoration?.background || '#ffffff'} onChange={(e) => setKeyDecoration(e.target.value)} />
                                                        </div>
                                                        <input type="text" className="w-16 bg-transparent text-[11px] font-mono text-app-textMuted outline-none uppercase" placeholder="#HEX" value={bgHexInput} onChange={(e) => setBgHexInput(e.target.value)} onBlur={applyBgHexInput} onKeyDown={e => e.key === 'Enter' && applyBgHexInput()} />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeVerticalTab === 'JSON' && (
                                        <div className="flex flex-col w-full h-full pb-4">
                                            <div className="flex justify-between items-center mb-3 shrink-0">
                                                <span className="text-[11px] text-app-textMuted font-bold uppercase tracking-widest">Raw JSON AST</span>
                                                <button onClick={saveCustomJson} className="btn-active-hollow text-xs font-bold px-5 py-2 rounded-lg transition-transform hover:-translate-y-px shadow-sm">Apply JSON</button>
                                            </div>
                                            <textarea className={`w-full flex-1 bg-app-card text-app-accent font-mono text-xs p-5 rounded-xl border outline-none resize-none shadow-inner transition-colors ${jsonError ? 'border-red-500' : 'border-app-borderHighlight focus:border-app-text'}`} value={jsonStr} onChange={(e) => setJsonStr(e.target.value)} spellCheck="false" />
                                            {jsonError && <div className="text-red-400 text-xs mt-3 font-semibold shrink-0">{jsonError}</div>}
                                        </div>
                                    )}
                                </div>
                            </aside>
                        )}
                    </main>
                </div>

                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md" onClick={() => setShowSettings(false)}>
                            <div className="bg-app-surface border border-app-borderHighlight rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-app-text flex items-center gap-2"><svg className="w-6 h-6 text-app-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> Configuration</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-app-textMuted hover:text-app-text text-xl">&times;</button>
                                </div>
                                <div className="space-y-6">
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Color Theme</label>
                                        <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight">
                                            <button onClick={() => setThemeClass('oled')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'oled' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>OLED Dark</button>
                                            <button onClick={() => setThemeClass('dark')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'dark' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Pro Dark</button>
                                            <button onClick={() => setThemeClass('light')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'light' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Light</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Key Editor Location</label>
                                        <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight">
                                            <button onClick={() => setLayoutMode('bottom')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${layoutMode === 'bottom' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Bottom Pane</button>
                                            <button onClick={() => setLayoutMode('right')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${layoutMode === 'right' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Right Sidebar</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Layers/Combos Panel Side</label>
                                        <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight">
                                            <button onClick={() => setSidebarSide('left')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${sidebarSide === 'left' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Left</button>
                                            <button onClick={() => setSidebarSide('right')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${sidebarSide === 'right' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Right</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Target OS (Keycaps)</label>
                                        <select value={osSetting} onChange={(e) => setOsSetting(e.target.value)} className="bg-app-card border border-app-borderHighlight text-app-text text-sm rounded-lg px-4 py-2.5 outline-none shadow-sm cursor-pointer">
                                            <option value="auto">Auto-Detect ({detectOs().toUpperCase()})</option>
                                            <option value="mac">macOS (⌘)</option><option value="win">Windows (⊞)</option><option value="linux">Linux (❖)</option>
                                        </select>
                                    </div>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="mt-8 w-full btn-active font-bold py-3 rounded-xl transition-all shadow-lg hover:-translate-y-px">Done</button>
                            </div>
                        </div>
                    )}

                    <CapabilitiesModal
                        isOpen={showCapabilities}
                        onClose={() => { setShowCapabilities(false); setSelectedFlowUid(null); setSelectedFlowCategory(null); setFlowSearchText(''); }}
                        config={config}
                        catalog={flowsCatalog}
                        selectedCategory={selectedFlowCategory}
                        onSelectCategory={setSelectedFlowCategory}
                        selectedUid={selectedFlowUid}
                        onSelectUid={setSelectedFlowUid}
                        paramValues={flowParamValues}
                        onParamChange={(uid, id, val) => setFlowParamValues((prev) => ({ ...prev, [uid]: { ...prev[uid], [id]: val } }))}
                        isApplying={isApplyingFlow}
                        onApply={handleApplyFlow}
                        searchText={flowSearchText}
                        onSearchTextChange={setFlowSearchText}
                        results={flowResults}
                        engineStatus={jqEngineStatus}
                        onRetryEngine={ensureJqEngineLoaded}
                    />

                    {touchpadModalIndex !== null && (
                        <TouchpadSettingsModal
                            key={touchpadModalIndex}
                            index={touchpadModalIndex}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setTouchpadModalIndex(null)}
                            onSave={(parsed) => { pushHistory(setTouchpadConfig(config, touchpadModalIndex, parsed)); showToast('Touchpad settings updated'); setTouchpadModalIndex(null); }}
                        />
                    )}

                    {config && macroModalName !== null && (config.macros || []).some((m) => m.name === macroModalName) && (
                        <MacroBuilderModal
                            key={macroModalName}
                            name={macroModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setMacroModalName(null)}
                            onSave={saveMacroFromModal}
                        />
                    )}

                    {config && stickyKeyModalName !== null && (config.stickyKeys || []).some((s) => s.name === stickyKeyModalName) && (
                        <StickyKeyBuilderModal
                            key={stickyKeyModalName}
                            name={stickyKeyModalName}
                            config={config}
                            onClose={() => setStickyKeyModalName(null)}
                            onSave={saveStickyKeyFromModal}
                        />
                    )}

                    {config && modMorphModalName !== null && (config.modMorphs || []).some((m) => m.name === modMorphModalName) && (
                        <ModMorphBuilderModal
                            key={modMorphModalName}
                            name={modMorphModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setModMorphModalName(null)}
                            onSave={saveModMorphFromModal}
                        />
                    )}

                    {config && holdTapModalName !== null && (config.holdTaps || []).some((h) => h.name === holdTapModalName) && (
                        <HoldTapBuilderModal
                            key={holdTapModalName}
                            name={holdTapModalName}
                            config={config}
                            onClose={() => setHoldTapModalName(null)}
                            onSave={saveHoldTapFromModal}
                        />
                    )}

                    {config && tapDanceModalName !== null && (config.tapDances || []).some((t) => t.name === tapDanceModalName) && (
                        <TapDanceBuilderModal
                            key={tapDanceModalName}
                            name={tapDanceModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setTapDanceModalName(null)}
                            onSave={saveTapDanceFromModal}
                        />
                    )}

                    <ConfirmDialog state={confirmState} onChoice={handleConfirmChoice} />

                    {toast && (
                        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-xs font-bold shadow-2xl border transition-all animate-bounce ${toast.kind === 'error' ? 'bg-red-950 border-red-600 text-red-200' : 'bg-app-panel border-app-borderHighlight text-app-text'}`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
