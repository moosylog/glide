    <!-- Production builds -- the development builds this shipped with add React's extra runtime
         checks/warnings and a much bigger payload, neither of which a released app needs; see
         ARCHITECTURE.md's "Startup performance" note for the full before/after.
         `defer`: without it, each of these three blocking <script src> tags pauses HTML parsing
         until it finishes downloading AND executing, one after another -- so the browser can't
         even reach <body> (the loading splash included) until all three round-trips to unpkg
         are done, and a visitor stares at a blank tab the whole time. Deferred, they download in
         parallel while the parser carries on into <body> and paints the splash immediately, then
         run in this relative order right before the page is considered loaded. -->
    <script defer src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Static build, not the Tailwind CDN's in-browser JIT compiler: see core/styles/README.md
         for what generates this file and how to regenerate it after adding a utility class. -->

    <style>
        :root {
            --bg-base: #f3f4f6; --bg-surface: #ffffff; --bg-panel: #e5e7eb; --bg-card: #f9fafb;
            --border-subtle: rgba(0,0,0,0.1); --border-highlight: rgba(0,0,0,0.25);
            --text-main: #111827; --text-muted: #6b7280;
            --accent-primary: #e55f2e; --accent-hover: #c9531f; --accent-ghost: rgba(229, 95, 46, 0.1);
            --key-grad-top: #ffffff; --key-grad-bot: #e5e7eb;
            --key-border: #d1d5db; --key-shadow: rgba(0,0,0,0.15); --canvas-dot: rgba(0,0,0,0.1);
        }
       
        .dark {
            --bg-base: #111111; --bg-surface: #1a1a1a; --bg-panel: #222222; --bg-card: #2a2a2a;
            --border-subtle: rgba(255,255,255,0.1); --border-highlight: rgba(255,255,255,0.3);
            --text-main: #ffffff; --text-muted: #9ca3af;
            --accent-primary: #e55f2e; --accent-hover: #c9531f; --accent-ghost: rgba(229, 95, 46, 0.15);

        body { background-color: var(--bg-base); color: var(--text-main); overflow: hidden; margin: 0; transition: background-color 0.3s ease, color 0.3s ease; }
       
        .canvas-container { background-color: var(--bg-base); background-image: radial-gradient(circle, var(--canvas-dot) 1px, transparent 1px); background-size: 32px 32px; cursor: grab; overflow: hidden; transition: background-color 0.3s ease; touch-action: none; }
        .canvas-container:active { cursor: grabbing; }

        /* touch-action: none + no callout/selection — panning and key drag-to-swap are driven by
           Pointer Events (see KeyboardContainer/KeyComponent in the app script) and need to own
           the gesture completely: without this, iOS shows its press-and-hold text-selection
           callout instead of firing our long-press-for-context-menu logic, and a touch drag can
           get hijacked by the page's native scroll/zoom instead of panning or swapping keys. */
        .p-key-outer { position: absolute; cursor: pointer; z-index: 1; user-select: none; -webkit-touch-callout: none; touch-action: none; transition: transform 0.15s ease; }

        .p-key-outer:hover { z-index: 20; }
        .p-key-outer.selected { z-index: 30; }
        .p-key-outer.combo-highlight { z-index: 25; }

        .p-key {
            width: 100%; height: 100%; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(180deg, var(--key-grad-top) 0%, var(--key-grad-bot) 100%);
            border: 1px solid var(--key-border);

            padding: 4px; text-align: center; overflow: hidden; color: var(--text-main);
        }
        .p-key.is-round { border-radius: 50%; }

        .p-key:active { transform: scale(0.96) translateY(1px); box-shadow: inset 0 2px 4px var(--key-shadow); filter: brightness(0.9); }

        .p-key:hover {
            transform: scale(1.05) translateY(-2px);
            border-color: var(--border-highlight); filter: brightness(1.1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -2px 0 var(--key-shadow), 0 8px 18px rgba(0,0,0,0.5);
        }
       
        .p-key.selected {
            border: 3px solid var(--accent-primary) !important;
            box-shadow: inset 0 0 15px rgba(229, 95, 46, 0.2), 0 12px 35px rgba(229, 95, 46, 0.5) !important;
            transform: scale(1.08) translateY(-2px);
        }

        .p-key.combo-selected {
            border: 2px solid var(--accent-primary) !important;
            background: var(--accent-primary) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 20px rgba(229, 95, 46, 0.5) !important;
            transform: translateY(-1px) scale(1.04);
        }
       
        .p-key.drag-source { opacity: 0.35; transform: scale(0.95); }
        .p-key.drag-over { box-shadow: 0 0 0 3px var(--bg-base), 0 0 0 5px var(--accent-primary) !important; border-style: dashed !important; transform: scale(1.08); }

        .kc-grid { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; overflow: hidden; padding: 2px; box-sizing: border-box; }
       
        .kc-main { font-weight: 700; font-size: 11px; color: inherit; line-height: 1.1; z-index: 2; text-align: center; width: 100%; word-break: break-all; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .kc-main.kc-main-solo { font-size: 15px; -webkit-line-clamp: 1; }
        .kc-main.kc-main-short { font-size: 13px; -webkit-line-clamp: 1; }
       
        .kc-tl { position: absolute; top: 1px; left: 3px; font-size: 9.5px; opacity: 0.9; font-weight: 700; color: var(--accent-primary); max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }

        .kc-custom { display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; max-height: 100%; font-size: 11px; font-weight: 700; line-height: 1.1; word-break: break-all; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
        .kc-custom.kc-main-solo { font-size: 15px; }
        .kc-custom.kc-main-short { font-size: 13px; }

        .palette-btn { min-width: calc(48px * var(--btn-scale, 1)); height: calc(48px * var(--btn-scale, 1)); background-color: var(--bg-surface); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: calc(12px * var(--btn-scale, 1)); font-weight: 600; color: var(--text-main); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); padding: 4px; border: 1px solid var(--border-subtle); line-height: 1.2; }
        .palette-btn:hover { transform: translateY(-1px); background-color: var(--bg-panel); border-color: var(--border-highlight); box-shadow: 0 4px 12px var(--key-shadow); }
       
        .btn-active { background-color: var(--accent-primary) !important; border-color: var(--accent-primary) !important; color: #ffffff !important; box-shadow: 0 0 12px var(--accent-ghost) !important; }
        .btn-active:hover { background-color: var(--accent-hover) !important; border-color: var(--accent-hover) !important; transform: translateY(-1px); }

        .btn-active-hollow:hover { background-color: var(--border-highlight) !important; transform: translateY(-1px); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: 4px; }

        /* Plain CSS, not Tailwind: this has to render before the Tailwind stylesheet link (and

        .glide-splash {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;

        @keyframes glide-splash-spin { to { transform: rotate(360deg); } }

<body>
    <!-- Plain HTML/CSS, no React/Babel needed to show this — it has to paint before either of
         those libraries has even finished downloading. React/ReactDOM/Babel are `defer`red
         (see <head>) specifically so the browser can parse and paint this instead of sitting on
         a blank tab while three separate network round-trips to unpkg finish one after another.
         App's own mount effect removes this node once the real UI has actually rendered — see
         the `useEffect(() => splash.remove()...)` near the top of the App component. -->
    <div id="glide-splash" class="glide-splash">
        <div class="glide-splash-mark">GLIDE</div>
        <div class="glide-splash-spinner"></div>
        <div class="glide-splash-label">Loading…</div>
    </div>

         a real contributor to slow startup for every single user, even the ones who never open
         Flows Automations. glide.html's App now injects this same <script src> itself, lazily,

    <script type="text/babel">


const { useState, useEffect, useMemo, useCallback, memo, useRef } = React;

        const {
            GLIDE_HT_PREFIX,
            GLIDE_MM_PREFIX,
            GLIDE_TD_PREFIX,
            GLIDE_BEHAVIOR_DESCRIPTION,
            isGlideHtName,
            isGlideMmName,
            isRecognizedTdName,
            stripGlideHtPrefix,
            stripGlideMmPrefix,
            stripTdPrefix,
            LAYER_POINTER_BEHAVIORS,
            MAX_COMBO_KEYS,
            RAW_MOD_CODES,
            ZMK_MAP,
            MOD_WRAPPER_TO_FULL,
            FULL_TO_MOD_WRAPPER,
            unwrapModChain,
            composeKeycodeParam,
            KEY_UNIT,
            KEY_SIZE,
            GLOVE80_TOTAL_WIDTH,
            GO60_TOTAL_WIDTH,
            GUTTER,
            mirrorSpecialKey,
            convertGeo,
            computeGeoBounds,
            GLOVE80_THUMB_A_LEFT,
            GLOVE80_THUMB_B_LEFT,
            GLOVE80_GEO_RAW,
            GLOVE80_GEO,
            GLOVE80_NAMES,
            GO60_THUMB_LEFT,
            GO60_ROUND_LEFT,
            GO60_GEO_RAW,
            GO60_GEO,
            GO60_NAMES,

            runGC,
            countBehaviorUsage,

            parseModMorph,
            parseHoldTap,
            parseSlots,
            makeModMorph,
            makeHoldTap,
            buildBindingAndConfig,
            formatKeycode,
            formatParam,
            formatParamFull,
            describeBinding,
            shiftLayerPointers,
            BehaviorSchemas,
            getBehaviorSchema,
            getAllBehaviorSchemas,
            getDefaultValues,
            coercePropertyValue,
            compileBehaviorProperty,
            compileBehaviorProperties,
            LAYOUT_SCHEMA_FIELDS,
            validateLayout,
            loadLayoutObject,
            parseLayoutJson,
            serializeLayout,
            getExportFilename,
            buildScriptWithParams,
            parseCatalog,
            isFlowCompatible,
            runJqScript,
            applyFlow,
            BUILTIN_FLOWS_CATALOG,
            isTouchpadIndex,
            TOUCHPAD_LABEL_BY_INDEX,
            getTouchpadConfig,
            setTouchpadConfig,
            parseChain,
            CLICK_MAPPER_CODE_BY_TARGET,
            CLICK_TARGET_LABELS,
            UNVERIFIED_CLICK_TARGETS,
            parseMacro,
            inferMacroParamCount,
            findMacroReferences,
            uniqueMacroName,

            uniqueStickyKeyName,
            createStickyKey,
            updateStickyKey,
            renameStickyKey,
            deleteStickyKey,
            cloneStickyKey,
            findModMorphReferences,
            uniqueModMorphName,
            normalizeModMorphCases,
            createModMorph,
            updateModMorph,
            renameModMorph,
            deleteModMorph,
            cloneModMorph,
            HOLD_TAP_FLAVORS,
            normalizeHoldTapFields,
            findHoldTapReferences,
            uniqueHoldTapName,
            createHoldTap,
            updateHoldTap,
            renameHoldTap,
            deleteHoldTap,
            cloneHoldTap,
            normalizeTapDanceFields,
            findTapDanceReferences,
            uniqueTapDanceName,
            createTapDance,
            updateTapDance,
            renameTapDance,
            deleteTapDance,
            cloneTapDance
        } = window.GlideCore;


        const SLOT_LABELS = { tap: 'Primary Action', shiftTap: 'Shift Action', hold: 'Hold Action', doubleTap: 'Double-Tap Action', label: 'Custom Key Text' };
        const SLOT_LINK_LABELS = { shiftTap: 'when tapped with Shift', hold: 'when held', doubleTap: 'when double-tapped', label: 'add text label to the key' };
       

        // GLIDE's naming convention for behaviors it generates. The "ht"/"mm"/"td" segment is kept
        // immediately after GLIDE_ (rather than a fully flat &GLIDE_<ids>) because two different
        // behavior kinds can compute the same identifier suffix from unrelated keys (e.g. a hold-tap
        // of hold=N1/tap=F4 and a mod-morph of tap=N1/shiftTap=F4 both reduce to "N1_F4") — behavior
        // names must be globally unique in the exported ZMK devicetree, so without a type marker two
        // unrelated behaviors could collide into one invalid, ambiguous exported name.
       
        const detectOs = () => { const platform = navigator.userAgent.toLowerCase(); if (platform.includes('mac')) return 'mac'; if (platform.includes('linux')) return 'linux'; return 'win'; };








        const MiniKeyboardMap = memo(({ geo, selectedKeys = [], onKeyToggle, readonly = false, size = 140 }) => {
            const bounds = useMemo(() => computeGeoBounds(geo), [geo]);
            const containerRef = useRef(null);
            const [scale, setScale] = useState(0.2);

            useEffect(() => {
                if (containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const scaleX = (rect.width - 20) / bounds.w;
                    const scaleY = (rect.height - 20) / bounds.h;
                    setScale(Math.min(scaleX, scaleY, 0.35));
                }
            }, [bounds, size]);

            return (
                <div ref={containerRef} style={{ height: `${size}px` }} className="relative overflow-hidden flex items-center justify-center rounded-xl w-full bg-app-panel/30 border border-app-borderHighlight shadow-inner">
                    <div className="relative" style={{ width: bounds.w * scale, height: bounds.h * scale }}>
                        {geo.map((k, i) => {
                            const isSel = selectedKeys.includes(i);
                            return (
                                <div key={i} onClick={(e) => { e.stopPropagation(); if (!readonly && onKeyToggle) onKeyToggle(i); }}
                                     style={{
                                         position: 'absolute',
                                         left: (k.x - bounds.minX) * scale,
                                         top: (k.y - bounds.minY) * scale,
                                         width: (k.w || KEY_SIZE) * scale,
                                         height: (k.h || KEY_SIZE) * scale,
                                         transform: k.r ? `rotate(${k.r}deg)` : 'none',
                                         transformOrigin: k.o ? k.o.split(' ').map(val => parseFloat(val) * scale + 'px').join(' ') : 'center',
                                         backgroundColor: isSel ? 'var(--accent-primary)' : 'var(--bg-surface)',
                                         border: `${Math.max(1, 1.5 * scale)}px solid ${isSel ? 'var(--accent-primary)' : 'var(--text-muted)'}`,
                                         borderRadius: k.isRound ? '50%' : `${6 * scale}px`,
                                         cursor: readonly ? 'default' : 'pointer',
                                         opacity: isSel ? 1 : 0.4,
                                         boxShadow: isSel ? '0 5px 15px rgba(229, 95, 46, 0.4)' : 'none'
                                     }}
                                />
                            )
                        })}
                    </div>
                </div>
            );
        });

        // DynamicBehaviorForm — renders a behavior's settings panel entirely from its
        // core/behaviors/schemas.js entry, so a new/tuned property (a .toml-plan-equivalent
        // change, just plain JS data instead) never needs a JSX change here. Values are read
        // straight off the real behavior object (values) and written back through onChange
        // exactly like updateBehaviorSetting always has — this form doesn't introduce a new
        // write path, just a generic render path over the existing one.
        const DynamicBehaviorForm = ({ behaviorId, values, onChange, keyboardGeo }) => {
            const schema = getBehaviorSchema(behaviorId);
            if (!schema) return null;

            const renderWidget = (prop) => {
                const raw = values?.[prop.key];
                const current = raw === undefined ? prop.default : raw;
                const commit = (nextRaw) => onChange(prop.key, compileBehaviorProperty(behaviorId, prop.key, nextRaw));

                switch (prop.widget) {
                    case 'select':
                        return (
                            <select className="w-full bg-app-surface border border-app-borderHighlight p-2 rounded-lg text-xs text-app-text outline-none" value={current} onChange={(e) => commit(e.target.value)}>
                                {(prop.options || []).map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                        );
                    case 'slider':
                        return (
                            <div className="flex items-center gap-3">
                                <input type="range" min={prop.min} max={prop.max} step={prop.step || 1} value={current} onChange={(e) => commit(e.target.value)} className="w-full accent-app-accent" />
                                <span className="text-xs font-mono text-app-textMuted w-14 text-right shrink-0">{current}{prop.unit || ''}</span>
                            </div>
                        );
                    case 'number_input':
                        return (
                            <div className="flex bg-app-surface border border-app-borderHighlight rounded-lg overflow-hidden">
                                <input type="number" min={prop.min} max={prop.max} step={prop.step || 1} className="w-full bg-transparent p-2 text-xs font-mono text-app-text outline-none" value={current} onChange={(e) => commit(e.target.value)} />
                                {prop.unit && <span className="p-2 text-xs text-app-textMuted font-mono">{prop.unit}</span>}
                            </div>
                        );
                    case 'toggle':
                        return (
                            <label className="flex items-center gap-2 cursor-pointer group">
                                <input type="checkbox" checked={!!current} onChange={(e) => commit(e.target.checked)} className="accent-app-accent" />
                                <span className="text-xs text-app-textMuted group-hover:text-app-text transition-colors">{prop.label}</span>
                            </label>
                        );
                    case 'keyboard_picker':
                        return (
                            <MiniKeyboardMap geo={keyboardGeo} selectedKeys={current || []} onKeyToggle={(kIdx) => {
                                const next = (current || []).includes(kIdx) ? current.filter((k) => k !== kIdx) : [...(current || []), kIdx];
                                commit(next);
                            }} />
                        );
                    case 'text':
                    default:
                        return (
                            <input type="text" value={current ?? ''} onChange={(e) => commit(e.target.value)} className="bg-app-surface border border-app-borderHighlight text-app-text text-xs rounded-lg px-3 py-2 outline-none w-full font-mono" />
                        );
                }
            };

            const basicProps = schema.properties.filter((p) => !p.advanced);
            const advancedProps = schema.properties.filter((p) => p.advanced);
            const [showAdvanced, setShowAdvanced] = useState(false);

            // Compact widgets (toggle, number_input) look right sharing a row two-at-a-time —
            // the way the hand-authored hold-tap panel always paired Tapping Term/Quick Tap and
            // Retro Tap/Trigger on Release; every other widget gets its own full-width row.
            const PAIRABLE = new Set(['toggle', 'number_input']);
            const rows = [];
            let i = 0;
            while (i < basicProps.length) {
                const p = basicProps[i];
                const next = basicProps[i + 1];
                if (PAIRABLE.has(p.widget) && next?.widget === p.widget) {
                    rows.push({ pair: [p, next] });
                    i += 2;
                } else {
                    rows.push({ single: p });
                    i += 1;
                }
            }

            return (
                <div className="flex flex-col gap-4">
                    {rows.map((row, rIdx) => row.pair ? (
                        row.pair[0].widget === 'toggle' ? (
                            <div key={rIdx} className="flex justify-between mt-1">
                                {row.pair.map((p) => <React.Fragment key={p.key}>{renderWidget(p)}</React.Fragment>)}
                            </div>
                        ) : (
                            <div key={rIdx} className="flex gap-4">
                                {row.pair.map((p) => (
                                    <div key={p.key} className="flex flex-col flex-1 gap-1.5">
                                        <label className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">{p.label}</label>
                                        {renderWidget(p)}
                                    </div>
                                ))}
                            </div>
                        )
                    ) : (
                        <div key={rIdx} className="flex flex-col gap-1.5">
                            {row.single.widget !== 'toggle' && <label className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">{row.single.label}</label>}
                            {row.single.description && row.single.widget === 'keyboard_picker' && <p className="text-[10px] text-app-textMuted leading-tight mb-1">{row.single.description}</p>}
                            {renderWidget(row.single)}
                        </div>
                    ))}
                    {advancedProps.length > 0 && (
                        <div className="pt-2 border-t border-app-borderHighlight">
                            <button onClick={() => setShowAdvanced((s) => !s)} className="text-[10px] uppercase font-bold text-app-textMuted hover:text-app-text transition-colors flex items-center gap-1">
                                {showAdvanced ? '▾' : '▸'} Advanced
                            </button>
                            {showAdvanced && (
                                <div className="flex flex-col gap-4 mt-3">
                                    {advancedProps.map((p) => (
                                        <div key={p.key} className="flex flex-col gap-1.5">
                                            <label className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">{p.label}</label>
                                            {p.description && <p className="text-[10px] text-app-textMuted leading-tight mb-1">{p.description}</p>}
                                            {renderWidget(p)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // Renders a form for one Flows-package's [[param]] declarations (id/label/type/options/
        // labels/default — the shape build-catalog.js actually produces from real .flows files,
        // distinct from BehaviorSchemas' key/widget/min/max shape above, so this stays its own
        // small component rather than being forced through DynamicBehaviorForm).
        const FlowParamForm = ({ params, values, onChange }) => {
            if (!params || params.length === 0) return null;
            return (
                <div className="flex flex-col gap-3">
                    {params.map((p) => {
                        const current = values?.[p.id] !== undefined ? values[p.id] : p.default;
                        return (
                            <div key={p.id} className="flex flex-col gap-1.5">
                                {p.type !== 'boolean' && <label className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">{p.label || p.id}</label>}
                                {p.type === 'boolean' ? (
                                    <label className="flex items-center gap-2 cursor-pointer group">
                                        <input type="checkbox" checked={!!current} onChange={(e) => onChange(p.id, e.target.checked)} className="accent-app-accent" />
                                        <span className="text-xs text-app-textMuted group-hover:text-app-text transition-colors">{p.label || p.id}</span>
                                    </label>
                                ) : p.type === 'number' ? (
                                    <input type="number" value={current ?? ''} onChange={(e) => onChange(p.id, e.target.value === '' ? '' : Number(e.target.value))} className="bg-app-surface border border-app-borderHighlight text-app-text text-xs rounded-lg px-3 py-2 outline-none w-full font-mono" />
                                ) : p.type === 'select' ? (
                                    <select value={current ?? ''} onChange={(e) => onChange(p.id, e.target.value)} className="w-full bg-app-surface border border-app-borderHighlight p-2 rounded-lg text-xs text-app-text outline-none">
                                        {(p.options || []).map((opt, i) => <option key={opt} value={opt}>{(p.labels && p.labels[i]) || opt}</option>)}
                                    </select>
                                ) : (
                                    <input type="text" value={current ?? ''} onChange={(e) => onChange(p.id, e.target.value)} className="bg-app-surface border border-app-borderHighlight text-app-text text-xs rounded-lg px-3 py-2 outline-none w-full font-mono" />
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        // Browse-and-apply UI for Capabilities (GLIDE's user-facing name for what core/
        // capabilities/*.js calls Flows — a one-shot jq mutation, not a persisted install).
        // Deliberately a modal, not a left-nav tab beside Layers/Combos: those two are places
        // you spend the whole editing session flipping between; a Capability is an occasional
        // "run this against my layout" action, over almost as soon as it's opened, so giving it
        // equal, permanent real estate in the same tri-tab misrepresented it as a third editing
        // mode. `runLog` (kept by the caller, across opens) is what makes a jq failure — often a
        // cryptic message like "Cannot iterate over null (null)" — inspectable after the fact,
        // rather than only a 2.2s toast the user has to read in time.
        // A single app-store-style tile — one per category, shown on the top-level browse
        // screen. Picking an icon per category (rather than trusting each flow's own icon,
        // which is really about the individual automation) keeps the grid glanceable.
        const FLOW_CATEGORY_ICONS = {
            'Home-Row Mods': '⌨️', 'Decorations & RGB': '💡', 'Special keys': '🎹', 'Autoshift': '⇪',
            'Gaming': '🎮', 'macOS': '🍎', 'QWERTY Alternatives': '🔠', 'Mouse Controls': '🖱️',
            'Symbols': '🔣',
        };

        // A short "which keyboard(s)" label — shown on every list row and detail view so
        // compatibility is visible while browsing, not just as a warning after drilling in.
        const flowHardwareLabel = (entry) => {
            const kbs = entry.manifest.keyboards;
            if (!kbs || kbs.length === 0) return 'Go60 · Glove80';
            const names = kbs.map((k) => (k === 'go60' ? 'Go60' : k === 'glove80' ? 'Glove80' : k));
            return kbs.length > 1 ? names.join(' · ') : `${names[0]} only`;
        };

        // A small in-app confirmation dialog standing in for every native window.confirm()
        // popup in GLIDE (see App's askConfirm/handleConfirmChoice) — matches the rest of the
        // app's design instead of an OS-level interruption, and can offer a real third option
        // ("Export First") inline rather than just discard-or-cancel.
        const ConfirmDialog = ({ state, onChoice }) => {
            if (!state) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-md" onClick={() => onChoice('cancel')}>
                    <div className="bg-app-surface border border-app-borderHighlight rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4" onClick={(e) => e.stopPropagation()}>
                        <h3 className="text-base font-bold text-app-text mb-2">{state.title}</h3>
                        <p className="text-xs text-app-textMuted leading-relaxed mb-5 whitespace-pre-wrap">{state.message}</p>
                        <div className="flex flex-col gap-2">
                            {state.extraLabel && (
                                <button onClick={() => onChoice('export')} className="w-full py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-text hover:bg-app-card transition-all">{state.extraLabel}</button>
                            )}
                            <div className="flex gap-2">
                                <button onClick={() => onChoice('cancel')} className="flex-1 py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-textMuted hover:text-app-text hover:bg-app-card transition-all">{state.cancelLabel || 'Cancel'}</button>
                                <button onClick={() => onChoice('confirm')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all border-none shadow-lg hover:-translate-y-px ${state.danger ? 'bg-red-600 hover:bg-red-500 text-white' : 'btn-active'}`}>{state.confirmLabel || 'Confirm'}</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Settings for one of Go60's two Cirque trackpads (key positions 60/61 — see
        // core/zmk/inputProcessors.js's header for why this corner of the format is encoded
        // differently from an ordinary key binding). Modeled on the same idea as MoErgo's own
        // touchpad editor — a "Default" config plus a short list of per-layer overrides — but
        // built to match the rest of GLIDE rather than copied pixel-for-pixel: the left rail
        // mirrors the Layers list's own look, and every control here edits a local draft; only
        // Apply writes it back (through pushHistory, so it's a normal undoable edit like any
        // other), and Cancel/backdrop-click/Esc discard the draft with zero side effects.
        const TouchpadSettingsModal = ({ index, config, layerNames, onClose, onSave }) => {
            const [parsed, setParsed] = useState(() => getTouchpadConfig(config, index).parsed);
            const [selected, setSelected] = useState({ type: 'base' });

            const activeChain = selected.type === 'base' ? parsed.base : parsed.overrides[selected.idx]?.chain;

            const updateChain = (mutator) => setParsed((prev) => {
                const next = structuredClone(prev);
                const chain = selected.type === 'base' ? next.base : next.overrides[selected.idx].chain;
                mutator(chain);
                return next;
            });

            const usedLayers = new Set(parsed.overrides.flatMap((o) => o.layers));
            const availableLayers = layerNames.map((_, i) => i).filter((i) => !usedLayers.has(i));

            const addOverride = (layerIdx) => {
                setParsed((prev) => ({ ...prev, overrides: [...prev.overrides, { id: null, layers: [layerIdx], chain: parseChain([]) }] }));
                setSelected({ type: 'override', idx: parsed.overrides.length });
            };
            const removeOverride = (idx) => {
                setParsed((prev) => ({ ...prev, overrides: prev.overrides.filter((_, i) => i !== idx) }));
                if (selected.type === 'override' && selected.idx === idx) setSelected({ type: 'base' });
                else if (selected.type === 'override' && selected.idx > idx) setSelected({ type: 'override', idx: selected.idx - 1 });
            };

            if (!activeChain) return null;
            const advancedCount = (activeChain.extra?.length || 0) + (activeChain.extraFlags?.length || 0);
            const ratio = activeChain.multiplier / activeChain.divisor;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onClick={onClose}>
                    <div data-testid="touchpad-modal" className="bg-app-surface border border-app-borderHighlight rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-6 py-4 border-b border-app-borderHighlight shrink-0">
                            <h3 className="text-base font-bold text-app-text flex items-center gap-2">
                                <svg className="w-5 h-5 text-app-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2" strokeWidth="1.8"></rect><path d="M3 15h18" strokeWidth="1.8" strokeLinecap="round"></path></svg>
                                {TOUCHPAD_LABEL_BY_INDEX[index]}
                            </h3>
                            <button onClick={onClose} className="text-app-textMuted hover:text-app-text text-xl leading-none">&times;</button>
                        </div>

                        <div className="flex flex-1 min-h-0">
                            <div className="w-48 shrink-0 border-r border-app-borderHighlight overflow-y-auto p-3 flex flex-col gap-1">
                                <button onClick={() => setSelected({ type: 'base' })} className={`text-left px-3 py-2.5 rounded-lg text-xs font-bold transition-all ${selected.type === 'base' ? 'bg-app-accent text-white shadow-sm' : 'text-app-text hover:bg-app-card'}`}>
                                    Default
                                    <div className={`text-[10px] font-medium mt-0.5 ${selected.type === 'base' ? 'text-white/70' : 'text-app-textMuted'}`}>All other layers</div>
                                </button>
                                {parsed.overrides.map((ov, i) => (
                                    <div key={i} className={`group flex items-center rounded-lg transition-all ${selected.type === 'override' && selected.idx === i ? 'bg-app-accent text-white shadow-sm' : 'hover:bg-app-card'}`}>
                                        <button onClick={() => setSelected({ type: 'override', idx: i })} className="flex-1 text-left px-3 py-2.5 text-xs font-bold min-w-0 truncate">
                                            {ov.layers.map((l) => layerNames[l] || `Layer ${l}`).join(', ')}
                                        </button>
                                        <button onClick={() => removeOverride(i)} title="Remove this override" className={`w-7 h-7 mr-1 rounded flex items-center justify-center shrink-0 transition-colors ${selected.type === 'override' && selected.idx === i ? 'text-white/70 hover:text-white hover:bg-white/10' : 'text-app-textMuted hover:text-red-400 hover:bg-red-900/30'}`}>🗑️</button>
                                    </div>
                                ))}
                                {availableLayers.length > 0 && (
                                    <select value="" onChange={(e) => addOverride(Number(e.target.value))} className="mt-1 w-full bg-app-card border border-dashed border-app-borderHighlight text-app-textMuted text-xs font-semibold rounded-lg px-2.5 py-2 outline-none cursor-pointer hover:text-app-text hover:border-app-textMuted transition-colors">
                                        <option value="" disabled>+ Add layer override…</option>
                                        {availableLayers.map((i) => <option key={i} value={i}>{layerNames[i] || `Layer ${i}`}</option>)}
                                    </select>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Behavior</label>
                                    <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight w-fit">
                                        <button onClick={() => updateChain((c) => { c.mode = 'movement'; })} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${activeChain.mode === 'movement' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Movement</button>
                                        <button onClick={() => updateChain((c) => { c.mode = 'scroll'; })} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${activeChain.mode === 'scroll' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Scroll</button>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <div className="flex items-center justify-between">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Sensitivity</label>
                                        <label className="flex items-center gap-2 text-xs font-semibold text-app-textMuted cursor-pointer select-none">
                                            <input type="checkbox" checked={activeChain.disabled} onChange={(e) => updateChain((c) => { c.disabled = e.target.checked; })} className="accent-app-accent w-3.5 h-3.5" />
                                            Disable
                                        </label>
                                    </div>
                                    <div className={`flex items-center gap-3 ${activeChain.disabled ? 'opacity-40 pointer-events-none' : ''}`}>
                                        <input type="range" min="1" max="16" step="1" value={activeChain.multiplier} onChange={(e) => updateChain((c) => { c.multiplier = Number(e.target.value); })} className="flex-1 accent-app-accent" />
                                        <div className="flex items-center gap-1 text-xs font-mono text-app-textMuted shrink-0">
                                            <input type="number" min="1" value={activeChain.multiplier} onChange={(e) => updateChain((c) => { c.multiplier = Math.max(1, Number(e.target.value) || 1); })} className="w-12 bg-app-card border border-app-borderHighlight rounded px-1.5 py-1 text-center outline-none" />
                                            <span>/</span>
                                            <input type="number" min="1" value={activeChain.divisor} onChange={(e) => updateChain((c) => { c.divisor = Math.max(1, Number(e.target.value) || 1); })} className="w-12 bg-app-card border border-app-borderHighlight rounded px-1.5 py-1 text-center outline-none" />
                                        </div>
                                        <span className="text-xs font-bold text-app-accent w-12 text-right shrink-0">×{ratio.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Orientation</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => updateChain((c) => { c.flipX = !c.flipX; })} className={`flex-1 py-2 text-xs font-bold rounded-lg border transition-all ${activeChain.flipX ? 'bg-app-accent text-white border-app-accent shadow-sm' : 'border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card'}`}>Flip Horizontal</button>
                                        <button onClick={() => updateChain((c) => { c.flipY = !c.flipY; })} className={`flex-1 py-2 text-xs font-bold rounded-lg border transition-all ${activeChain.flipY ? 'bg-app-accent text-white border-app-accent shadow-sm' : 'border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card'}`}>Flip Vertical</button>
                                        <button onClick={() => updateChain((c) => { c.swapped = !c.swapped; })} className={`flex-1 py-2 text-xs font-bold rounded-lg border transition-all ${activeChain.swapped ? 'bg-app-accent text-white border-app-accent shadow-sm' : 'border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card'}`}>Swap X/Y</button>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Mouse Click</label>
                                    <div className="flex flex-wrap gap-2">
                                        {Object.keys(CLICK_TARGET_LABELS).map((target) => (
                                            <button
                                                key={target}
                                                onClick={() => updateChain((c) => { c.clickTarget = target; })}
                                                title={UNVERIFIED_CLICK_TARGETS.includes(target) ? 'Uses MoErgo\'s naming pattern for click remaps — not yet confirmed against a real export. Flag it if your firmware doesn\'t build.' : undefined}
                                                className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-all ${activeChain.clickTarget === target ? 'bg-app-accent text-white border-app-accent shadow-sm' : 'border-app-borderHighlight text-app-textMuted hover:text-app-text bg-app-card'}`}
                                            >
                                                {CLICK_TARGET_LABELS[target]}
                                                {UNVERIFIED_CLICK_TARGETS.includes(target) && <span className="ml-1 opacity-60">†</span>}
                                            </button>
                                        ))}
                                    </div>
                                    {UNVERIFIED_CLICK_TARGETS.includes(activeChain.clickTarget) && (
                                        <p className="text-[11px] text-app-textMuted italic">† This target's devicetree name follows MoErgo's confirmed pattern but hasn't been verified against a real export yet — let us know if your firmware fails to build with it selected.</p>
                                    )}
                                </div>

                                <div className="flex flex-col gap-3 pt-2 border-t border-app-borderHighlight">
                                    <label className="flex items-center justify-between gap-3 cursor-pointer select-none">
                                        <div>
                                            <span className="text-xs font-bold text-app-text">Temporary Layer</span>
                                            <p className="text-[11px] text-app-textMuted mt-0.5">Enable a layer while this trackpad keeps receiving events, then fall back automatically.</p>
                                        </div>
                                        <span className="relative inline-block w-10 h-5 shrink-0">
                                            <input type="checkbox" checked={!!activeChain.tempLayer} onChange={(e) => updateChain((c) => { c.tempLayer = e.target.checked ? { layer: 0, timeoutMs: 1000 } : null; })} className="peer sr-only" />
                                            <span className="absolute inset-0 rounded-full bg-app-card border border-app-borderHighlight peer-checked:bg-app-accent peer-checked:border-app-accent transition-colors"></span>
                                            <span className="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
                                        </span>
                                    </label>
                                    {activeChain.tempLayer && (
                                        <div className="flex items-center gap-3 pl-1">
                                            <select value={activeChain.tempLayer.layer} onChange={(e) => updateChain((c) => { c.tempLayer.layer = Number(e.target.value); })} className="flex-1 bg-app-card border border-app-borderHighlight text-app-text text-xs font-semibold rounded-lg px-2.5 py-2 outline-none cursor-pointer">
                                                {layerNames.map((name, i) => <option key={i} value={i}>{name || `Layer ${i}`}</option>)}
                                            </select>
                                            <div className="flex items-center gap-1.5 text-xs font-mono text-app-textMuted shrink-0">
                                                <input type="number" min="100" step="100" value={activeChain.tempLayer.timeoutMs} onChange={(e) => updateChain((c) => { c.tempLayer.timeoutMs = Math.max(100, Number(e.target.value) || 1000); })} className="w-20 bg-app-card border border-app-borderHighlight rounded px-1.5 py-1.5 text-center outline-none" />
                                                <span>ms timeout</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {advancedCount > 0 && (
                                    <p className="text-[11px] text-app-textMuted italic">This chain also has {advancedCount} advanced setting{advancedCount > 1 ? 's' : ''} not shown here — they'll be kept exactly as they are.</p>
                                )}
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 px-6 py-4 border-t border-app-borderHighlight shrink-0">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-xl text-xs font-bold border border-app-borderHighlight text-app-textMuted hover:text-app-text hover:bg-app-card transition-all">Cancel</button>
                            <button onClick={() => onSave(parsed)} className="px-5 py-2.5 rounded-xl text-xs font-bold btn-active shadow-lg border-none hover:-translate-y-px transition-all">Apply</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CapabilitiesModal = ({
            isOpen, onClose, config, catalog,
            selectedCategory, onSelectCategory, selectedUid, onSelectUid,
            paramValues, onParamChange, isApplying, onApply,
            searchText, onSearchTextChange, results,
            engineStatus, onRetryEngine,
        }) => {
            if (!isOpen) return null;
            const selected = catalog.find((f) => f.uid === selectedUid) || null;
            const searching = searchText.trim().length > 0;
            const filtered = catalog.filter((f) => {
                if (!searching) return f.category === selectedCategory;
                const q = searchText.toLowerCase();
                return f.title.toLowerCase().includes(q) || f.subtitle.toLowerCase().includes(q) || f.category.toLowerCase().includes(q);
            });
            const categories = [...new Set(catalog.map((f) => f.category))];
            const countByCategory = {};
            catalog.forEach((f) => { countByCategory[f.category] = (countByCategory[f.category] || 0) + 1; });

            // Three screens share this one modal: the category grid (the app-store "home"),
            // a category's own list of automations, and one automation's detail + result box.
            let body;
            if (selected) {
                const result = results[selected.uid];
                body = (
                    <div className="flex flex-col gap-4">
                        <button onClick={() => onSelectUid(null)} className="text-[11px] font-bold text-app-textMuted hover:text-app-text transition-colors flex items-center gap-1 self-start">← Back to {selected.category}</button>
                        <div className="flex items-start gap-3">
                            <span className="text-2xl shrink-0">{selected.manifest.icon}</span>
                            <div className="min-w-0">
                                <div className="font-bold text-sm text-app-text">{selected.title}</div>
                                {selected.subtitle && <div className="text-xs text-app-textMuted">{selected.subtitle}</div>}
                                <div className="text-[10px] text-app-textMuted/70 mt-0.5">{flowHardwareLabel(selected)}</div>
                            </div>
                        </div>
                        {selected.description && <p className="text-xs text-app-textMuted leading-relaxed whitespace-pre-wrap">{selected.description}</p>}
                        <FlowParamForm
                            params={selected.param}
                            values={paramValues[selected.uid]}
                            onChange={(id, val) => onParamChange(selected.uid, id, val)}
                        />
                        {/* The jq-web engine loads lazily, the first time this modal opens
                            (glide.html's ensureJqEngineLoaded) — a real user won't have to wait
                            for it at every startup, only the first time they actually use this
                            feature, and only ever see this once per session. */}
                        {engineStatus === 'error' ? (
                            <div className="text-[11px] rounded-lg px-3 py-2.5 border border-red-600/30 bg-red-950/40 text-red-200 flex items-center justify-between gap-3">
                                <span>Couldn't load the automation engine — check your connection.</span>
                                <button onClick={onRetryEngine} className="shrink-0 font-bold underline hover:no-underline">Retry</button>
                            </div>
                        ) : (

        const FLAT_GRID_TABS = ['Basic', 'Media', 'SpecialKeys', 'Custom'];

        }
        const ALL_PALETTE_SECTIONS = [...PALETTE_DATA.Basic, ...PALETTE_DATA.Media, ...PALETTE_DATA.SpecialKeys, ...PALETTE_DATA.Custom];

        // assignment (PALETTE_DATA/searchAcrossAllPalette/ALL_PALETTE_SECTIONS) so a macro's
        // behavior steps are picked from the exact same familiar grid, rather than a second,
        // divergent list of keycodes.
        function bindingFromPaletteItem(item) {
            if (item.code) return { value: '&kp', params: [composeKeycodeParam(item.code, [])] };
            if (item.type) {
                const binding = { value: item.type };
                if (item.param1 !== undefined) {
                    binding.params = [{ value: item.param1, params: [] }];
                    if (item.param2 !== undefined) binding.params.push({ value: item.param2, params: [] });
                }
                return binding;
            }
            return { value: '&none' };
        }

        function describeBindingParam(p) {
            const inner = (p.params || []).map(describeBindingParam).join(' ');
            return inner ? `${p.value}(${inner})` : String(p.value);
        }
        function describeBindingStep(binding) {
            if (!binding || !binding.value) return '(empty)';
            const name = binding.value.replace(/^&/, '');
            const params = (binding.params || []).map(describeBindingParam).join(' ');
            return params ? `${name} ${params}` : name;
        }

        const MACRO_MODE_LABELS = { tap: 'Tap', press: 'Press', release: 'Release' };

        const MACRO_STEP_KIND_OPTIONS = [
            { value: 'behavior', label: 'Key / Behavior' },
            { value: 'mode:tap', label: 'Mode: Tap' },
            { value: 'mode:press', label: 'Mode: Press' },
            { value: 'mode:release', label: 'Mode: Release' },

            { value: 'paramForward:2:2', label: 'Forward Param 2→2' },

        function defaultMacroStepForKind(kind) {
            if (kind === 'behavior') return { kind: 'behavior', binding: { value: '&kp', params: [{ value: 'A', params: [] }] } };
            if (kind.startsWith('mode:')) return { kind: 'mode', mode: kind.split(':')[1] };
            if (kind === 'pauseForRelease') return { kind: 'pauseForRelease' };
            if (kind === 'waitTime') return { kind: 'waitTime', ms: 0 };
            if (kind === 'tapTime') return { kind: 'tapTime', ms: 0 };
            if (kind.startsWith('paramForward:')) { const [, from, to] = kind.split(':'); return { kind: 'paramForward', from: Number(from), to: Number(to) }; }
            return { kind: 'behavior', binding: { value: '&kp', params: [{ value: 'A', params: [] }] } };
        }

        const MacroBuilderModal = ({ name, config, layerNames, onClose, onSave }) => {
            const macro = (config.macros || []).find((m) => m.name === name);
            const [parsed, setParsed] = useState(() => parseMacro(macro));
            const [nameField, setNameField] = useState(() => (macro?.name || '').replace(/^&/, ''));
            const [stepPickerIdx, setStepPickerIdx] = useState(null);
            const [stepSearch, setStepSearch] = useState('');

            if (!macro) return null;

            const updateSteps = (mutator) => setParsed((prev) => {
                const next = structuredClone(prev);
                mutator(next.steps);
                return next;
            });
            const addStep = (step) => { updateSteps((steps) => { steps.push(step); }); if (step.kind === 'behavior') setStepPickerIdx(parsed.steps.length); };
            const removeStep = (i) => { updateSteps((steps) => { steps.splice(i, 1); }); if (stepPickerIdx === i) setStepPickerIdx(null); };
            const moveStep = (i, dir) => updateSteps((steps) => {
                const j = i + dir;
                if (j < 0 || j >= steps.length) return;
                const tmp = steps[i]; steps[i] = steps[j]; steps[j] = tmp;
            });
            const updateStep = (i, patch) => updateSteps((steps) => { steps[i] = { ...steps[i], ...patch }; });

                let finalName = macro.name;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onClick={onClose}>
