    <style>

    <script type="text/babel">


const { useState, useEffect, useMemo, useCallback, memo, useRef } = React;

        const SLOT_LINK_LABELS = { shiftTap: 'when tapped with Shift', hold: 'when held', doubleTap: 'when double-tapped', label: 'add text label to the key' };
       

        // GLIDE's naming convention for behaviors it generates. The "ht"/"mm"/"td" segment is kept
        // immediately after GLIDE_ (rather than a fully flat &GLIDE_<ids>) because two different
        // behavior kinds can compute the same identifier suffix from unrelated keys (e.g. a hold-tap
        // of hold=N1/tap=F4 and a mod-morph of tap=N1/shiftTap=F4 both reduce to "N1_F4") — behavior
        // names must be globally unique in the exported ZMK devicetree, so without a type marker two

        const detectOs = () => { const platform = navigator.userAgent.toLowerCase(); if (platform.includes('mac')) return 'mac'; if (platform.includes('linux')) return 'linux'; return 'win'; };








        const MiniKeyboardMap = memo(({ geo, selectedKeys = [], onKeyToggle, readonly = false, size = 140 }) => {
            const bounds = useMemo(() => computeGeoBounds(geo), [geo]);
            const containerRef = useRef(null);
            const [scale, setScale] = useState(0.2);

            useEffect(() => {
                if (containerRef.current) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const scaleX = (rect.width - 20) / bounds.w;
                    const scaleY = (rect.height - 20) / bounds.h;
                    setScale(Math.min(scaleX, scaleY, 0.35));
                }
            }, [bounds, size]);

            return (
                <div ref={containerRef} style={{ height: `${size}px` }} className="relative overflow-hidden flex items-center justify-center rounded-xl w-full bg-app-panel/30 border border-app-borderHighlight shadow-inner">
                    <div className="relative" style={{ width: bounds.w * scale, height: bounds.h * scale }}>
                        {geo.map((k, i) => {
                            const isSel = selectedKeys.includes(i);
                            return (
                                <div key={i} onClick={(e) => { e.stopPropagation(); if (!readonly && onKeyToggle) onKeyToggle(i); }}
                                     style={{
                                         position: 'absolute',
                                         left: (k.x - bounds.minX) * scale,
                                         top: (k.y - bounds.minY) * scale,
                                         width: (k.w || KEY_SIZE) * scale,
                                         height: (k.h || KEY_SIZE) * scale,

                                     }}
                                />
                            )
                        })}

        // The Omni-Shift Engine: Protects Keycaps & Combos during Layer changes.

                { category: "Numbers", items: [ { top: '!', bottom: '1', code: 'N1' }, { top: '@', bottom: '2', code: 'N2' }, { top: '#', bottom: '3', code: 'N3' }, { top: '$', bottom: '4', code: 'N4' }, { top: '%', bottom: '5', code: 'N5' }, { top: '^', bottom: '6', code: 'N6' }, { top: '&', bottom: '7', code: 'N7' }, { top: '*', bottom: '8', code: 'N8' }, { top: '(', bottom: '9', code: 'N9' }, { top: ')', bottom: '0', code: 'N0' } ] },

            ],
            Media: [ { category: "Media & Editing", items: [{ label: 'Vol -', code: 'C_VOL_DN' }, { label: 'Vol +', code: 'C_VOL_UP' }, { label: 'Mute', code: 'C_MUTE' }, { label: 'Play', code: 'C_PP' }, { label: 'Mstp', code: 'C_STOP' }, { label: 'Prvs', code: 'C_PREV' }, { label: 'Next', code: 'C_NEXT' }, { label: 'Rewind', code: 'C_RW' }, { label: 'Mffd', code: 'C_FF' }, { label: 'Select', code: 'C_AL_SEL_TASK' }, { label: 'Eject', code: 'C_EJECT' }] } ],

            ]
        };

        const FLAT_GRID_TABS = ['Basic', 'Media', 'SpecialKeys', 'Custom'];
        function searchAcrossAllPalette(query) {
            if (!query.trim()) return []; const results = []; const q = query.trim().toLowerCase();
            FLAT_GRID_TABS.forEach(tabName => { const sections = PALETTE_DATA[tabName] || []; sections.forEach(section => { const matched = section.items.filter(item => [item.label, item.top, item.bottom, item.code].filter(Boolean).join(' ').toLowerCase().includes(q)); if (matched.length > 0) results.push({ tabName, category: section.category, items: matched }); }); }); return results;
        }
        const ALL_PALETTE_SECTIONS = [...PALETTE_DATA.Basic, ...PALETTE_DATA.Media, ...PALETTE_DATA.SpecialKeys, ...PALETTE_DATA.Custom];

        const MOD_ARM_ORDER = ['LC', 'RC', 'LA', 'RA', 'LS', 'RS', 'LG', 'RG'];
        const MOD_BASES = [
            { base: 'C', mac: '⌃', win: 'Ctrl', linux: 'Ctrl', nameMac: 'Control', nameWin: 'Control', nameLinux: 'Control' },
            { base: 'A', mac: '⌥', win: 'Alt', linux: 'Alt', nameMac: 'Option', nameWin: 'Alt', nameLinux: 'Alt' },
            { base: 'S', mac: '⇧', win: '⇧', linux: '⇧', nameMac: 'Shift', nameWin: 'Shift', nameLinux: 'Shift' },

        const KEY_COLOR_PRESETS = ['#e5484d', '#f76b15', '#f5d90a', '#46a758', '#12a594', '#0091ff', '#8e4ec6', '#e93d82'];






        const getContrastColor = (hexcolor) => {
            if (!hexcolor) return '#ffffff';
            let cleanHex = hexcolor.replace("#", "");
            if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(c => c+c).join('');

                                    <button onClick={() => setShowSettings(false)} className="text-app-textMuted hover:text-app-text text-xl">&times;</button>
                                </div>
                                <div className="space-y-6">
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Color Theme</label>
                                        <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight">
                                            <button onClick={() => setThemeClass('oled')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'oled' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>OLED Dark</button>
                                            <button onClick={() => setThemeClass('dark')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'dark' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Pro Dark</button>
                                            <button onClick={() => setThemeClass('light')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${themeClass === 'light' ? 'bg-app-accent text-white shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Light</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Editor Layout Location</label>
                                        <div className="flex gap-2 bg-app-card p-1 rounded-xl border border-app-borderHighlight">
                                            <button onClick={() => setLayoutMode('bottom')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${layoutMode === 'bottom' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Bottom Pane</button>
                                            <button onClick={() => setLayoutMode('right')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${layoutMode === 'right' ? 'bg-app-borderHighlight text-app-text shadow-sm' : 'text-app-textMuted hover:text-app-text'}`}>Right Sidebar</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Target OS (Keycaps)</label>
                                        <select value={osSetting} onChange={(e) => setOsSetting(e.target.value)} className="bg-app-card border border-app-borderHighlight text-app-text text-sm rounded-lg px-4 py-2.5 outline-none shadow-sm cursor-pointer">
                                            <option value="auto">Auto-Detect ({detectOs().toUpperCase()})</option>
                                            <option value="mac">macOS (⌘)</option><option value="win">Windows (⊞)</option><option value="linux">Linux (❖)</option>
                                        </select>
                                    </div>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="mt-8 w-full btn-active font-bold py-3 rounded-xl transition-all shadow-lg hover:-translate-y-px">Done</button>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-xs font-bold shadow-2xl border transition-all animate-bounce ${toast.kind === 'error' ? 'bg-red-950 border-red-600 text-red-200' : 'bg-app-panel border-app-borderHighlight text-app-text'}`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
