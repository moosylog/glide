    {
            "uid": "s_theme_colors",
            "title": "Smart Theme Colorizer",
            "subtitle": "Visual Themes, Macros & OS Swaps",
            "description": "Colors your keys automatically based on what they do and your chosen visual theme — home-row keys, and shortcuts like Copy/Paste/Search/Navigation, matched to macOS or Windows.\n\nRun it again with Execution Mode set to **Clean Slate** to remove all the colors it added.",
            "script": "# =========================================================\r\n# 🛠️ USER CONFIGURATION ZONE \r\n# =========================================================\r\n\r\n# --- 1. COLOR PALETTE CLASS ---\r\n(if $theme == \"engrammer\" then {\r\n  pinky: \"#ffcdd2\", ring: \"#bbdefb\", middy: \"#dcedc8\", index: \"#ffecb3\",\r\n  clipboard: \"#ffecb3\", app: \"#ffcdd2\", system: \"#dcedc8\", nav: \"#bbdefb\", select: \"#e0ebf6\", browser: \"#fbe6fe\"\r\n} elif $theme == \"tailorkey\" then {\r\n  pinky: \"#fbe6fe\", ring: \"#e5feff\", middy: \"#d9f9c9\", index: \"#fffec9\",\r\n  clipboard: \"#fffec9\", app: \"#fbe6fe\", system: \"#f8e6d7\", nav: \"#d9f9c9\", select: \"#e0ebf6\", browser: \"#fbe6fe\"\r\n} elif $theme == \"nordic\" then {\r\n  pinky: \"#eceff4\", ring: \"#d8dee9\", middy: \"#b3d4e0\", index: \"#a3c9c6\",\r\n  clipboard: \"#f0e2b6\", app: \"#e8b4b8\", system: \"#c4d7b2\", nav: \"#b3d4e0\", select: \"#a3c9c6\", browser: \"#d2c4d4\"\r\n} elif $theme == \"sunset\" then {\r\n  pinky: \"#ffc8a2\", ring: \"#ffb7b2\", middy: \"#e2f0cb\", index: \"#b5ead7\",\r\n  clipboard: \"#fff2b2\", app: \"#ff9aa2\", system: \"#ffd3b6\", nav: \"#c7ceea\", select: \"#b5ead7\", browser: \"#e2b6cf\"\r\n} else {} end) as $pal |\r\n\r\n# --- 2. DYNAMIC OS MODIFIER ---\r\n(if $os == \"mac\" then \"LG\" else \"LC\" end) as $mod |\r\n\r\n# --- 3. CATEGORIZED SEARCH MAP ---\r\n# Use `os: \"mac\"` or `os: \"win\"` to restrict a shortcut. If omitted, it applies to both!\r\n(\r\n  [\r\n    {\r\n      bg: $pal.clipboard,\r\n      items: {\r\n        \"&kp(__MOD__(C))\": { icon: \"fa-copy\", label: \"Copy\" },\r\n        \"&kp(__MOD__(V))\": { icon: \"fa-paste\", label: \"Paste\" },\r\n        \"&kp(__MOD__(X))\": { icon: \"fa-cut\", label: \"Cut\" },\r\n        \"&kp(__MOD__(A))\": { label: \"Select All\" },\r\n        \"&kp(__MOD__(Z))\": { icon: \"fa-undo\", label: \"Undo\" },\r\n        \"&kp(__MOD__(Y))\": { icon: \"fa-redo\", label: \"Redo\", os: \"win\" },\r\n        \"&kp(LS(__MOD__(Z)))\": { icon: \"fa-redo\", label: \"Redo\" },\r\n        \"&kp(__MOD__(LS(Z)))\": { icon: \"fa-redo\", label: \"Redo\" }\r\n      }\r\n    },\r\n    {\r\n      bg: $pal.app,\r\n      items: {\r\n        \"&kp(__MOD__(S))\": { icon: \"fa-save\", label: \"Save\" },\r\n        \"&kp(__MOD__(N))\": { icon: \"fa-plus\", label: \"New\" },\r\n        \"&kp(__MOD__(O))\": { icon: \"fa-folder-open\", label: \"Open\" },\r\n        \"&kp(__MOD__(P))\": { icon: \"fa-print\", label: \"Print\" },\r\n        \"&kp(__MOD__(W))\": { icon: \"fa-times\", label: \"Close\" },\r\n        \"&kp(LG(Q))\": { icon: \"fa-power-off\", label: \"Quit App\", os: \"mac\" },\r\n        \"&kp(LA(F4))\": { icon: \"fa-power-off\", label: \"Quit App\", os: \"win\" },\r\n        \"&kp(LG(H))\": { icon: \"fa-eye-slash\", label: \"Hide App\", os: \"mac\" },\r\n        \"&kp(LG(DOWN))\": { icon: \"fa-eye-slash\", label: \"Min App\", os: \"win\" },\r\n        \"&kp(LG(E))\": { icon: \"fa-folder\", label: \"Explorer\", os: \"win\" }\r\n      }\r\n    },\r\n    {\r\n      bg: $pal.system,\r\n      items: {\r\n        \"&kp(__MOD__(F))\": { icon: \"fa-search\", label: \"Find\" },\r\n        \"&kp(__MOD__(G))\": { icon: \"fa-search-plus\", label: \"Next\" },\r\n        \"&kp(__MOD__(LS(G)))\": { icon: \"fa-search-minus\", label: \"Prev\" },\r\n        \r\n        \"&kp(LG(SPACE))\": { icon: \"fa-search\", label: \"Spotlight\", os: \"mac\" },\r\n        \"&kp(LG(S))\": { icon: \"fa-search\", label: \"Search\", os: \"win\" },\r\n        \"&kp(LG(D))\": { icon: \"fa-desktop\", label: \"Desktop\", os: \"win\" },\r\n        \r\n        \"&kp(LA(TAB))\": { icon: \"fa-exchange-alt\", label: \"Switch App\", os: \"win\" },\r\n        \"&kp(LG(TAB))\": { icon: \"fa-tasks\", label: \"Switch / Tasks\" },\r\n        \"&kp(LC(UP))\": { icon: \"fa-th-large\", label: \"Mission Ctrl\", os: \"mac\" },\r\n        \r\n        \"&kp(LG(GRAVE))\": { icon: \"fa-window-restore\", label: \"Next Win\", os: \"mac\" },\r\n        \"&kp(LA(ESC))\": { icon: \"fa-window-restore\", label: \"Next Win\", os: \"win\" },\r\n        \r\n        \"&kp(LG(L))\": { icon: \"fa-lock\", label: \"Lock\", os: \"win\" },\r\n        \"&kp(LC(LG(Q)))\": { icon: \"fa-lock\", label: \"Lock\", os: \"mac\" },\r\n        \r\n        \"&kp(PRINTSCREEN)\": { icon: \"fa-camera\", label: \"Screenshot\", os: \"win\" },\r\n        \"&kp(LS(LG(S)))\": { icon: \"fa-crop\", label: \"Snip Tool\", os: \"win\" },\r\n        \"&kp(LS(LG(N4)))\": { icon: \"fa-crop\", label: \"Screenshot\", os: \"mac\" },\r\n        \r\n        \"&kp(LG(DOT))\": { icon: \"fa-smile\", label: \"Emoji\", os: \"win\" },\r\n        \"&kp(LC(LG(SPACE)))\": { icon: \"fa-smile\", label: \"Emoji\", os: \"mac\" },\r\n\r\n        \"&kp(RET)\": { },\r\n        \"&kp(ESC)\": { },\r\n        \"&kp(BSPC))\": { icon: \"fa-backspace\" },\r\n        \"&kp(SPACE))\": { icon: \"fa-space\" }\r\n      }\r\n    },\r\n    {\r\n      bg: $pal.nav,\r\n      items: {\r\n        \"&kp(HOME)\": { label:  \"\"  },\r\n        \"&kp(END)\": { label:  \"\"  },\r\n        \"&kp(UP)\": { label:  \"\"  },\r\n        \"&kp(DOWN)\": { label:  \"\" },\r\n        \"&kp(LEFT)\": { label:  \"\"  },\r\n        \"&kp(RIGHT)\": { label:  \"\" },\r\n        \"&kp(PG_UP)\": { description: \"Page Up\" },\r\n        \"&kp(PG_DN)\": { description: \"Page Down\" },\r\n\r\n        \"&kp(LG(LEFT))\": { icon: \"fa-step-backward\", label: \"Line Start\", os: \"mac\" },\r\n        \"&kp(LG(RIGHT))\": { icon: \"fa-step-forward\", label: \"Line End\", os: \"mac\" },\r\n        \r\n        \"&kp(LC(HOME))\": { icon: \"fa-fast-backward\", label: \"Doc Top\", os: \"win\" },\r\n        \"&kp(LG(UP))\": { icon: \"fa-fast-backward\", label: \"Doc Top\", os: \"mac\" },\r\n        \"&kp(LC(END))\": { icon: \"fa-fast-forward\", label: \"Doc Bottom\", os: \"win\" },\r\n        \"&kp(LG(DOWN))\": { icon: \"fa-fast-forward\", label: \"Doc Bottom\", os: \"mac\" },\r\n        \r\n        \"&kp(LC(LEFT))\": { icon: \"fa-angle-double-left\", label: \"Prev Word\", os: \"win\" },\r\n        \"&kp(LA(LEFT))\": { icon: \"fa-angle-double-left\", label: \"Prev Word\", os: \"mac\" },\r\n        \"&kp(LC(RIGHT))\": { icon: \"fa-angle-double-right\", label: \"Next Word\", os: \"win\" },\r\n        \"&kp(LA(RIGHT))\": { icon: \"fa-angle-double-right\", label: \"Next Word\", os: \"mac\" },\r\n\r\n        \"&kp(LC(BSPC))\": {  label: \"Del Word\", os: \"win\" },\r\n        \"&kp(LA(BSPC))\": {  label: \"Del Word\", os: \"mac\" },\r\n        \"&kp(LG(BSPC))\": {  label: \"Del Line\", os: \"mac\" }\r\n      }\r\n    },\r\n    {\r\n      bg: $pal.select,\r\n      items: {\r\n        \"&kp(LS(HOME))\": { icon: \"fa-outdent\", label: \"Sel Start\", os: \"win\" },\r\n        \"&kp(LS(LG(LEFT)))\": { icon: \"fa-outdent\", label: \"Sel Start\", os: \"mac\" },\r\n        \"&kp(LS(END))\": { icon: \"fa-indent\", label: \"Sel End\", os: \"win\" },\r\n        \"&kp(LS(LG(RIGHT)))\": { icon: \"fa-indent\", label: \"Sel End\", os: \"mac\" },\r\n        \r\n        \"&kp(LS(LC(HOME)))\": { icon: \"fa-level-up-alt\", label: \"Sel Top\", os: \"win\" },\r\n        \"&kp(LS(LG(UP)))\": { icon: \"fa-level-up-alt\", label: \"Sel Top\", os: \"mac\" },\r\n        \"&kp(LS(LC(END)))\": { icon: \"fa-level-down-alt\", label: \"Sel Bottom\", os: \"win\" },\r\n        \"&kp(LS(LG(DOWN)))\": { icon: \"fa-level-down-alt\", label: \"Sel Bottom\", os: \"mac\" },\r\n\r\n        \"&kp(LS(LC(LEFT)))\": { icon: \"fa-angle-left\", label: \"Sel Prev\", os: \"win\" },\r\n        \"&kp(LS(LA(LEFT)))\": { icon: \"fa-angle-left\", label: \"Sel Prev\", os: \"mac\" },\r\n        \"&kp(LS(LC(RIGHT)))\": { icon: \"fa-angle-right\", label: \"Sel Next\", os: \"win\" },\r\n        \"&kp(LS(LA(RIGHT)))\": { icon: \"fa-angle-right\", label: \"Sel Next\", os: \"mac\" }\r\n      }\r\n    },\r\n    {\r\n      bg: $pal.browser,\r\n      items: {\r\n        \"&kp(__MOD__(L))\": { icon: \"fa-link\", label: \"Focus URL\" },\r\n        \"&kp(__MOD__(T))\": { icon: \"fa-plus-square\", label: \"New Tab\" },\r\n        \"&kp(LS(__MOD__(T)))\": { icon: \"fa-history\", label: \"Reopen Tab\" },\r\n        \"&kp(LC(TAB))\": { icon: \"fa-chevron-right\", label: \"Next Tab\" },\r\n        \"&kp(LS(LC(TAB)))\": { icon: \"fa-chevron-left\", label: \"Prev Tab\" },\r\n        \"&kp(__MOD__(R))\": { icon: \"fa-sync\", label: \"Refresh\" },\r\n        \"&kp(LS(__MOD__(R)))\": { icon: \"fa-sync-alt\", label: \"Hard Refresh\" },\r\n        \"&kp(LC(F5))\": { icon: \"fa-sync-alt\", label: \"Hard Refresh\", os: \"win\" }\r\n      }\r\n    }\r\n  ] \r\n  | map(.bg as $bg | .items | with_entries(\r\n      select(.value.os == null or .value.os == \"both\" or .value.os == $os) |\r\n      .key |= gsub(\"__MOD__\"; $mod) | \r\n      .value.background = $bg |\r\n      .value |= del(.os)\r\n    )) \r\n  | add\r\n) as $logical_map |\r\n\r\n\r\n# =========================================================\r\n# ⚙️ INTERNAL ENGINE \r\n# =========================================================\r\n\r\n(.keyboard? | if type == \"string\" then ascii_downcase else \"glove80\" end) as $kb |\r\n\r\n# --- HARDWARE INDEX MAP ---\r\n(if $kb == \"glove80\" then {\r\n  \"35\": \"left.pinky\", \"36\": \"left.ring\", \"37\": \"left.middy\", \"38\": \"left.index\",\r\n  \"41\": \"right.index\", \"42\": \"right.middy\", \"43\": \"right.ring\", \"44\": \"right.pinky\"\r\n} elif $kb == \"go60\" then {\r\n  \"25\": \"left.pinky\", \"26\": \"left.ring\", \"27\": \"left.middy\", \"28\": \"left.index\",\r\n  \"31\": \"right.index\", \"32\": \"right.middy\", \"33\": \"right.ring\", \"34\": \"right.pinky\"\r\n} else {} end) as $hw_map |\r\n\r\n# --- HOME ROW THEME ASSIGNMENTS (WITH OS SWAP) ---\r\n(if $os == \"mac\" then\r\n  {\r\n    left:  { pinky: {background: $pal.middy, icon: \"fa-align-left\"}, ring: {background: $pal.ring, icon: \"fa-align-left\"}, middy: {background: $pal.pinky, icon: \"fa-align-left\"}, index: {background: $pal.index, icon: \"fa-align-left\"} },\r\n    right: { pinky: {background: $pal.middy, icon: \"fa-align-right\"}, ring: {background: $pal.ring, icon: \"fa-align-right\"}, middy: {background: $pal.pinky, icon: \"fa-align-right\"}, index: {background: $pal.index, icon: \"fa-align-right\"} }\r\n  }\r\nelse\r\n  {\r\n    left:  { pinky: {background: $pal.pinky, icon: \"fa-align-left\"}, ring: {background: $pal.ring, icon: \"fa-align-left\"}, middy: {background: $pal.middy, icon: \"fa-align-left\"}, index: {background: $pal.index, icon: \"fa-align-left\"} },\r\n    right: { pinky: {background: $pal.pinky, icon: \"fa-align-right\"}, ring: {background: $pal.ring, icon: \"fa-align-right\"}, middy: {background: $pal.middy, icon: \"fa-align-right\"}, index: {background: $pal.index, icon: \"fa-align-right\"} }\r\n  }\r\nend) as $homerow_theme |\r\n\r\n# --- MUTATION ENGINE ---\r\n(.keymap // .) |= (\r\n  \r\n  # --- DEEP SEARCH FLATTENER (Completely Type-Safe & Null-Proof) ---\r\n  def GetSignature:\r\n    if type == \"object\" and .value != null then\r\n      (.params // []) as $p |\r\n      if ($p | length > 0) then\r\n        (.value | tostring) + \"(\" + ($p | map(GetSignature) | join(\",\")) + \")\"\r\n      else\r\n        (.value | tostring)\r\n      end\r\n    else\r\n      (. | tostring)\r\n    end;\r\n\r\n  if $mode == \"delete\" then\r\n    # OVERRIDE: Strip ALL decorators from EVERY key on ALL layers\r\n    if .layers then\r\n      .layers |= map(map(if type == \"object\" then del(.decoration) else . end))\r\n    else . end\r\n  else\r\n    # --- APPLY STYLES ---\r\n    if .layers then\r\n      .layers |= [\r\n        range(length) as $layerIdx | .[$layerIdx] |\r\n        [\r\n          range(length) as $keyIdx | .[$keyIdx] |\r\n          \r\n          # A. Resolve Physical Home Row Style (Layer 0 ONLY)\r\n          (if $layerIdx == 0 then $hw_map[$keyIdx | tostring] else null end) as $finger_path |\r\n          (if $finger_path then ($homerow_theme | getpath($finger_path | split(\".\"))) else null end) as $physical_style |\r\n          \r\n          # B. Resolve Logical Search Style (ALL Layers)\r\n          (GetSignature) as $sig |\r\n          ($logical_map[$sig]) as $logical_style |\r\n          \r\n          # C. Priority logic (Logical Macros override Home Row colors)\r\n          (if $logical_style then $logical_style\r\n           elif $physical_style then $physical_style\r\n           else null end) as $target_style |\r\n          \r\n          if $target_style then\r\n            \r\n            # Smart Label Extraction: Only if icon exists AND label is null/blank\r\n            (\r\n              if ($target_style.icon != null and ($target_style.label == null or $target_style.label == \"\")) and type == \"object\" then\r\n                (.params // []) as $p |\r\n                if ($p | length > 1) then\r\n                  (if ($p[1] | type == \"object\") then ($p[1].value // $p[1]) else $p[1] end | tostring)\r\n                elif ($p | length > 0) then\r\n                  (if ($p[0] | type == \"object\") then ($p[0].value // $p[0]) else $p[0] end | tostring)\r\n                else\r\n                  $target_style.label\r\n                end\r\n              else\r\n                $target_style.label\r\n              end\r\n            ) as $final_label |\r\n\r\n            # Compile the decoration payload, explicitly stripping missing properties\r\n            # ONLY strips nulls now. Allows \"\" (empty string) through to blank out labels!\r\n            (\r\n              {\r\n                background: $target_style.background,\r\n                color: $target_style.color,\r\n                icon: $target_style.icon,\r\n                description: $target_style.description,\r\n                label: $final_label\r\n              } | with_entries(select(.value != null))\r\n            ) as $new_dec |\r\n            \r\n            # Apply the dynamic payload securely\r\n            if type == \"object\" then\r\n              .decoration = ((.decoration // {}) + $new_dec)\r\n            else\r\n              { \"value\": ., \"params\": [], \"decoration\": $new_dec }\r\n            end\r\n          else\r\n            .\r\n          end\r\n        ]\r\n      ]\r\n    else . end\r\n  end\r\n)",
            "category": "Decorations & RGB",

    {
            "uid": "glove80_gaming",
            "title": "Gaming Layer 80",
            "subtitle": "Adds a TK/GE Gaming Layer",
            "description": "Adds a dedicated gaming layer (**Gaming**) to your Glove80, mapped for the TailorKey/Glorious Engrammer layout.\n\n⚠️ You still need to assign a key or combo to switch to it.",
            "script": "# 1. SCOPE FINDER\r\n(if .keymap then .keymap else . end) |= (\r\n\r\n  # ----------------------------------------------------------------------------\r\n  # 🛑 SAFETY CHECKS (FAIL FAST)\r\n  # ----------------------------------------------------------------------------\r\n\r\n  # Check 1: Hardware Match\r\n  ((.keyboard // \"unknown\") | ascii_downcase) as $hw_sig |\r\n  if ($hw_sig != \"glove80\") then\r\n    \"Err: Hardware mismatch. Target: 'glove80', Found: '\\\\($hw_sig)'.\" | halt_error\r\n  else . end |\r\n\r\n  # Check 2: Duplication Guard\r\n  if (.layer_names | index(\"Gaming_flows\")) then\r\n    \"Err: Gaming layer exists\" | halt_error\r\n  else . end |\r\n\r\n  # ----------------------------------------------------------------------------\r\n  # 🛠️ HELPERS\r\n  # ----------------------------------------------------------------------------\r\n\r\n  def kp($code):\r\n    { \"value\": \"&kp\", \"params\": [{ \"value\": $code, \"params\": [] }] };\r\n\r\n  def kp_mod($code; $modifier):\r\n    { \"value\": \"&kp\", \"params\": [{ \"value\": $modifier, \"params\": [{ \"value\": $code, \"params\": [] }] }] };\r\n\r\n  # ----------------------------------------------------------------------------\r\n  # 📝 KEYBOARD DATA MAPPING (Glove80 80-Key Matrix)\r\n  # ----------------------------------------------------------------------------\r\n\r\n  [\r\n    # Row 1 (0-9)\r\n    [0,\"ESC\"], [1,\"P\"], [2,\"O\"], [3,\"N\"], [4,\"BSPC\"],\r\n    [5,\"F1\"], [6,\"F2\"], [7,\"F3\"], [8,\"F4\"], [9,\"F5\"],\r\n\r\n    # Row 2 (10-21)\r\n    [10,\"M\"], [11,\"N6\"], [12,\"N7\"], [13,\"N8\"], [14,\"N9\"], [15,\"N0\"],\r\n    [16,\"F6\"], [17,\"F7\"], [18,\"F8\"], [19,\"F9\"], [20,\"F10\"], [21,\"F11\"],\r\n\r\n    # Row 3 (22-33)\r\n    [22,\"I\"], [23,\"N1\"], [24,\"N2\"], [25,\"N3\"], [26,\"N4\"], [27,\"N5\"],\r\n    [28,\"Y\"], [29,\"U\"], [30,\"I\"], [31,\"O\"], [32,\"P\"], [33,\"F12\"],\r\n\r\n    # Row 4 (34-45)\r\n    [34,\"T\"], [35,\"TAB\"], [36,\"Q\"], [37,\"W\"], [38,\"E\"], [39,\"R\"],\r\n    [40,\"H\"], [41,\"J\"], [42,\"K\"], [43,\"L\"], [44,\"SEMI\"], [45,\"SQT\"],\r\n\r\n    # Row 5 (46-63) including Upper Thumbs\r\n    [46,\"G\"], [47,\"LSHFT\"], [48,\"A\"], [49,\"S\"], [50,\"D\"], [51,\"F\"],\r\n    [52,\"LSHFT\"], [53,\"LALT\"], [54,\"V\"],          # Left Thumb (Upper)\r\n    [55,\"ESC\"], [56,\"UP\"], [57,\"RET\"],            # Right Thumb (Upper)\r\n    [58,\"N\"], [59,\"M\"], [60,\"COMMA\"], [61,\"DOT\"], [62,\"FSLH\"], [63,\"BSLH\"],\r\n\r\n    # Row 6 (64-79) including Lower Thumbs\r\n    [64,\"B\"], [65,\"LCTRL\"], [66,\"Z\"], [67,\"X\"], [68,\"C\"],\r\n    [69,\"SPACE\"], [70,\"LCTRL\"], [71,\"RET\"],       # Left Thumb (Lower)\r\n    [72,\"LEFT\"], [73,\"DOWN\"], [74,\"RIGHT\"],       # Right Thumb (Lower)\r\n    [75,\"MINUS\"], [76,\"LBKT\"], [77,\"RBKT\"], [78,\"EQUAL\"], [79,\"GRAVE\"]\r\n  ] as $mapping |\r\n\r\n  # ----------------------------------------------------------------------------\r\n  # 🚀 EXECUTION PHASE\r\n  # ----------------------------------------------------------------------------\r\n\r\n  (.layers | length) as $new_idx |\r\n\r\n  .creator = \"moosy\" |\r\n  .layer_names += [\"Gaming\"] |\r\n\r\n  # Initialize layer with transparent keys (80 keys for Glove80)\r\n  .layers[$new_idx] = [range(80) | { \"value\": \"&trans\", \"params\": [] }] |\r\n\r\n  # Fill keys\r\n  reduce $mapping[] as $map (.;\r\n    if ($map | length) == 3 then\r\n      .layers[$new_idx][$map[0]] = kp_mod($map[1]; $map[2])\r\n    else\r\n      .layers[$new_idx][$map[0]] = kp($map[1])\r\n    end\r\n  )\r\n)",

    {
            "uid": "hrm_bil80",
            "title": "G80 Bilateral HRM Sunaku",
            "subtitle": "Sunaku's Bilateral Home-Row Modifiers",
            "description": "A more advanced take on Home-Row Mods for Glove80, with per-finger layers so two modifiers on the same hand can't misfire together. [Learn more](https://sites.google.com/view/keyboards/layout/homerow-mods-explained).\n\nAdds a new **HRM_Bil** layer plus 8 finger layers and their macros/hold-taps — a lot at once.\n\n⚠️ Go60 isn't supported yet. If you already have home-row mods, remove them first with the **Remove HRMs** automation.",

            "uid": "hrm_remove",
            "title": "HRM Remove",
            "subtitle": "Del HRM from your Layout",
            "description": "Removes any home-row mods you have — hold-taps, macros, and bilateral finger layers included — so your base layer goes back to typing plain letters.",
            "script": "# ==============================================================================\n# 0. SETTINGS & TOGGLES\n# ==============================================================================\n# Set to true to keep colors and UI decorators. Set to false for a clean wipe.\ndef PRESERVE_DECORATORS: false; \n\n# ==============================================================================\n# 1. HARDWARE ABSTRACTION LAYER (HAL)\n# ==============================================================================\ndef GetHomeIndices:\n  if .layout.keys then\n    (.layout.keys | length) as $len |\n    if $len > 70 then [35, 36, 37, 38, 41, 42, 43, 44] # Glove80\n    else [25, 26, 27, 28, 31, 32, 33, 34]              # Go60\n    end\n  else [25, 26, 27, 28, 31, 32, 33, 34] # Default Fallback\n  end;\n\n# Helper for shifting layer references safely\n# Restricts to numbers <= 30 to explicitly protect macro timers (e.g., 250ms)\n# which are also stored inside .params[].value arrays.\ndef ShiftLayer($target_idx; $deleted_idx):\n  if ($target_idx | type == \"number\" and $target_idx <= 30) then\n    if $target_idx > $deleted_idx then $target_idx - 1\n    elif $target_idx == $deleted_idx then 0\n    else $target_idx end\n  else $target_idx end;\n\n# ==============================================================================\n# 2. MAIN TRANSFORMATION\n# ==============================================================================\nif (type != \"object\") then . else\n  (.keymap // .) |= (\n    \n    # SETUP\n    [ \"LeftIndex\", \"LeftMiddy\", \"LeftRingy\", \"LeftPinky\", \n      \"RightIndex\", \"RightMiddy\", \"RightRingy\", \"RightPinky\" ] as $targets |\n    (GetHomeIndices) as $home_row |\n\n    # STAGE 1: IDENTIFY HRM NAMES (Recursive lookup)\n    # Collects names from Layer 0 home row. \n    # EXPLICITLY ignores standard ZMK behaviors to protect layers like Cursor/Gaming.\n    ([ .layers[0][($home_row[])].value | select(. != null) ] | map(ltrimstr(\"&\")) | \n     map(select(IN(\"kp\", \"mt\", \"lt\", \"mo\", \"sl\", \"sk\", \"tog\", \"none\", \"trans\") | not))) as $to_purge |\n    \n    # STAGE 2: GLOBAL KEY REVERSION (Preserves Styling)\n    # Scans every layer. Converts any key referencing an HRM behavior to &kp.\n    .layers |= map(\n      map(\n        if (.value | ltrimstr(\"&\") | (startswith(\"HRM_\") or IN($to_purge[]))) then\n          (.params | if type == \"array\" and length > 0 then . else [{ \"value\": \"NONE\" }] end) as $p |\n          (if ($p | length > 1) then $p[1].value else $p[0].value end) as $keycode |\n          \n          # NEW BINDING OBJECT\n          { \"value\": \"&kp\", \"params\": [{ \"value\": $keycode }] } as $new_key |\n          \n          # TOGGLE LOGIC: Preserve existing decorators or replace entirely\n          # Force overwrite the params array to prevent index-merging corruption\n          if PRESERVE_DECORATORS then \n            (. * $new_key | .params = $new_key.params)\n          else \n            $new_key \n          end\n        else . end\n      )\n    ) |\n\n    # STAGE 3: REGISTRY PURGE\n    ( .holdTaps, .macros, .behaviors ) |= (\n      if type == \"array\" then\n        map(select(.name | type == \"string\" and ((. | IN($to_purge[])) or (ltrimstr(\"&\") | startswith(\"HRM_\"))) | not))\n      else . end\n    ) |\n\n    # STAGE 4: SURGICAL LAYER DELETION & RE-INDEXING\n    if (.layer_names | type == \"array\") then\n      ([.layer_names | to_entries[] | select(.value | IN($targets[])) | .key] | sort | reverse) as $delete_list |\n      \n      # EXPLICIT GUARD: Only run deletion and re-indexing if layers were actually found\n      if ($delete_list | length > 0) then\n        reduce $delete_list[] as $idx (.;\n          del(.layers[$idx]) | \n          del(.layer_names[$idx]) |\n          \n          # Universal Parameter Re-indexing \n          # Strictly targets ONLY objects inside a .params array to ignore root-level properties\n          (.. | objects | select(has(\"params\") and (.params | type == \"array\"))) |= (\n            .params |= map(\n              if (type == \"object\" and has(\"value\")) then\n                .value |= ShiftLayer(.; $idx)\n              else . end\n            )\n          ) |\n          \n          # Combo Layer Requirements Sync\n          (.combos // [])[]? |= (\n            if has(\"layers\") and (.layers | type == \"array\") then\n              .layers |= map(if . == $idx then empty else ShiftLayer(.; $idx) end)\n            else . end\n          ) |\n\n          # Input Listener Layer Requirements Sync\n          (.inputListeners // [])[]?.nodes[]? |= (\n            if has(\"layers\") and (.layers | type == \"array\") then\n              .layers |= map(if . == $idx then empty else ShiftLayer(.; $idx) end)\n            else . end\n          )\n        )\n      else\n        . # Do nothing if no layers matched the targets\n      end\n    else . end |\n\n    # STAGE 5: FINAL CLEANUP\n    # Automatically strip out any null keys (like \"macros\": null) so the parser doesn't choke\n    with_entries(select(.value != null)) |\n\n    .creator = \"moosy\"\n  )\nend",

            "description": "Turns any text you type into a ready-to-use macro, instead of clicking it together by hand in the editor.\n\n🚫 **Don't put passwords or personal information in your layout** — layout files have no private mode.",
            "script": "# Map symbols to ZMK keycodes\ndef zmk_sym($c):\n  if $c == \" \" then \"SPACE\"\n  elif $c == \"!\" then \"EXCL\"\n  elif $c == \"@\" then \"AT\"\n  elif $c == \"#\" then \"HASH\"\n  elif $c == \"$\" then \"DLLR\"\n  elif $c == \"%\" then \"PRCNT\"\n  elif $c == \"^\" then \"CARET\"\n  elif $c == \"&\" then \"AMPS\"\n  elif $c == \"*\" then \"STAR\"\n  elif $c == \"(\" then \"LPAR\"\n  elif $c == \")\" then \"RPAR\"\n  elif $c == \"-\" then \"MINUS\"\n  elif $c == \"_\" then \"UNDER\"\n  elif $c == \"=\" then \"EQUAL\"\n  elif $c == \"+\" then \"PLUS\"\n  elif $c == \"[\" then \"LBKT\"\n  elif $c == \"{\" then \"LBRC\"\n  elif $c == \"]\" then \"RBKT\"\n  elif $c == \"}\" then \"RBRC\"\n  elif $c == \"|\" then \"PIPE\"\n  elif $c == \";\" then \"SEMI\"\n  elif $c == \":\" then \"COLON\"\n  elif $c == \"'\" then \"SQT\"\n  elif $c == \",\" then \"COMMA\"\n  elif $c == \"<\" then \"LT\"\n  elif $c == \".\" then \"DOT\"\n  elif $c == \">\" then \"GT\"\n  elif $c == \"/\" then \"FSLH\"\n  elif $c == \"?\" then \"QMARK\"\n  elif $c == \"`\" then \"GRAVE\"\n  elif $c == \"~\" then \"TILDE\"\n  elif $c == \"\\\\\" then \"BSLH\"\n  elif $c == \"\\\"\" then \"DQT\"\n  else \"NONE\" end;\n\n# Generate the new macro object\n(\n  {\n    \"name\": \"&\\($macro_id)\",\n    \"description\": \"Print \\\"\\($macro_string)\\\"\",\n    \"bindings\": (\n      $macro_string | split(\"\") | map(\n        . as $char |\n        if test(\"^[A-Z]$\") then\n          [\n            { \"value\": \"&macro_press\" },\n            { \"value\": \"&kp\", \"params\": [ { \"value\": \"LSHFT\" } ] },\n            { \"value\": \"&macro_tap\" },\n            { \"value\": \"&kp\", \"params\": [ { \"value\": $char } ] },\n            { \"value\": \"&macro_release\" },\n            { \"value\": \"&kp\", \"params\": [ { \"value\": \"LSHFT\" } ] },\n            { \"value\": \"&macro_tap\" }\n          ]\n        elif test(\"^[a-z]$\") then\n          [\n            {\n              \"value\": \"&kp\",\n              \"params\": [ { \"value\": ($char | ascii_upcase) } ]\n            }\n          ]\n        elif test(\"^[0-9]$\") then\n          [\n            {\n              \"value\": \"&kp\",\n              \"params\": [ { \"value\": (\"N\" + $char) } ]\n            }\n          ]\n        else\n          [\n            {\n              \"value\": \"&kp\",\n              \"params\": [ { \"value\": zmk_sym($char) } ]\n            }\n          ]\n        end\n      ) | flatten\n    ),\n    \"params\": []\n  }\n) as $new_macro |\n\n\"&\\($macro_id)\" as $macro_name |\n\n# Safely inject into the AST context (handles both flat and nested keymaps!)\n(.keymap // .) |= (\n  (.macros // []) as $existing_macros |\n  ($existing_macros | map(.name) | index($macro_name)) as $idx |\n\n  # Check if it exists, and validate overwrite flag\n  if $idx != null then\n    if $overwrite_macro then\n      .macros[$idx] = $new_macro\n    else\n      error(\"Macro '\" + $macro_name + \"' already exists! Check the 'Overwrite' box to replace it.\")\n    end\n  else\n    .macros = $existing_macros + [$new_macro]\n  end\n)",
            "category": "Special keys",

    {
            "uid": "mouse_emulation_universal",
            "title": "Mouse Emulation",
            "subtitle": "Adds Mouse Emulation Layers",
            "description": "Adds dedicated layers for mouse movement, scrolling, and clicking — control your mouse entirely from the keyboard. [How mouse emulation works](https://zmk.dev/docs/keymaps/behaviors/mouse-emulation).\n\n✅ Turn on **HID_POINTING** in Advanced Configuration first, and re-pair Bluetooth if this is your first time using it.\n\n⚠️ Assign a layer-tap key (a thumb key works well) to reach these layers — this automation doesn't bind one for you.",
            "script": "# ZMK Autonomous Injection Script (V5.6) - \"Hardware-Safe Mouse Engine\"\n# Strategy: Explicit Keyboard Detection + Fully Populated Go60 Matrix\n\n# --- STEP 1: CAPTURE HARDWARE STRING FROM ROOT ---\n(.keyboard? | if type == \"string\" then ascii_downcase else \"glove80\" end) as $kb |\n\n(if .keymap then .keymap else . end) |= (\n\n  # --- STEP 2: BUILD HARDWARE-SPECIFIC ARRAYS ---\n  (if $kb == \"glove80\" then {\n    key_count: 80,\n    base_lt_idx: 73,\n    mappings: [\n      [24, \"&msc\", \"SCRL_LEFT\"],  [25, \"&mmv\", \"MOVE_UP\"],    [26, \"&msc\", \"SCRL_RIGHT\"],\n      [29, \"&msc\", \"SCRL_LEFT\"],  [30, \"&msc\", \"SCRL_UP\"],    [31, \"&msc\", \"SCRL_DOWN\"],  [32, \"&msc\", \"SCRL_RIGHT\"],\n      [35, \"&msc\", \"SCRL_UP\"],    [36, \"&mmv\", \"MOVE_LEFT\"],  [37, \"&mmv\", \"MOVE_DOWN\"],  [38, \"&mmv\", \"MOVE_RIGHT\"],\n      [41, \"&mo\", \"warp\"],        [42, \"&mo\", \"fast\"],        [43, \"&mo\", \"slow\"],\n      [47, \"&msc\", \"SCRL_DOWN\"],  [48, \"&mo\", \"slow\"],        [49, \"&mo\", \"fast\"],        [50, \"&mo\", \"warp\"],\n      [52, \"&mkp\", \"MCLK\"],       [54, \"&mkp\", \"MB5\"],\n      [59, \"&mmv\", \"MOVE_LEFT\"],  [60, \"&mmv\", \"MOVE_UP\"],    [61, \"&mmv\", \"MOVE_DOWN\"],  [62, \"&mmv\", \"MOVE_RIGHT\"],\n      [69, \"&mkp\", \"LCLK\"],       [70, \"&mkp\", \"RCLK\"],       [71, \"&mkp\", \"MB4\"],\n      [75, \"&mkp\", \"LCLK\"],       [76, \"&mkp\", \"RCLK\"],       [77, \"&mkp\", \"MCLK\"],       [78, \"&mkp\", \"MB4\"], [79, \"&mkp\", \"MB5\"]\n    ]\n  } else {\n    key_count: (.layers[0] | length), # not a literal 60 -- GLIDE's real Go60 geometry has 62 physical positions (the last two are the Cirque trackpad listener slots), so a literal 60 here silently built the new Mouse/MouseSlow/MouseFast/MouseWarp layers two entries shorter than every other layer\n    base_lt_idx: 58,\n    mappings: [\n      [13, \"&msc\", \"SCRL_UP\"],    [14, \"&msc\", \"SCRL_LEFT\"],  [15, \"&mmv\", \"MOVE_UP\"],    [16, \"&msc\", \"SCRL_RIGHT\"], [17, \"&msc\", \"SCRL_DOWN\"],\n      [25, \"&msc\", \"SCRL_DOWN\"],  [26, \"&mmv\", \"MOVE_LEFT\"],  [27, \"&mmv\", \"MOVE_DOWN\"],  [28, \"&mmv\", \"MOVE_RIGHT\"],\n      [31, \"&mo\", \"warp\"],        [32, \"&mo\", \"fast\"],        [33, \"&mo\", \"slow\"],\n      [38, \"&mo\", \"slow\"],        [39, \"&mo\", \"fast\"],        [40, \"&mo\", \"warp\"],\n      [50, \"&mkp\", \"MCLK\"],       [51, \"&mkp\", \"LCLK\"],       [52, \"&mkp\", \"RCLK\"],\n      [56, \"&mkp\", \"MCLK\"],       [57, \"&mkp\", \"LCLK\"],       [58, \"&mkp\", \"RCLK\"]\n    ]\n  } end) as $cfg |\n\n  # --- STEP 3: INITIALIZE NAMES & LAYERS ---\n  [\"Mouse\", \"MouseSlow\", \"MouseFast\", \"MouseWarp\"] as $required |\n\n  .layer_names |= (if . == null then [] else . end) |\n  .layers |= (if . == null then [] else . end) |\n\n  reduce $required[] as $name (.;\n    if (.layer_names | index($name) == null) then\n      .layer_names += [$name] |\n      .layers += [[range($cfg.key_count) | {\"value\": \"&trans\", \"params\": []}]]\n    else .\n    end\n  ) |\n\n  # --- STEP 4: RESOLVE DYNAMIC INDICES ---\n  (.layer_names | index(\"Mouse\")) as $idx_mouse |\n  (.layer_names | index(\"MouseSlow\")) as $idx_slow |\n  (.layer_names | index(\"MouseFast\")) as $idx_fast |\n  (.layer_names | index(\"MouseWarp\")) as $idx_warp |\n\n  # --- STEP 5: NON-DESTRUCTIVE LAYER-TAP INJECTION ON BASE LAYER ---\n  (\n    .layers[0][$cfg.base_lt_idx] as $target_key |\n    \n    # Only upgrade the key if it is a simple &kp so we don't break custom Hold-Taps/Macros\n    if $target_key.value == \"&kp\" then\n      .layers[0][$cfg.base_lt_idx] = {\n        \"value\": \"&lt\",\n        \"params\": [\n          {\"value\": $idx_mouse, \"params\": []},\n          $target_key.params[0] # Dynamically reuse their existing keycode!\n        ]\n      } + (if $target_key.decoration then {decoration: $target_key.decoration} else {} end)\n    else\n      .\n    end\n  ) |\n\n  # --- STEP 6: CONDITIONAL KEYMAP INJECTION ---\n  reduce $cfg.mappings[] as $b (.;\n    (if $b[2] == \"slow\" then $idx_slow\n     elif $b[2] == \"fast\" then $idx_fast\n     elif $b[2] == \"warp\" then $idx_warp\n     else $b[2] end) as $final_param |\n    \n    .layers[$idx_mouse][$b[0]] = {\n      \"value\": $b[1],\n      \"params\": [\n        {\"value\": $final_param, \"params\": []}\n      ]\n    }\n  ) |\n\n  # --- STEP 7: COMPREHENSIVE INPUT LISTENERS ---\n  .inputListeners = [\n    {\n      \"code\": \"&mmv_input_listener\",\n      \"inputProcessors\": [],\n      \"nodes\": [\n        {\n          \"code\": \"slow\",\n          \"layers\": [$idx_slow],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [1, 9]}\n          ]\n        },\n        {\n          \"code\": \"fast\",\n          \"layers\": [$idx_fast],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [3, 1]}\n          ]\n        },\n        {\n          \"code\": \"warp\",\n          \"layers\": [$idx_warp],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [12, 1]}\n          ]\n        }\n      ]\n    },\n    {\n      \"code\": \"&msc_input_listener\",\n      \"inputProcessors\": [],\n      \"nodes\": [\n        {\n          \"code\": \"slow\",\n          \"layers\": [$idx_slow],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_scroll_scaler\", \"params\": [1, 9]}\n          ]\n        },\n        {\n          \"code\": \"fast\",\n          \"layers\": [$idx_fast],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_scroll_scaler\", \"params\": [3, 1]}\n          ]\n        },\n        {\n          \"code\": \"warp\",\n          \"layers\": [$idx_warp],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_scroll_scaler\", \"params\": [12, 1]}\n          ]\n        }\n      ]\n    },\n    {\n      \"code\": \"&cirque_lh_listener\",\n      \"inputProcessors\": [\n        {\"code\": \"&zip_xy_scaler\", \"params\": [11, 12]},\n        {\"code\": \"&zip_xy_transform\", \"params\": [[\"INPUT_TRANSFORM_Y_INVERT\"]]},\n        {\"code\": \"&zip_xy_to_scroll_mapper\", \"params\": []},\n        {\"code\": \"&zip_click_to_right_click_mapper\", \"params\": []},\n        {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n      ],\n      \"nodes\": [\n        {\n          \"code\": \"slow\",\n          \"layers\": [$idx_slow],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [5, 14]},\n            {\"code\": \"&zip_xy_transform\", \"params\": [[\"INPUT_TRANSFORM_Y_INVERT\"]]},\n            {\"code\": \"&zip_xy_to_scroll_mapper\", \"params\": []},\n            {\"code\": \"&zip_click_to_right_click_mapper\", \"params\": []},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        },\n        {\n          \"code\": \"fast\",\n          \"layers\": [$idx_fast],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [3, 2]},\n            {\"code\": \"&zip_xy_transform\", \"params\": [[\"INPUT_TRANSFORM_Y_INVERT\"]]},\n            {\"code\": \"&zip_xy_to_scroll_mapper\", \"params\": []},\n            {\"code\": \"&zip_click_to_right_click_mapper\", \"params\": []},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        },\n        {\n          \"code\": \"warp\",\n          \"layers\": [$idx_warp],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [13, 3]},\n            {\"code\": \"&zip_xy_transform\", \"params\": [[\"INPUT_TRANSFORM_Y_INVERT\"]]},\n            {\"code\": \"&zip_xy_to_scroll_mapper\", \"params\": []},\n            {\"code\": \"&zip_click_to_right_click_mapper\", \"params\": []},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        }\n      ]\n    },\n    {\n      \"code\": \"&cirque_rh_listener\",\n      \"inputProcessors\": [\n        {\"code\": \"&zip_xy_scaler\", \"params\": [5, 2]},\n        {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n      ],\n      \"nodes\": [\n        {\n          \"code\": \"slow\",\n          \"layers\": [$idx_slow],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [1, 1]},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        },\n        {\n          \"code\": \"fast\",\n          \"layers\": [$idx_fast],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [4, 1]},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        },\n        {\n          \"code\": \"warp\",\n          \"layers\": [$idx_warp],\n          \"inputProcessors\": [\n            {\"code\": \"&zip_xy_scaler\", \"params\": [7, 1]},\n            {\"code\": \"&zip_temp_layer\", \"params\": [$idx_mouse, 2000]}\n          ]\n        }\n      ]\n    }\n  ]\n)",

    {

            "title": "AI Control Layer",
            "subtitle": "AI Layer Inject",
            "description": "Adds a dedicated **AI_Control** layer with ready-made macros for working with AI assistants, plus matching shortcuts on your **Lower** layer.\n\n⚠️ Requires Tap-Dance, Mod-Morph, and Sticky Key support in the Layout Editor. Stops safely if you already have an AI_Control layer, and never overwrites an existing macro or behavior with the same name.",
            "script": "(if type == \"object\" and .keymap? then .keymap else . end) |= (\n  \n  # ----------------------------------------------------------------------------\n  # 1. PRE-FLIGHT SAFETY CHECKS\n  # ----------------------------------------------------------------------------\n  \n  # Check 1: Enforce Glove80 Only\n  (if (.keyboard | type == \"string\" and ascii_downcase == \"glove80\") | not then\n    error(\"FATAL: This flow is exclusively for the Glove80 keyboard.\")\n  else . end) |\n\n  # Check 2: Abort if AI_Control layer already exists\n  (if ((.layer_names // []) | index(\"AI_Control\")) != null then\n    error(\"FATAL: Layer 'AI_Control' already exists. Aborting to prevent duplicates.\")\n  else . end) |\n\n  # ----------------------------------------------------------------------------\n  # 2. BEHAVIOR INJECTIONS (Idempotent - Skips if already exists)\n  # ----------------------------------------------------------------------------\n  \n  # Inject Sticky Keys safely (This fixes the missing &sticky_key_quickrel error)\n  .stickyKeys = ((.stickyKeys // []) + [\n    { \"name\": \"&sticky_key_quickrel\", \"description\": \"Quick Release Sticky Key\", \"releaseAfterMs\": 500, \"quickRelease\": true, \"lazy\": false, \"ignoreModifiers\": true, \"bindings\": [\"&kp\"] }\n  ] | unique_by(.name)) |\n\n  # Inject HoldTaps safely\n  .holdTaps = ((.holdTaps // []) + [\n    { \"name\": \"&sticky_key_modtap\", \"description\": \"\", \"flavor\": \"tap-preferred\", \"tappingTermMs\": 250, \"bindings\": [\"&kp\", \"&sticky_key_oneshot\"] }\n  ] | unique_by(.name)) |\n\n  # Inject Macros safely\n  .macros = ((.macros // []) + [\n    {\"name\":\"&ai_usage\",\"description\":\"Zero-config AI: Usage\",\"tapMs\":15,\"waitMs\":15,\"bindings\":[{\"value\":\"&ai_composer\"},{\"value\":\"&macro_tap\"},{\"value\":\"&kp\",\"params\":[{\"value\":\"FSLH\"}]},{\"value\":\"&kp\",\"params\":[{\"value\":\"U\"}]},{\"value\":\"&kp\",\"params\":[{\"value\":\"S\"}]},{\"value\":\"&k             "description": "Adds a 40-emoji layer for quick, expressive typing 😊❤️✅🔥.\n\n⚠️ Your OS needs Unicode hex input turned on first — [WinCompose](https://github.com/samhocevar/wincompose) on Windows, **Unicode Hex Input** on macOS, IBus on Linux — or the emojis won't type correctly.",
            "script": "# -------------------------------------------------------------------------\n# ZMK UNICODE MACRO GENERATOR (Protocol v8.4 - UI Timings & Trans Padding)\n# -------------------------------------------------------------------------\n# Purpose: Automatically generates ZMK macros and a dedicated Emoji Layer.\n# Features: \n#   1. Abstract Naming: Macros are named generically (e.g., &UC_PREFIX, &UC_winking_face).\n#   2. Macro Chaining: Defines OS prefixes/suffixes once and chains them.\n#   3. Custom Speeds: Uses UI-defined wait and tap times to prevent OS dropped keys.\n#   4. Layer Builder: Safely pads with &trans so layer-toggles aren't broken.\n# -------------------------------------------------------------------------\n\n# =========================================================================\n# --- 1. CONFIGURATION & UNICODE DATA (USER EDITABLE) ---\n# =========================================================================\n\n# --- Color Palette ---\n\"#ffadadff\" as $bg_faces |      # Pastel Red\n\"#e0f032ff\" as $bg_hands |      # Yellow-Green\n\"#9bf6ffff\" as $bg_intent |     # Pastel Cyan\n\"#bdb2ffff\" as $bg_boosters |   # Pastel Purple\n\n# --- Layer ---\n\"Emoji_flows\" as $emoji_layer | # Layer Name\n\n[\n  # --- Faces & Emotion ---\n  { \"name\": \"smiling_eyes\",      \"u\": \"1F60A\",       \"symb\": \"😊\", \"bg\": $bg_faces },\n  { \"name\": \"winking_face\",      \"u\": \"1F609\",       \"symb\": \"😉\", \"bg\": $bg_faces },\n  { \"name\": \"heart_eyes\",        \"u\": \"1F60D\",       \"symb\": \"😍\", \"bg\": $bg_faces },\n  { \"name\": \"sweat_smile\",       \"u\": \"1F605\",       \"symb\": \"😅\", \"bg\": $bg_faces },\n  { \"name\": \"tears_of_joy\",      \"u\": \"1F602\",       \"symb\": \"😂\", \"bg\": $bg_faces },\n  { \"name\": \"rofl\",              \"u\": \"1F923\",       \"symb\": \"🤣\", \"bg\": $bg_faces },\n  { \"name\": \"loudly_crying\",     \"u\": \"1F62D\",       \"symb\": \"😭\", \"bg\": $bg_faces },\n  { \"name\": \"pleading_face\",     \"u\": \"1F97A\",       \"symb\": \"🥺\", \"bg\": $bg_faces },\n  { \"name\": \"smiling_tear\",      \"u\": \"1F972\",       \"symb\": \"🥲\", \"bg\": $bg_faces },\n  { \"name\": \"thinking_face\",     \"u\": \"1F914\",       \"symb\": \"🤔\", \"bg\": $bg_faces },\n  { \"name\": \"saluting_face\",     \"u\": \"1FAE1\",       \"symb\": \"🫡\", \"bg\": $bg_faces },\n  { \"name\": \"open_mouth\",        \"u\": \"1F62E\",       \"symb\": \"😮\", \"bg\": $bg_faces },\n  { \"name\": \"slightly_frowning\", \"u\": \"1F641\",       \"symb\": \"🙁\", \"bg\": $bg_faces },\n  { \"name\": \"melting_face\",      \"u\": \"1FAE0\",       \"symb\": \"🫠\", \"bg\": $bg_faces },\n\n  # --- Hands, People & Sentiment ---\n  { \"name\": \"red_heart\",         \"u\": \"2764 FE0F\",   \"symb\": \"❤️\", \"bg\": $bg_hands }, \n  { \"name\": \"heart_hands\",       \"u\": \"1FAF6\",       \"symb\": \"🫶\", \"bg\": $bg_hands },\n  { \"name\": \"broken_heart\",      \"u\": \"1F494\",       \"symb\": \"💔\", \"bg\": $bg_hands },\n  { \"name\": \"thumbs_up\",         \"u\": \"1F44D\",       \"symb\": \"👍\", \"bg\": $bg_hands },\n  { \"name\": \"thumbs_down\",       \"u\": \"1F44E\",       \"symb\": \"👎\", \"bg\": $bg_hands },\n  { \"name\": \"folded_hands\",      \"u\": \"1F64F\",       \"symb\": \"🙏\", \"bg\": $bg_hands },\n  { \"name\": \"clapping_hands\",    \"u\": \"1F44F\",       \"symb\": \"👏\", \"bg\": $bg_hands },\n  { \"name\": \"handshake\",         \"u\": \"1F91D\",       \"symb\": \"🤝\", \"bg\": $bg_hands },\n  { \"name\": \"shrug\",             \"u\": \"1F937\",       \"symb\": \"🤷\", \"bg\": $bg_hands },\n  { \"name\": \"facepalm\",          \"u\": \"1F926\",       \"symb\": \"🤦\", \"bg\": $bg_hands },\n\n  # --- Emphasis / Intent / Structure ---\n  { \"name\": \"check_mark\",        \"u\": \"2705\",        \"symb\": \"✅\", \"bg\": $bg_intent },\n  { \"name\": \"cross_mark\",        \"u\": \"274C\",        \"symb\": \"❌\", \"bg\": $bg_intent },\n  { \"name\": \"warning\",           \"u\": \"26A0 FE0F\",   \"symb\": \"⚠️\", \"bg\": $bg_intent },\n  { \"name\": \"pushpin\",           \"u\": \"1F4CC\",       \"symb\": \"📌\", \"bg\": $bg_intent },\n  { \"name\": \"eyes\",              \"u\": \"1F440\",       \"symb\": \"👀\", \"bg\": $bg_intent },\n  { \"name\": \"fire\",              \"u\": \"1F525\",       \"symb\": \"🔥\", \"bg\": $bg_intent }, \n  { \"name\": \"sparkles\",          \"u\": \"2728\",        \"symb\": \"✨\", \"bg\": $bg_intent },\n  { \"name\": \"hundred_points\",    \"u\": \"1F4AF\",       \"symb\": \"💯\", \"bg\": $bg_intent },\n  { \"name\": \"party_popper\",      \"u\": \"1F389\",       \"symb\": \"🎉\", \"bg\": $bg_intent },\n  { \"name\": \"rocket\",            \"u\": \"1F680\",       \"symb\": \"🚀\", \"bg\": $bg_intent },\n\n  # --- Tone Nuance & Internet Culture Boosters ---\n  { \"name\": \"sunglasses\",        \"u\": \"1F60E\",       \"symb\": \"😎\", \"bg\": $bg_boosters },\n  { \"name\": \"person_bowing\",     \"u\": \"1F647 1F3FB\", \"symb\": \"🙇🏻\", \"bg\": $bg_boosters },\n  { \"name\": \"skull\",             \"u\": \"1F480\",       \"symb\": \"💀\", \"bg\": $bg_boosters },\n  { \"name\": \"clown\",             \"u\": \"1F921\",       \"symb\": \"🤡\", \"bg\": $bg_boosters },\n  { \"name\": \"sweat_drops\",       \"u\": \"1F4A6\",       \"symb\": \"💦\", \"bg\": $bg_boosters },\n  { \"name\": \"poop\",              \"u\": \"1F4A9\",       \"symb\": \"💩\", \"bg\": $bg_boosters }\n] as $macro_data |\n\n# =========================================================================\n# --- 2. CORE ENGINE (DO NOT EDIT BELOW THIS LINE) ---\n# =========================================================================\n\n(\n  # --- HELPER FUNCTIONS ---\n  def to_hex($len):\n    \"0123456789ABCDEF\" as $chars |\n    [ . as $n | recurse(if . >= 16 then ./16|floor else empty end) | . % 16 ] \n    | reverse | map($chars[.:.+1]) | join(\"\") \n    | (if length < $len then \"0\" * ($len - length) + . else . end);\n\n  def mk_bare($v): { \"value\": $v, \"params\": [] };\n  def mk_kp($code): { \"value\": \"&kp\", \"params\": [ mk_bare($code) ] };\n\n  # --- MAIN LOGIC ---\n  (if .keymap then .keymap else . end) |= (\n    \n    # --- KNOWLEDGE BASE: Prefix & Suffix definitions ---\n    {\n      \"windows\": { \"start_mode\": \"&macro_tap\",   \"start_keys\": [\"RALT\", \"U\"], \"end_mode\": \"&macro_tap\",     \"end_keys\": [\"ENTER\"], \"surrogate\": false },\n      \"macos\":   { \"start_mode\": \"&macro_press\", \"start_keys\": [\"LALT\"],      \"end_mode\": \"&macro_release\", \"end_keys\": [\"LALT\"],  \"surrogate\": true  },\n      \"linux\":   { \"start_mode\": \"&macro_tap\",   \"start_keys\": [\"LC(LS(U))\"], \"end_mode\": \"&macro_tap\",     \"end_keys\": [\"ENTER\"], \"surrogate\": false }\n    } as $os_registry |\n    \n    ($os_registry[$target_os]) as $cfg |\n\n    # =====================================================================\n    # PHASE 1: GENERATE OS MODIFIER MACROS (The Prefix & Suffix)\n    # =====================================================================\n    {\n      \"name\": \"&UC_PREFIX\",\n      \"description\": \"Unicode Prefix Sequence (\\($target_os))\",\n      \"compatible\": \"zmk,behavior-macro\",\n      \"config\": { \"wait-ms\": $macro_wait, \"tap-ms\": $macro_tap },\n      \"bindings\": [ mk_bare($cfg.start_mode), ($cfg.start_keys[] | mk_kp(.)) ],\n      \"params\": []\n    } as $macro_start |\n\n    {\n      \"name\": \"&UC_SUFFIX\",\n      \"description\": \"Unicode Suffix Sequence (\\($target_os))\",\n      \"compatible\": \"zmk,behavior-macro\",\n      \"config\": { \"wait-ms\": $macro_wait, \"tap-ms\": $macro_tap },\n      \"bindings\": [ mk_bare($cfg.end_mode), ($cfg.end_keys[] | mk_kp(.)) ],\n      \"params\": []\n    } as $macro_end |\n\n    # Ensure we clear out old generated macros to prevent duplication on multiple runs\n    # (Note: added &UC_start and &UC_end to the filter list to clean up previous versions)\n    ( [$macro_start.name, $macro_end.name, \"&UC_start\", \"&UC_end\"] + ($macro_data | map(\"&UC_\\(.name)\")) ) as $generated_names |\n    \n    .macros |= (\n      if . == null then [] else . end |\n      map(select(.name as $n | $generated_names | index($n) | not)) |\n      . + [$macro_start, $macro_end]\n    ) |\n\n    # =====================================================================\n    # PHASE 2: GENERATE CHAINED EMOJI MACROS\n    # =====================================================================\n    (reduce $macro_data[] as $item (.;\n      ([\n        ($item.u | split(\" \")[] | . as $cp |\n          \n          # 1. Trigger the abstract Start Macro\n          mk_bare($macro_start.name),\n          \n          # 2. Tap the Hex Codes\n          mk_bare(\"&macro_tap\"),\n          \n          ( reduce ($cp | ascii_upcase | split(\"\") | .[]) as $char \n            (0; . * 16 + (\"0123456789ABCDEF\" | index($char))) \n          ) as $dec |\n\n          (if $cfg.surrogate and $dec > 65535 then\n             [ (((($dec - 65536) / 1024 | floor) + 55296) | to_hex(4)), \n               (((($dec - 65536) % 1024) + 56320) | to_hex(4)) ]\n           else \n             [ $cp ] \n           end)[] | . as $hex_segment |\n\n             ($hex_segment | split(\"\")[] | \n               (if . >= \"0\" and . <= \"9\" then \"N\" + . else . end) | mk_kp(.)\n             ),\n          \n          # 3. Trigger the abstract End Macro\n          mk_bare($macro_end.name)\n        )\n      ]) as $bindings |\n\n      # CONSTRUCT AND INJECT MACRO\n      {\n          \"name\": \"&UC_\\($item.name)\",\n          \"description\": \"Unicode \\($item.symb) \\($item.name)\",\n          \"compatible\": \"zmk,behavior-macro\",\n          \"config\": { \"wait-ms\": $macro_wait, \"tap-ms\": $macro_tap },\n          \"bindings\": $bindings,\n          \"params\": []\n      } as $new_macro |\n\n      .macros |= . + [$new_macro]\n    )) |\n\n    # =====================================================================\n    # PHASE 3: GENERATE EMOJI LAYER\n    # =====================================================================\n    \n    # 1. Read hardware key count from base layer\n    (.layers[0] | length) as $key_count |\n\n    # 2. Map macros to standard layout array with UI decorations\n    ([\n      $macro_data[] | {\n        \"value\": \"&UC_\\(.name)\",\n        \"params\": [],\n        \"decoration\": {\n          \"label\": .symb,\n          \"background\": .bg\n        }\n      }\n    ]) as $emoji_keys |\n\n    # 3. Truncate (if too many macros) and pad with &trans to match key_count exactly\n    (\n      $emoji_keys[0:$key_count] + \n      [range([0, $key_count - ($emoji_keys | length)] | max) | { \"value\": \"&trans\", \"params\": [] }]\n    ) as $new_layer |\n\n    # 4. Inject layer (Overwrite existing \"Emoji\" layer, or append a new one)\n    ((.layer_names | index($emoji_layer)) // (.layers | length)) as $layer_idx |\n    .layer_names[$layer_idx] = $emoji_layer |\n    .layers[$layer_idx] = $new_layer\n  )\n)",

    {
            "uid": "mirror_keyboard_halves",
            "title": "Mirror Keyboard Halves",
            "subtitle": "Swaps Left and Right Sides",
            "description": "Swaps the left and right halves of one layer — everything your left hand typed, your right hand now types, and vice versa.\n\nChoose a straight left-right swap or a mirror-image reflection, and optionally leave your thumb keys untouched.",
            "script": "# ----------------------------------------------------------------------------\n# 1. CORE ENGINE (Global Scope to prevent WASM pipeline bugs)\n# ----------------------------------------------------------------------------\ndef build_lookup(left; right; size):\n  reduce range(left | length) as $i (\n    [range(size)];\n    .[(left[$i])] = right[$i] |\n    .[(right[$i])] = left[$i]\n  );\n\n# ----------------------------------------------------------------------------\n# 2. MAIN EXECUTION PIPELINE\n# ----------------------------------------------------------------------------\n(if type == \"object\" and .keymap? then .keymap else . end) |= (\n \n  ($layer_idx | tonumber) as $l_idx |\n \n  (if .layers == null or (.layers | length) == 0 then\n    error(\"FATAL: Keymap contains no layers.\")\n  else . end) |\n \n  (.layers[0] | length) as $kb_len |\n \n  # Map exactly to the hardware indices provided in the physical schematics\n  (if $kb_len == 80 then\n    [0,1,2,3,4, 10,11,12,13,14,15, 22,23,24,25,26,27, 34,35,36,37,38,39, 46,47,48,49,50,51, 52,53,54, 64,65,66,67,68, 69,70,71] as $L |\n    (if $mirror_style == \"symmetric\" then\n      [9,8,7,6,5, 21,20,19,18,17,16, 33,32,31,30,29,28, 45,44,43,42,41,40, 63,62,61,60,59,58, 57,56,55, 79,78,77,76,75, 74,73,72]\n    else\n      [5,6,7,8,9, 16,17,18,19,20,21, 28,29,30,31,32,33, 40,41,42,43,44,45, 58,59,60,61,62,63, 55,56,57, 75,76,77,78,79, 72,73,74]\n    end) as $R |\n   \n    build_lookup($L; $R; 80) |\n   \n    # Safely overwrite the thumb indices to map to themselves if excluded\n    (if $exclude_thumbs == \"yes\" then\n      reduce [52,53,54,55,56,57,69,70,71,72,73,74][] as $t (.; .[$t] = $t)\n    else . end)\n   \n  elif $kb_len == 60 or $kb_len == 62 then\n    # GLIDE's real Go60 geometry has 62 physical positions, not 60 (the last two are the\n    # Cirque trackpad listener slots, always &none in the keymap layers array and unrelated to\n    # this mirror) -- accept both, and size the lookup table from $kb_len (not a literal 60) so\n    # positions 60/61 stay identity-mapped (left untouched) rather than falling off the end.\n    [0,1,2,3,4,5, 12,13,14,15,16,17, 24,25,26,27,28,29, 36,37,38,39,40,41, 48,49,50, 54,55,56] as $L |\n    (if $mirror_style == \"symmetric\" then\n      [11,10,9,8,7,6, 23,22,21,20,19,18, 35,34,33,32,31,30, 47,46,45,44,43,42, 53,52,51, 59,58,57]\n    else\n      [6,7,8,9,10,11, 18,19,20,21,22,23, 30,31,32,33,34,35, 42,43,44,45,46,47, 51,52,53, 57,58,59]\n    end) as $R |\n   \n    build_lookup($L; $R; $kb_len) |\n   \n    # Safely overwrite the thumb indices to map to themselves if excluded\n    (if $exclude_thumbs == \"yes\" then\n      reduce [54,55,56,57,58,59][] as $t (.; .[$t] = $t)\n    else . end)\n   \n  else\n    error(\"FATAL: Unsupported matrix. Expected 80, 60, or 62 keys, found \" + ($kb_len | tostring))\n  end) as $lookup |\n \n  (if (.layers | length) <= $l_idx then\n    error(\"FATAL: Target Layer \" + ($l_idx | tostring) + \" does not exist.\")\n  else . end) |\n \n  # Replace the target layer array using the explicit lookup mapping\n  .layers[$l_idx] = (\n    .layers[$l_idx] as $old_layer |\n    [\n      range($kb_len) |\n      . as $current_idx |\n      $lookup[$current_idx] as $target_idx |\n      ($old_layer[$target_idx] // { \"value\": \"&none\" })\n    ]\n  )\n)",

            "uid": "sticky_oneshot_injector",
            "title": "OneShot Modifier",
            "subtitle": "OneShot Sticky Keys",
            "description": "Turns Shift into a smart key: tap it to capitalize just the next letter, hold it to Shift normally — no more awkward two-hand Shift-holds for a single capital.\n\n⚠️ Requires Sticky Key support in the Layout Editor. Adds an example layer (**OneShot_example**) with a ready-to-use key — copy it onto your real Shift key to start using it. Stops safely if you already have this set up.",
            "script": "(if type == \"object\" and .keymap? then .keymap else . end) |= (\r\n  \r\n  # 1. Pre-flight Conflict Checks\r\n  (\r\n    [\r\n      (if (.stickyKeys // []) | any(.name == \"&sticky_key_quickrel\") then \"- StickyKey: '&sticky_key_quickrel'\" else empty end),\r\n      (if (.macros // []) | any(.name == \"&sticky_key_oneshot\") then \"- Macro: '&sticky_key_oneshot'\" else empty end),\r\n      (if (.holdTaps // []) | any(.name == \"&sticky_key_modtap\") then \"- HoldTap: '&sticky_key_modtap'\" else empty end),\r\n      (if (.layer_names // []) | index(\"OneShot_example\") != null then \"- Layer: 'OneShot_example'\" else empty end)\r\n    ]\r\n  ) as $conflicts |\r\n  \r\n  # Halt execution and print to stderr if conflicts exist\r\n  if ($conflicts | length > 0) then\r\n    error(\"ABORTED: The following items already exist in the layout:\\n\" + ($conflicts | join(\"\\n\")))\r\n  else\r\n    \r\n    # 2. Determine Hardware Matrix Size dynamically\r\n    (.layers[0] | length) as $kb_len |\r\n\r\n    # 3. ── Sticky Keys (NEW Native Support) ──\r\n    # No need for unique_by(.name) since we already verified they don't exist\r\n    .stickyKeys = ((.stickyKeys // []) + [\r\n      {\r\n        \"name\": \"&sticky_key_quickrel\",\r\n        \"description\": \"\",\r\n        \"releaseAfterMs\": 500,\r\n        \"quickRelease\": true,\r\n        \"lazy\": false,\r\n        \"ignoreModifiers\": true,\r\n        \"bindings\": [\"&kp\"]\r\n      }\r\n    ]) |\r\n\r\n    # 4. ── Macros ──\r\n    .macros = ((.macros // []) + [\r\n      {\r\n        \"name\": \"&sticky_key_oneshot\",\r\n        \"description\": \"\",\r\n        \"waitMs\": 0,\r\n        \"tapMs\": 0,\r\n        \"bindings\": [\r\n          {\"value\": \"&macro_tap\"},\r\n          {\"value\": \"&macro_param_1to1\"},\r\n          {\r\n            \"value\": \"&sticky_key_quickrel\", \r\n            \"params\": [{\"value\": \"MACRO_PLACEHOLDER\"}]\r\n          }\r\n        ]\r\n      }\r\n    ]) |\r\n\r\n    # 5. ── HoldTaps ──\r\n    .holdTaps = ((.holdTaps // []) + [\r\n      {\r\n        \"name\": \"&sticky_key_modtap\",\r\n        \"description\": \"\",\r\n        \"flavor\": \"tap-preferred\",\r\n        \"tappingTermMs\": 250,\r\n        \"bindings\": [\"&kp\", \"&sticky_key_oneshot\"]\r\n      }\r\n    ]) |\r\n\r\n    # 6. ── Layers ──\r\n    .layer_names = ((.layer_names // []) + [\"OneShot_example\"]) |\r\n    .layers = ((.layers // []) + [[\r\n      range($kb_len) |\r\n      \r\n      # Inject the key at index 46. \r\n      if . == 46 then\r\n        {\r\n          \"value\": \"&sticky_key_modtap\",\r\n          \"params\": [{\"value\": \"LSHFT\"}, {\"value\": \"LSHFT\"}],\r\n          \"decoration\": {\r\n            \"label\": \"Shift\",\r\n            \"icon\": \"fa-angle-double-up\",\r\n            \"background\": \"#ffecb3\"\r\n          }\r\n        }\r\n      else\r\n        {\"value\": \"&none\"}\r\n      end\r\n    ]])\r\n  end\r\n)",

    {
            "uid": "top_15_zmk_behaviors",
            "title": "Top 15 Advanced Examples",
            "subtitle": "Community Vetted Tap-Dances & Mod-Morphs",
            "description": "Adds 15 community-favorite key combos in one go — smarter Backspace, Space, and punctuation keys that do more without extra keys. [See the full list](https://drive.google.com/file/d/1NAagQkEACFOs0twGLFfI9aRKWwh_V4Jp/view).\n\n⚠️ Requires Tap-Dance and Mod-Morph support in the Layout Editor. Choose **Implement on layer0** to upgrade your existing Backspace/Space/punctuation keys automatically, or leave it off to assign the new behaviors yourself.",
            "script": "# ZMK Autonomous Injection Script - \"Top 15 Advanced Behaviors\" (V9 - Strict Tap-Dance Outer Logic)\r\n\r\n# --- PRE-REQUISITE: RESOLVE TARGET LAYERS ---\r\n(if $auto_bind == \"yes\" then\r\n  (\r\n    [\"Nav\", \"Num\"] as $req_layers |\r\n    .layer_names |= (. // [\"Base\"]) |\r\n    .layers |= (. // [[]]) |\r\n    (.layers[0] | length) as $layer_size |\r\n    reduce $req_layers[] as $name (.;\r\n      if (.layer_names | index($name) == null) then\r\n        .layer_names += [$name] |\r\n        .layers += [[range(0; $layer_size) | {\"value\": \"&trans\"}]]\r\n      else . end\r\n    )\r\n  )\r\nelse . end) |\r\n\r\n(.layer_names | index(\"Nav\") // 1) as $idx_nav |\r\n(.layer_names | index(\"Num\") // 2) as $idx_num |\r\n\r\n\r\n# ==============================================================================\r\n# STEP 1: CREATE NESTED BEHAVIORS\r\n# ==============================================================================\r\n\r\n# --- A. MACROS (Strict Root Params) ---\r\n([\r\n  { \"name\": \"&mac_eol_semi\", \"params\": [], \"description\": \"4. End of Line Macro\", \"waitMs\": 0, \"tapMs\": 0, \"bindings\": [ { \"value\": \"&macro_tap\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"END\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"SEMI\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"RET\", \"params\": []}] } ] },\r\n  { \"name\": \"&mac_ellipsis\", \"params\": [], \"description\": \"9. Ellipsis Macro\", \"waitMs\": 0, \"tapMs\": 0, \"bindings\": [ { \"value\": \"&macro_tap\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"DOT\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"DOT\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"DOT\", \"params\": []}] } ] },\r\n  { \"name\": \"&mac_arrow\", \"params\": [], \"description\": \"12. Arrow Macro\", \"waitMs\": 0, \"tapMs\": 0, \"bindings\": [ { \"value\": \"&macro_tap\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"MINUS\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"GT\", \"params\": []}] } ] },\r\n  { \"name\": \"&mac_fat_arrow\", \"params\": [], \"description\": \"14. Fat Arrow Macro\", \"waitMs\": 0, \"tapMs\": 0, \"bindings\": [ { \"value\": \"&macro_tap\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"EQUAL\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"GT\", \"params\": []}] } ] }\r\n]) as $new_macros |\r\n\r\n# --- B. MOD-MORPHS (Inner behaviors that transform Tap 1 based on Shift) ---\r\n([\r\n  { \"name\": \"&mm_bspc_del\", \"description\": \"1. Mod-Morph: BSPC / DEL\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"BSPC\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"DEL\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_esc_tilde\", \"description\": \"6. Mod-Morph: ESC / ~\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"ESC\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"GRAVE\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_tab_bck\", \"description\": \"8. Mod-Morph: TAB / LS(TAB)\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"TAB\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LS\", \"params\": [{\"value\": \"TAB\", \"params\": []}]}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_dot_colon\", \"description\": \"9. Mod-Morph: DOT / COLON\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"DOT\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"COLON\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_paren_angle\", \"description\": \"10. Mod-Morph: ( / <\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LPAR\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LT\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_brack_brace\", \"description\": \"10. Mod-Morph: [ / {\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LBKT\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LBRC\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_slash_qmark\", \"description\": \"11. Mod-Morph: / / ?\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"FSLH\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"QMARK\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_dash_under\", \"description\": \"12. Mod-Morph: - / _\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"MINUS\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"UNDER\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_eq_plus\", \"description\": \"14. Mod-Morph: = / +\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"EQUAL\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"PLUS\", \"params\": []}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] },\r\n  { \"name\": \"&mm_pscrn_snip\", \"description\": \"15. Mod-Morph: PSCRN / Snip\", \"cases\": [ { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"PSCRN\", \"params\": []}] }, \"mods\": [], \"keepMods\": [] }, { \"binding\": { \"value\": \"&kp\", \"params\": [{\"value\": \"LG\", \"params\": [{\"value\": \"LS\", \"params\": [{\"value\": \"S\", \"params\": []}]}]}] }, \"mods\": [\"MOD_LSFT\", \"MOD_RSFT\"], \"keepMods\": [] } ] }\r\n]) as $new_morphs |\r\n\r\n# --- C. TAP-DANCES (Outer behaviors that protect timing windows) ---\r\n([\r\n  { \"name\": \"&td_spc_tog\", \"description\": \"2. Peek-or-Lock Layer Space\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&lt\", \"params\": [{\"value\": $idx_num}, {\"value\": \"SPACE\", \"params\": []}] }, { \"value\": \"&tog\", \"params\": [{\"value\": $idx_num}] } ] },\r\n  { \"name\": \"&td_parens\", \"description\": \"3. Space Cadet Evolved\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mt\", \"params\": [{\"value\": \"LSHFT\", \"params\": []}, {\"value\": \"LPAR\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"RPAR\", \"params\": []}] } ] },\r\n  { \"name\": \"&td_enter_eol\", \"description\": \"4. Enter / Shift / EOL\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mt\", \"params\": [{\"value\": \"RSHFT\", \"params\": []}, {\"value\": \"RET\", \"params\": []}] }, { \"value\": \"&mac_eol_semi\", \"params\": [] } ] },\r\n  { \"name\": \"&td_caps_word\", \"description\": \"7. Caps Word Trigger\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mt\", \"params\": [{\"value\": \"LSHFT\", \"params\": []}, {\"value\": \"LSHFT\", \"params\": []}] }, { \"value\": \"&caps_word\", \"params\": [] } ] },\r\n  { \"name\": \"&td_punct_power\", \"description\": \"9. Punctuation Powerhouse\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_dot_colon\", \"params\": [] }, { \"value\": \"&mac_ellipsis\", \"params\": [] } ] },\r\n  { \"name\": \"&td_nested_brackets\", \"description\": \"10. Coder's Nested Brackets\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_paren_angle\", \"params\": [] }, { \"value\": \"&mm_brack_brace\", \"params\": [] } ] },\r\n  { \"name\": \"&td_quest_excl\", \"description\": \"11. Smart Question & Exclamation\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_slash_qmark\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"EXCL\", \"params\": []}] } ] },\r\n  { \"name\": \"&td_dash_arrow\", \"description\": \"12. Dash & Arrow Macro Key\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_dash_under\", \"params\": [] }, { \"value\": \"&mac_arrow\", \"params\": [] } ] },\r\n  { \"name\": \"&td_media\", \"description\": \"13. Media Maestro\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mt\", \"params\": [{\"value\": \"C_VOL_UP\", \"params\": []}, {\"value\": \"C_PP\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"C_NEXT\", \"params\": []}] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"C_PREV\", \"params\": []}] } ] },\r\n  { \"name\": \"&td_math_logic\", \"description\": \"14. Math & Logic Operator\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_eq_plus\", \"params\": [] }, { \"value\": \"&mac_fat_arrow\", \"params\": [] } ] },\r\n  { \"name\": \"&td_power_screen\", \"description\": \"15. OS Power & Screenshot Key\", \"tappingTermMs\": 200, \"bindings\": [ { \"value\": \"&mm_pscrn_snip\", \"params\": [] }, { \"value\": \"&kp\", \"params\": [{\"value\": \"C_SLEEP\", \"params\": []}] } ] }\r\n]) as $new_dances |\r\n\r\n# --- D. HOLD-TAPS (Pure Hold-Taps, Quick-Tap enabled) ---\r\n([\r\n  { \"name\": \"&ht_thumb_bspc\", \"description\": \"1. God-Tier Thumb Backspace\", \"bindings\": [ \"&mo\", \"&mm_bspc_del\" ], \"tappingTermMs\": 200, \"flavor\": \"tap-preferred\" },\r\n  { \"name\": \"&ht_hrm_safe\", \"description\": \"5. Safe HRM Escape (Generic)\", \"bindings\": [ \"&kp\", \"&kp\" ], \"tappingTermMs\": 200, \"requirePriorIdleMs\": 150, \"quickTapMs\": 200, \"flavor\": \"tap-preferred\" },\r\n  { \"name\": \"&ht_ctrl_esc\", \"description\": \"6. 40% Smart Escape Corner\", \"bindings\": [ \"&kp\", \"&mm_esc_tilde\" ], \"tappingTermMs\": 200, \"flavor\": \"tap-preferred\" },\r\n  { \"name\": \"&ht_alt_tab\", \"description\": \"8. App Switcher Engine\", \"bindings\": [ \"&kp\", \"&mm_tab_bck\" ], \"tappingTermMs\": 200, \"flavor\": \"tap-preferred\" }\r\n]) as $new_holds |\r\n\r\n(.keymap // .) |= (\r\n  .macros    = ($new_macros + (.macros // []) | unique_by(.name)) |\r\n  .modMorphs = ($new_morphs + (.modMorphs // []) | unique_by(.name)) |\r\n  .tapDances = ($new_dances + (.tapDances // []) | unique_by(.name)) |\r\n  .holdTaps  = ($new_holds  + (.holdTaps  // []) | unique_by(.name)) |\r\n  \r\n  # ==============================================================================\r\n  # STEP 2: AUTO-ASSIGN ON BASE LAYER (Strict Tap-Dance routing)\r\n  # ==============================================================================\r\n  (if $auto_bind == \"yes\" and (.layers | length > 0) then\r\n    {\r\n      \"BSPC\":     {\"value\": \"&ht_thumb_bspc\", \"params\": [{\"value\": $idx_nav}]},\r\n      \"SPACE\":    {\"value\": \"&td_spc_tog\"},\r\n      \"RET\":      {\"value\": \"&td_enter_eol\"},\r\n      \"DOT\":      {\"value\": \"&td_punct_power\"},\r\n      \"LBKT\":     {\"value\": \"&td_nested_brackets\"},\r\n      \"FSLH\":     {\"value\": \"&td_quest_excl\"},\r\n      \"MINUS\":    {\"value\": \"&td_dash_arrow\"},\r\n      \"EQUAL\":    {\"value\": \"&td_math_logic\"},\r\n      \"ESC\":      {\"value\": \"&ht_ctrl_esc\", \"params\": [{\"value\": \"LCTRL\", \"params\": []}]},\r\n      \"TAB\":      {\"value\": \"&ht_alt_tab\", \"params\": [{\"value\": \"LALT\", \"params\": []}]},\r\n      \"C_VOL_UP\": {\"value\": \"&td_media\"},\r\n      \"PSCRN\":    {\"value\": \"&td_power_screen\"},\r\n      \"LSHFT\":    {\"value\": \"&td_caps_word\"}\r\n    } as $map |\r\n    \r\n    .layers[0] |= map(\r\n      if type == \"object\" and .value == \"&kp\" and .params and (.params | length > 0) and (.params[0].value | in($map)) then\r\n        $map[.params[0].value] + (if .decoration then {decoration: .decoration} else {} end)\r\n      else\r\n        .\r\n      end\r\n    )\r\n  else . end)\r\n)",

            "successMessage": "The 15 community hold-tap/mod-morph/tap-dance behaviors are now available. If you chose \"Implement on layer0\", your base layer's Backspace, Space, and punctuation keys were automatically upgraded to use them — otherwise, assign the new behaviors to keys yourself."

    {
            "uid": "sym_numrow",
            "title": "Primeagen's NumRow V1",
            "subtitle": "Custom Number Row",
            "description": "Puts programmer symbols right on your number row — hold a number key for its symbol instead of reaching for Shift.\n\n⚠️ Replaces your current number row on the base layer. Tap-Dance and Mod-Morph versions are coming soon; only Hold-Tap works today.",
            "script": "# ==============================================================================\r\n# 1. CORE UTILITIES & HARDWARE\r\n# ==============================================================================\r\n\r\ndef log_err($msg):\r\n  ($msg | stderr) | empty;\r\n\r\ndef GetHardware:\r\n  (.keyboard | if type == \"string\" then ascii_downcase else \"\" end) as $kb |\r\n  if $kb == \"glove80\" then\r\n    { offset: 10, len: 12 } # Glove80 number row is keys 10 through 22\r\n  elif $kb == \"go60\" then\r\n    { offset: 0, len: 12 }  # Go60 number row is keys 0 through 12\r\n  else\r\n    log_err(\"FATAL: Unsupported or missing keyboard property in layout\") | halt\r\n  end;\r\n\r\n# ==============================================================================\r\n# 2. BEHAVIOR DEFINITIONS\r\n# ==============================================================================\r\n\r\ndef get_primeagen_holdtap: {\r\n  \"name\": \"&ht_primeagen\",\r\n  \"description\": \"Primeagen NumRow Hold-Tap\",\r\n  \"bindings\": [\"&kp\", \"&kp\"],\r\n  \"tappingTermMs\": 200,\r\n  \"flavor\": \"tap-preferred\"\r\n};\r\n\r\n# ==============================================================================\r\n# 3. DATA REGISTRY\r\n# ==============================================================================\r\n\r\n# Array 1: Numbers (Tap)\r\n[\"AT\",\"N1\",\"N2\",\"N3\",\"N4\",\"N5\",\"N6\",\"N7\",\"N8\",\"N9\",\"N0\",\"DOLLAR\"] as $arr_nums |\r\n\r\n# Array 2: Symbols (Hold)\r\n[\"PLUS\",\"EXCL\",\"LBKT\",\"LBRC\",\"LPAR\",\"AMPS\",\"EQUAL\",\"RPAR\",\"RBRC\",\"RBKT\",\"ASTRK\",\"PERCENT\"] as $arr_syms |\r\n\r\n(GetHardware) as $hw |\r\n\r\n# ==============================================================================\r\n# 4. MAIN TRANSFORMATION ENGINE\r\n# ==============================================================================\r\n\r\n(.keymap // .) |= (\r\n  \r\n  # Step 1: Inject the selected behavior into the AST\r\n  (if $behavior_type == \"hold-tap\" then\r\n    .holdTaps = ((.holdTaps // []) + [get_primeagen_holdtap] | unique_by(.name))\r\n  else \r\n    . \r\n  end) \r\n  \r\n  |\r\n\r\n  # Step 2: Modify the Number Row on the Base Layer\r\n  .layers[0] |= [\r\n    range(length) as $i | .[$i] |\r\n    \r\n    # Check if the current key index is strictly inside the hardware's number row\r\n    if ($i >= $hw.offset) and ($i < ($hw.offset + $hw.len)) then\r\n      \r\n      ($i - $hw.offset) as $idx | # Maps index back to 0-9 to pull from our arrays cleanly\r\n\r\n      if $behavior_type == \"hold-tap\" then\r\n        \r\n        # Safely preserve any UI decorators the user has applied\r\n        (if type == \"object\" and .decoration then { decoration: .decoration } else {} end) as $dec |\r\n        \r\n        {\r\n          value: \"&ht_primeagen\",\r\n          params: [\r\n            { value: $arr_nums[$idx], params: [] }, # Tap action (Number)\r\n            { value: $arr_syms[$idx], params: [] }  # Hold action (Symbol)\r\n          ]\r\n        } + $dec\r\n        \r\n      elif $behavior_type == \"tap-dance\" then\r\n        # FUTURE: Implement Tap-Dance AST structure here\r\n        .\r\n      elif $behavior_type == \"mod-morph\" then\r\n        # FUTURE: Implement Mod-Morph AST structure here\r\n        .\r\n      else \r\n        . \r\n      end\r\n\r\n    else \r\n      . # Leave keys outside the number row completely untouched\r\n    end\r\n  ]\r\n)",
