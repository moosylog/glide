                        <div className="bg-app-card p-4 rounded-b-xl border-x border-b border-app-borderHighlight -mt-2 pt-4 flex flex-col gap-3 shadow-inner relative z-0" onClick={e => e.stopPropagation()}>
                            {(slotBinding.params || []).map((paramObj, pIdx) => {
                                const val = paramObj.value; const isNumberLike = typeof val === 'number' || (typeof val === 'string' && /^\d+$/.test(val));
                                return (
                                    <div key={pIdx} className="flex flex-col gap-1.5">
                                        <label className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">Param {pIdx + 1}</label>
                                        {isNumberLike ? (
                                            <select value={parseInt(val) || 0} onChange={(e) => updateSlotParam(slotKey, pIdx, e.target.value, true)} className="bg-app-surface border border-app-borderHighlight text-app-text text-xs rounded-lg px-3 py-2 outline-none w-full">
                                                {layerNames.map((dName, lIdx) => <option key={lIdx} value={lIdx}>{dName}</option>)}
                                            </select>
                                        ) : (
                                            <input type="text" value={val} onChange={(e) => updateSlotParam(slotKey, pIdx, e.target.value)} className="bg-app-surface border border-app-borderHighlight text-app-text text-xs rounded-lg px-3 py-2 outline-none w-full font-mono" />
                                        )}
                                    </div>
                                );
                            })}
                            <div className="flex gap-2">
                                {(!slotBinding.params || slotBinding.params.length < 2) && (
                                    <button onClick={() => updateSlotParam(slotKey, (slotBinding.params || []).length, '')} className="text-[10px] uppercase font-bold text-app-accent hover:text-app-accentHover transition-colors flex items-center gap-1">+ Add Param</button>
                                )}
                                {(slotBinding.params && slotBinding.params.length > 0) && (
                                    <button onClick={() => {
                                        const newSlots = structuredClone(parsedSlots); newSlots[slotKey].params.pop();
                                        let { newBinding, newConfig } = buildBindingAndConfig(newSlots, config, false);
                                        if (currentBinding?.decoration) newBinding.decoration = currentBinding.decoration;
                                        if (editingComboIdx !== null) newConfig.combos[editingComboIdx].binding = newBinding;
                                        else newConfig.layers[activeLayer][selectedKey] = newBinding;
                                        pushHistory(newConfig);
                                    }} className="text-[10px] uppercase font-bold text-red-400 hover:text-red-300 transition-colors flex items-center gap-1">- Remove</button>
                                )}
                            </div>
                            {renderDoneButton()}
                        </div>
                    );
                }

                const htMatch = (config.holdTaps || []).find(h => h.name === bindingName);
                const tdMatch = (config.tapDances || []).find(t => t.name === bindingName);
                const mmMatch = (config.modMorphs || []).find(m => m.name === bindingName);
                if (htMatch) {
                    return (
                        <div className="bg-app-card p-4 rounded-b-xl border-x border-b border-app-borderHighlight -mt-2 pt-4 flex flex-col gap-4 shadow-inner relative z-0" onClick={e => e.stopPropagation()}>
                            <DynamicBehaviorForm behaviorId="hold_tap" values={htMatch} keyboardGeo={keyboardGeo} onChange={(key, val) => updateBehaviorSetting('holdTaps', bindingName, key, val)} />
                            {renderDoneButton()}
                        </div>
                    );
                } else if (tdMatch) {
                    return (
                        <div className="bg-app-card p-4 rounded-b-xl border-x border-b border-app-borderHighlight -mt-2 pt-4 flex flex-col gap-4 shadow-inner relative z-0" onClick={e => e.stopPropagation()}>
                            <DynamicBehaviorForm behaviorId="tap_dance" values={tdMatch} keyboardGeo={keyboardGeo} onChange={(key, val) => updateBehaviorSetting('tapDances', bindingName, key, val)} />
                            {renderDoneButton()}
                        </div>
                    );
                } else if (mmMatch) {
                    const mm = mmMatch;
                    const MOD_TOGGLE_OPTIONS = ['MOD_LSFT', 'MOD_RSFT', 'MOD_LCTL', 'MOD_RCTL', 'MOD_LALT', 'MOD_RALT', 'MOD_LGUI', 'MOD_RGUI'];
                    return (
                        <div className="bg-app-card p-4 rounded-b-xl border-x border-b border-app-borderHighlight -mt-2 pt-4 flex flex-col gap-4 shadow-inner relative z-0" onClick={e => e.stopPropagation()}>
                            <p className="text-[10px] text-app-textMuted leading-tight -mt-1">This behavior switches its output based on which mod keys are held. Each case below fires when exactly its checked mods are active. Bindings themselves aren't editable here — use the JSON tab for that.</p>
                            {(mm.cases || []).map((c, cIdx) => (
                                <div key={cIdx} className="flex flex-col gap-2 pb-3 border-b border-app-borderHighlight last:border-b-0 last:pb-0">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] uppercase tracking-widest text-app-textMuted font-bold">Case {cIdx + 1}{cIdx === 0 ? ' (default)' : ''}</span>
                                        <span className="font-mono text-[11px] text-app-accent">{describeBinding(c.binding, effectiveOs, layerNames)}</span>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {MOD_TOGGLE_OPTIONS.map(mc => {
                                            const active = (c.mods || []).includes(mc);
                                            return <button key={mc} onClick={() => toggleModMorphCaseMod(bindingName, cIdx, mc)} className={`px-2 py-1 text-[10px] font-bold rounded border transition-colors ${active ? 'bg-app-accent text-white border-app-accent' : 'bg-app-surface text-app-textMuted border-app-borderHighlight hover:text-app-text hover:border-app-textMuted'}`}>{mc.replace('MOD_','')}</button>;
                                        })}
                                    </div>
                                </div>
                            ))}
                            {renderDoneButton()}
                        </div>
                    );
                }
                return null;
            };

            const handleGearClick = (e, slotKey) => {
                e.stopPropagation();
                if (activeConfigSlot === slotKey) { setActiveConfigSlot(null); return; }
                const slotBinding = parsedSlots[slotKey]; let isStandardHoldTap = false;
               
                let targetName = slotBinding?.value || '';
               
                if (slotKey === 'hold') {
                    const primaryBinding = currentBinding;
                    if (primaryBinding && !isGlideHtName(primaryBinding.value) && !isRecognizedTdName(primaryBinding.value) && (primaryBinding.value === '&mt' || primaryBinding.value === '&lt')) isStandardHoldTap = true;
                    else if (isGlideHtName(primaryBinding?.value)) targetName = primaryBinding.value;
                    else if (isRecognizedTdName(primaryBinding?.value)) {
                        const td = config?.tapDances?.find(t => t.name === primaryBinding.value);
                        if (td && isGlideHtName(td.bindings?.[0]?.value)) targetName = td.bindings[0].value;
                    }
                }
                if (slotKey === 'doubleTap' && isRecognizedTdName(currentBinding?.value)) targetName = currentBinding.value;

                if (isStandardHoldTap) {
                    const newSlots = { ...parsedSlots }; let { newBinding, newConfig } = buildBindingAndConfig(newSlots, config, true);
                    if (currentBinding?.decoration) newBinding.decoration = currentBinding.decoration;
                    if (editingComboIdx !== null) newConfig.combos[editingComboIdx].binding = newBinding;
                    else newConfig.layers[activeLayer][selectedKey] = newBinding;
                    pushHistory(newConfig);
                }
                setActiveConfigSlot(slotKey);
            };

            const detachCustomBehavior = async (slotKey) => {
                if (!config || (selectedKey === null && editingComboIdx === null)) return;
                const slotBinding = parsedSlots[slotKey]; if (!slotBinding) return;
                const originalName = slotBinding.value;
                const htMatch = (config.holdTaps || []).find(h => h.name === originalName);
                const tdMatch = !htMatch && (config.tapDances || []).find(t => t.name === originalName);
                const mmMatch = !htMatch && !tdMatch && (config.modMorphs || []).find(m => m.name === originalName);
                const match = htMatch || tdMatch || mmMatch;
                if (!match) return;

                const usageCount = countBehaviorUsage(config, originalName);
                const hasSharedTuning = !!(htMatch && htMatch.holdTriggerKeyPositions && htMatch.holdTriggerKeyPositions.length > 0);
                if (usageCount > 1 || hasSharedTuning) {
                    const warn = `"${originalName.replace('&','')}" is used by ${usageCount} key${usageCount === 1 ? '' : 's'}/combo${usageCount === 1 ? '' : 's'}${hasSharedTuning ? ' and has shared hold-trigger tuning' : ''}. Detaching will let you edit this one independently, but it will stop sharing settings with the others.`;
                    if ((await askConfirm({ title: 'Detach shared behavior?', message: warn, confirmLabel: 'Detach', danger: true })) !== 'confirm') return;
                }

                const newConfig = structuredClone(config);
                const slug = originalName.replace('&', '').replace(/[^a-zA-Z0-9]+/g, '_');
                let newName, arrKey;
                if (htMatch) { arrKey = 'holdTaps'; newName = `${GLIDE_HT_PREFIX}detached_${slug}_${Date.now() % 100000}`; }
                else if (tdMatch) { arrKey = 'tapDances'; newName = `${GLIDE_TD_PREFIX}detached_${slug}_${Date.now() % 100000}`; }
                else { arrKey = 'modMorphs'; newName = `${GLIDE_MM_PREFIX}detached_${slug}_${Date.now() % 100000}`; }

                const cloned = structuredClone(match); cloned.name = newName; cloned.description = GLIDE_BEHAVIOR_DESCRIPTION;
                if (!newConfig[arrKey]) newConfig[arrKey] = [];
                newConfig[arrKey].push(cloned);

                const newBinding = { value: newName };
                if (slotBinding.params) newBinding.params = structuredClone(slotBinding.params);
                if (currentBinding?.decoration) newBinding.decoration = currentBinding.decoration;

                if (editingComboIdx !== null) newConfig.combos[editingComboIdx].binding = newBinding;
                else newConfig.layers[activeLayer][selectedKey] = newBinding;

                pushHistory(newConfig);
                showToast(`Detached — this key now has its own copy of "${originalName.replace('&','')}"`);
            };

            // Forward link, key -> named behavior definition (UX pass, Phase 3): given a custom
            // behavior's raw name, figures out which of the five Behavior Library arrays it lives
            // in, so renderSlot's "Edit" button below can open the exact right builder modal.
            // Plain name lookup rather than GLIDE's own naming-convention helpers (isGlideHtName
            // etc.) on purpose — those only recognize GLIDE-generated names, but a macro or sticky
            // key is normally hand-named by the person, so the only reliable signal is "which
            // array actually contains an entry with this name."
            const findBehaviorCategory = (cfg, name) => {
                if (!cfg || !name) return null;
                if ((cfg.macros || []).some(m => m.name === name)) return 'Macro';
                if ((cfg.stickyKeys || []).some(s => s.name === name)) return 'StickyKey';
                if ((cfg.modMorphs || []).some(m => m.name === name)) return 'ModMorph';
                if ((cfg.holdTaps || []).some(h => h.name === name)) return 'HoldTap';
                if ((cfg.tapDances || []).some(t => t.name === name)) return 'TapDance';
                return null;
            };
            const openBehaviorEditor = (category, name) => {
                if (category === 'Macro') setMacroModalName(name);
                else if (category === 'StickyKey') setStickyKeyModalName(name);
                else if (category === 'ModMorph') setModMorphModalName(name);
                else if (category === 'HoldTap') setHoldTapModalName(name);
                else if (category === 'TapDance') setTapDanceModalName(name);
            };

            const renderSlot = (slotKey, label) => {
                const isSelected = activeActionSlot === slotKey; const isConfigOpen = activeConfigSlot === slotKey;
               
                if (slotKey === 'label') {
                    const currentLabel = currentBinding?.decoration?.label || '';
                    return (
                        <div key="label" className="flex flex-col mt-2">
                            <div onClick={(e) => { e.stopPropagation(); setActiveActionSlot('label'); setActiveConfigSlot(null); }} className={`rounded-xl px-4 py-3 text-xs font-semibold flex flex-col gap-2 cursor-pointer transition-all border ${isSelected ? 'border-app-accent bg-app-accentGhost shadow-sm' : 'bg-transparent text-gray-300 border-app-borderHighlight hover:border-app-textMuted hover:-translate-y-px shadow-sm'} relative z-10`}>
                                <div className="flex justify-between items-center w-full">
                                    <span className="tracking-wide text-app-accent">{label}</span>
                                    <button onClick={(e) => { e.stopPropagation(); clearSlot('label'); }} className={`w-6 h-6 rounded flex items-center justify-center transition-all text-[14px] leading-none shrink-0 ${isSelected ? 'text-app-accent hover:bg-app-accent/20' : 'text-app-textMuted hover:text-red-400 hover:bg-red-500/10'}`} title="Remove label">🗑️</button>
                                </div>
                                {isSelected && (
                                    <div className="flex gap-2 mt-1 relative">
                                        <input autoFocus type="text" value={currentLabel} onChange={(e) => updateDecorationProperty('label', e.target.value)} onKeyDown={(e) => { if(e.key === 'Enter') { e.stopPropagation(); setActiveActionSlot('tap'); } }} onBlur={() => { setActiveActionSlot('tap'); }} placeholder="Type custom text..." className="w-full bg-app-surface border border-app-borderHighlight rounded-lg pl-3 pr-16 py-2 text-app-text outline-none font-mono focus:border-app-accent transition-colors" onClick={e => e.stopPropagation()} />
                                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-emerald-500 font-bold bg-emerald-500/10 px-1.5 rounded pointer-events-none opacity-0 transition-opacity duration-300" style={{opacity: currentLabel ? 1 : 0}}>Saved ✓</span>
                                    </div>
                                )}
                                {!isSelected && <span className="text-app-text font-mono truncate">{currentLabel || '(Empty)'}</span>}
                            </div>
                        </div>
                    );
                }

                const slotBinding = parsedSlots[slotKey]; const isFilled = !!slotBinding && slotBinding.value !== '&none';
                let rawBindingName = slotBinding?.value || '';
                if (slotKey === 'hold') {
                    let pb = currentBinding;
                    if (isRecognizedTdName(pb?.value)) pb = config?.tapDances?.find(t => t.name === pb.value)?.bindings?.[0];
                    rawBindingName = pb?.value || '';
                }
                if (slotKey === 'doubleTap' && isRecognizedTdName(currentBinding?.value)) rawBindingName = currentBinding.value;

                const showGear = isFilled && (slotKey === 'hold' || slotKey === 'doubleTap' || !['&kp', '&mt', '&lt', '&trans', '&none', '&magic'].includes(slotBinding.value));
                const isCustomBehavior = isFilled && !isGlideNativeBindingValue(slotBinding.value);
                const usageCount = isCustomBehavior ? countBehaviorUsage(config, slotBinding.value) : 0;
                const behaviorCategory = isCustomBehavior ? findBehaviorCategory(config, slotBinding.value) : null;

                if (isFilled) {
                    return (
                        <div key={slotKey} className="flex flex-col">
                            <div onClick={(e) => { e.stopPropagation(); setActiveActionSlot(slotKey); setActiveConfigSlot(null); }} className={`rounded-xl px-4 py-2 text-xs font-semibold flex items-center justify-between cursor-pointer transition-all border ${isSelected ? 'btn-active-hollow shadow-sm' : 'bg-transparent text-gray-300 border-app-borderHighlight hover:border-app-textMuted hover:-translate-y-px shadow-sm'} relative z-10`}>
                                <span className="w-auto mr-4 tracking-wide flex items-center gap-1.5 shrink-0 whitespace-nowrap">
                                    {label}:
                                    {isCustomBehavior && <span className="text-[9px] uppercase tracking-widest bg-app-panel border border-app-borderHighlight text-app-textMuted px-1.5 py-0.5 rounded" title={`Hand-authored custom behavior "${slotBinding.value}" — not decomposed into slots${usageCount > 1 ? ` (shared ×${usageCount})` : ''}`}>Custom{usageCount > 1 ? ` · ×${usageCount}` : ''}</span>}
                                </span>
                                {/* For a native binding (&kp A, &mt LSHIFT A, ...) this is the whole point of the row, so it
                                    always renders. For a custom behavior, the "Custom" badge to the left already says as much,
                                    and there usually isn't enough width left after the label, badge and (now up to 4) action
                                    buttons to show the behavior's name as more than one clipped, unreadable glyph — see the
                                    badge's title (and the ✎ button) for the name instead of fighting this row for space. */}
                                {!isCustomBehavior && <span className="flex-1 min-w-0 truncate font-mono text-[11px] text-right pr-2">{describeBinding(slotBinding, effectiveOs, layerNames)}</span>}
                                {isCustomBehavior && <span className="flex-1 min-w-0"></span>}
                                <div className="flex items-center gap-1 shrink-0">
                                    {behaviorCategory && <button onClick={(e) => { e.stopPropagation(); openBehaviorEditor(behaviorCategory, slotBinding.value); }} className="w-6 h-6 rounded flex items-center justify-center transition-all text-[12px] shrink-0 text-app-textMuted hover:text-app-accent border border-app-borderHighlight hover:border-app-accent hover:-translate-y-px" title="Edit this behavior's own definition">✎</button>}
                                    {isCustomBehavior && <button onClick={(e) => { e.stopPropagation(); detachCustomBehavior(slotKey); }} className="w-6 h-6 rounded flex items-center justify-center transition-all text-[12px] shrink-0 text-app-textMuted hover:text-app-accent border border-app-borderHighlight hover:border-app-accent hover:-translate-y-px" title={`Detach & Customize — clone this behavior so you can edit it independently${usageCount > 1 ? ` (currently shared with ${usageCount - 1} other place${usageCount - 1 === 1 ? '' : 's'})` : ''}`}>⑂</button>}
                                    {showGear && <button onClick={(e) => handleGearClick(e, slotKey)} className={`w-6 h-6 rounded flex items-center justify-center transition-all text-[12px] shrink-0 ${isConfigOpen ? 'bg-app-accent text-white border border-app-accent hover:bg-app-accentHover' : (isSelected ? 'hover:bg-app-accentGhost text-app-accent border border-app-accentGhost hover:-translate-y-px' : 'text-app-textMuted hover:text-app-text border border-app-borderHighlight hover:-translate-y-px')}`} title="Settings">{isConfigOpen ? '✕' : '⚙️'}</button>}
                                    <button onClick={(e) => { e.stopPropagation(); clearSlot(slotKey); }} className={`w-6 h-6 rounded flex items-center justify-center transition-all text-[14px] leading-none shrink-0 ${isSelected ? 'hover:bg-app-accentGhost text-app-accent border border-app-accentGhost hover:-translate-y-px' : 'text-app-textMuted hover:text-red-400 hover:bg-red-500/10 border border-transparent hover:border-red-500/20 hover:-translate-y-px'}`} title="Clear slot">🗑️</button>
                                </div>
                            </div>
                            {isConfigOpen && renderBehaviorSettings(slotKey, rawBindingName)}
                        </div>
                    );
                } else {
                    return (
                        <div key={slotKey} onClick={(e) => { e.stopPropagation(); setActiveActionSlot(slotKey); setActiveConfigSlot(null); }} className={`rounded-xl px-4 py-3 text-xs flex flex-col gap-2 cursor-pointer transition-all border border-dashed ${isSelected ? 'border-app-accent text-app-accent bg-app-accentGhost' : 'border-app-borderHighlight text-app-textMuted hover:border-app-textMuted hover:text-app-text hover:-translate-y-px'}`}>
                            <div className="flex items-center justify-between font-semibold">
                                <span className="tracking-wide">{label}:</span>
                                {isSelected && <button onClick={(e) => { e.stopPropagation(); clearSlot(slotKey); }} className="w-5 h-5 rounded flex items-center justify-center transition-colors border border-app-accent/30 hover:bg-app-accent/20 text-app-accent text-md leading-none shrink-0" title="Cancel">✕</button>}
                            </div>
                            {isSelected && <span className="italic opacity-80 text-[11px]">Select an action from the palette to assign...</span>}
                        </div>
                    );
                }
            };

            const handleKeyContextAction = useCallback((action, keyIndex) => {
                if (!config || !config.layers[activeLayer]) return; const existing = config.layers[activeLayer][keyIndex];
                if (action === 'copy') { setClipboard(structuredClone(existing || { value: '&none' })); showToast(`Copied Action`); }
                else if (action === 'clearClipboard') { setClipboard(null); showToast('Cleared Clipboard'); }
                else if (action === 'paste') {
                    if (!clipboard) { showToast('Clipboard is empty — copy a key first', 'error'); return; }
                    const newConfig = structuredClone(config); const pasted = structuredClone(clipboard);
                    const existingDecoration = newConfig.layers[activeLayer][keyIndex]?.decoration;
                    if (existingDecoration && !pasted.decoration) pasted.decoration = existingDecoration;
                    newConfig.layers[activeLayer][keyIndex] = pasted; pushHistory(newConfig); showToast('Pasted Action');
                } else if (action === 'clear') {
                    const newConfig = structuredClone(config); newConfig.layers[activeLayer][keyIndex] = { value: '&none' }; pushHistory(newConfig); showToast('Cleared Key');
                } else if (action === 'copyStyle') {
                    if (!existing?.decoration?.background) { showToast('This key has no LED color set', 'error'); return; }
                    setStyleClipboard({ background: existing.decoration.background }); showToast('LED Color copied');
                } else if (action === 'pasteStyle') {
                    if (!styleClipboard?.background) { showToast('No LED color copied yet', 'error'); return; }
                    const newConfig = structuredClone(config); const target = newConfig.layers[activeLayer][keyIndex] || { value: '&none' };
                    target.decoration = { ...(target.decoration || {}), background: styleClipboard.background }; newConfig.layers[activeLayer][keyIndex] = target; pushHistory(newConfig); showToast('LED Color pasted');
                }
            }, [config, activeLayer, clipboard, styleClipboard, pushHistory, showToast]);

            const swapKeys = useCallback((a, b) => {
                if (!config || !config.layers[activeLayer] || a === b) return;
                if (isGo60 && (a === 60 || a === 61 || b === 60 || b === 61)) return;
                const newConfig = structuredClone(config); const layer = newConfig.layers[activeLayer];
                const temp = layer[a] || { value: '&none' }; layer[a] = layer[b] || { value: '&none' }; layer[b] = temp;
                pushHistory(newConfig); showToast(`Swapped Key ${getLogicalName(a, config?.keyboard)} ↔ Key ${getLogicalName(b, config?.keyboard)}`);
            }, [config, activeLayer, pushHistory, showToast, isGo60]);

            useEffect(() => {
                const handler = (e) => {
                    const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
                    if (e.key === 'Escape' && !typing) { setSelectedKey(null); setEditingComboIdx(null); return; }
                    const isMod = e.ctrlKey || e.metaKey; if (!isMod || typing) return;
                    const key = e.key.toLowerCase();
                    if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
                    else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); redo(); }
                    else if (key === 'c' && selectedKey !== null) { e.preventDefault(); handleKeyContextAction('copy', selectedKey); }
                    else if (key === 'v' && selectedKey !== null) { e.preventDefault(); handleKeyContextAction('paste', selectedKey); }
                };
                window.addEventListener('keydown', handler); return () => window.removeEventListener('keydown', handler);
            }, [undoStack, redoStack, config, selectedKey, handleKeyContextAction]);

            const addLayer = () => {
                if (!config) return;
                const newConfig = structuredClone(config); const keyCount = newConfig.layers[0]?.length || keyboardGeo.length || 80;
                newConfig.layers.push(Array.from({ length: keyCount }, () => ({ value: '&trans' })));
                if (!Array.isArray(newConfig.layer_names)) newConfig.layer_names = newConfig.layers.slice(0, -1).map((_, i) => `Layer ${i}`);
                newConfig.layer_names.push(`Layer ${newConfig.layers.length - 1}`); pushHistory(newConfig); setActiveLayer(newConfig.layers.length - 1); setSelectedKey(null); setEditingComboIdx(null); showToast('Layer added');
            };

            const deleteLayer = async (idx) => {
                if (!config || idx === 0 || config.layers.length <= 1) return;
                let name = Array.isArray(config.layer_names) ? config.layer_names[idx] : `Layer ${idx}`;
                name = (typeof name === 'string' && name.trim() !== '') ? name : `Layer ${idx}`;
                if ((await askConfirm({ title: 'Delete layer?', message: `Delete "${name}"? All its key bindings will be lost.`, confirmLabel: 'Delete', danger: true })) !== 'confirm') return;
                const newConfig = structuredClone(config); newConfig.layers.splice(idx, 1);
                if (Array.isArray(newConfig.layer_names)) newConfig.layer_names.splice(idx, 1);
                shiftLayerPointers(newConfig, 'delete', idx); pushHistory(newConfig);
                setActiveLayer(prev => prev >= newConfig.layers.length ? newConfig.layers.length - 1 : (prev > idx ? prev - 1 : prev)); setSelectedKey(null); setEditingComboIdx(null); showToast('Layer deleted');
            };

            const moveLayerReorder = (fromIdx, toIdx) => {
                if (!config || fromIdx === toIdx) return;
                const newConfig = structuredClone(config);
                const [movedLayer] = newConfig.layers.splice(fromIdx, 1); newConfig.layers.splice(toIdx, 0, movedLayer);
                if (Array.isArray(newConfig.layer_names)) { const [movedName] = newConfig.layer_names.splice(fromIdx, 1); newConfig.layer_names.splice(toIdx, 0, movedName); }
                shiftLayerPointers(newConfig, 'move', fromIdx, toIdx);
                pushHistory(newConfig);
                if (activeLayer === fromIdx) setActiveLayer(toIdx);
                else if (fromIdx < activeLayer && toIdx >= activeLayer) setActiveLayer(activeLayer - 1);
                else if (fromIdx > activeLayer && toIdx <= activeLayer) setActiveLayer(activeLayer + 1);
            };

            // Pointer-based layer reordering — deliberately not the native HTML5 Drag and Drop
            // API (draggable/onDragStart/onDragOver/onDrop): that API has no real touch backing
            // (iOS Safari doesn't fire drag events for a finger at all), so reordering layers
            // would have been mouse-only. This mirrors the same elementFromPoint-based approach
            // used for the canvas's key-swap drag, driven from the row's grab handle only so it
            // doesn't fight with tapping the layer name or its clone/rename/delete buttons.
            const handleLayerPointerDown = (e, i) => {
                e.preventDefault();
                const pointerId = e.pointerId;
                setDraggedLayerIdx(i);
                const onMove = (e2) => {
                    if (e2.pointerId !== pointerId) return;
                    const el = document.elementFromPoint(e2.clientX, e2.clientY)?.closest('[data-layer-idx]');
                    const overIdx = el ? parseInt(el.dataset.layerIdx, 10) : null;
                    setDragOverLayerIdx(overIdx !== null && overIdx !== i ? overIdx : null);
                };
                const finish = (e2) => {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onCancel);
                    if (e2) {
                        const el = document.elementFromPoint(e2.clientX, e2.clientY)?.closest('[data-layer-idx]');
                        const targetIdx = el ? parseInt(el.dataset.layerIdx, 10) : null;
                        if (targetIdx !== null && targetIdx !== i) moveLayerReorder(i, targetIdx);
                    }
                    setDraggedLayerIdx(null); setDragOverLayerIdx(null);
                };
                const onUp = (e2) => { if (e2.pointerId !== pointerId) return; finish(e2); };
                const onCancel = (e2) => { if (e2.pointerId !== pointerId) return; finish(null); };
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onCancel);
            };

            const cloneLayer = (idx) => {
                if (!config) return;
                const newConfig = structuredClone(config);
                newConfig.layers.splice(idx + 1, 0, structuredClone(newConfig.layers[idx]));
                if (Array.isArray(newConfig.layer_names)) newConfig.layer_names.splice(idx + 1, 0, `${newConfig.layer_names[idx]} Copy`);
                shiftLayerPointers(newConfig, 'insert', idx + 1); pushHistory(newConfig); setActiveLayer(idx + 1); showToast('Layer cloned');
            };

            const startRenameLayer = (idx, currentName) => { setRenamingLayerIdx(idx); setRenameValue(currentName); };
            const commitRenameLayer = () => {
                if (renamingLayerIdx === null || !config) { setRenamingLayerIdx(null); return; }
                const newConfig = structuredClone(config);
                if (!Array.isArray(newConfig.layer_names)) newConfig.layer_names = newConfig.layers.map((_, i) => `Layer ${i}`);
                const trimmed = renameValue.trim(); newConfig.layer_names[renamingLayerIdx] = trimmed || `Layer ${renamingLayerIdx}`; pushHistory(newConfig); setRenamingLayerIdx(null);
            };

            const createNewCombo = () => {
                const newConfig = structuredClone(config);
                if (!newConfig.combos) newConfig.combos = [];
                const newCombo = { name: `Combo ${newConfig.combos.length + 1}`, description: '', keyPositions: [], timeoutMs: 50, binding: { value: '&none' }, layers: [-1] };
                newConfig.combos.push(newCombo);
                pushHistory(newConfig);
                setEditingComboIdx(newConfig.combos.length - 1);
                setActiveVerticalTab('Keymap');
            };

            const createNewMacro = () => {
                const { config: newConfig, name } = createMacro(config, 'my_macro');
                pushHistory(newConfig);

            };
            const cloneMacroAction = (name) => {

            const deleteMacroAction = async (name) => {
                const refs = findMacroReferences(config, name);
                if (refs.length > 0) {
                    const msg = `"${name.replace('&', '')}" is still used by ${refs.length === 1 ? refs[0] : `${refs.length} other things`} — deleting it will leave those pointing at a macro that no longer exists.`;
                    if ((await askConfirm({ title: 'Macro still in use', message: msg, confirmLabel: 'Delete Anyway', danger: true })) !== 'confirm') return;
                }

            // Guards opening a Hold-Tap/Mod-Morph/Tap-Dance from the Behavior Library sidebar
            // (as opposed to the per-key inspector's inline editor) when that behavior is one of
            // GLIDE's own auto-generated ones (&GLIDE_ht_.../&GLIDE_mm_.../&GLIDE_td_... — see
            // core/zmk/naming.js). The per-key inspector already has real protection for this
            // (detachCustomBehavior clones a shared one before editing), but the Behavior Library
            // had none at all: clicking a GLIDE-generated behavior here opened its builder exactly
            // like any hand-made one, with only a plain description string ("GLIDE-generated and
            // controlled...") sitting in an ordinary editable text field as the sole hint anything
            // was different. Renaming or hand-editing it there breaks the correlation the per-key
            // inspector relies on (isGlideHtName/isGlideMmName match by name prefix) with no
            // confirmation at all, and — since Advanced Behaviors also displays it as
            // GLIDE_BEHAVIOR_DESCRIPTION-owned — no warning that changes ripple to every key
            // referencing it.
            //
            // This warns rather than auto-detaching (unlike detachCustomBehavior): the Behavior
            // Library is the "raw" editor, and the person opening it from there has explicitly
            // gone looking for direct control, so the honest move is telling them the risk and
            // letting them proceed, not silently forking a copy on their behalf.
            //
            // Flow-automation-authored behaviors (e.g. Home-Row Mods' own hrm_add.flows output)
            // are NOT covered here — they carry no GLIDE-owned naming or marker at all, so there's
            // currently no way to distinguish them from a hand-made behavior after the fact. A
            // real gap, but a data-model change (tagging origin at apply-time), not a UI one.
            const guardGlideOwnedBehaviorOpen = useCallback(async (isOwned, name, openIt) => {
                if (!isOwned) { openIt(name); return; }
                const usageCount = countBehaviorUsage(config, name);
                const choice = await askConfirm({
                    title: 'GLIDE-generated behavior',
                    message: `"${name.replace('&', '')}" was generated and is tracked by GLIDE's own per-key inspector${usageCount > 1 ? ` (currently used by ${usageCount} keys/combos)` : ''}. Renaming or changing it here can break that correlation, and it will no longer be editable from the simplified per-key UI.`,
                    confirmLabel: 'Edit Anyway',
                    cancelLabel: 'Cancel',
                    danger: true,
                });
                if (choice === 'confirm') openIt(name);
            }, [config, askConfirm, countBehaviorUsage]);
            const openHoldTapModal = useCallback((name) => guardGlideOwnedBehaviorOpen(isGlideHtName(name), name, setHoldTapModalName), [guardGlideOwnedBehaviorOpen]);
            const openModMorphModal = useCallback((name) => guardGlideOwnedBehaviorOpen(isGlideMmName(name), name, setModMorphModalName), [guardGlideOwnedBehaviorOpen]);
            const openTapDanceModal = useCallback((name) => guardGlideOwnedBehaviorOpen(typeof name === 'string' && name.startsWith(GLIDE_TD_PREFIX), name, setTapDanceModalName), [guardGlideOwnedBehaviorOpen]);

            const createNewModMorph = () => {
                const { config: newConfig, name } = createModMorph(config, 'my_mod_morph');
                pushHistory(newConfig);
                setModMorphModalName(name);
            };
            const cloneModMorphAction = (name) => {
                const { config: newConfig, name: newName } = cloneModMorph(config, name);

                pushHistory(newConfig);

            const deleteModMorphAction = async (name) => {
                const refs = findModMorphReferences(config, name);

                    if ((await askConfirm({ title: 'Mod-morph still in use', message: msg, confirmLabel: 'Delete Anyway', danger: true })) !== 'confirm') return;
                }
                pushHistory(deleteModMorph(config, name));
                if (modMorphModalName === name) setModMorphModalName(null);
                showToast('Mod-morph deleted');
            };

            const saveModMorphFromModal = (oldName, updatedParsed) => {
                let next = config;
                const newName = updatedParsed.name;
                if (newName !== oldName) next = renameModMorph(next, oldName, newName);
                next = updateModMorph(next, newName, updatedParsed);
                pushHistory(next);
                setModMorphModalName(null);
                showToast('Mod-morph saved');
            };

            const createNewHoldTap = () => {
                const { config: newConfig, name } = createHoldTap(config, 'my_hold_tap');
                pushHistory(newConfig);
                setHoldTapModalName(name);
            };
            const cloneHoldTapAction = (name) => {
                const { config: newConfig, name: newName } = cloneHoldTap(config, name);
                if (!newName) return;
                pushHistory(newConfig);
                showToast('Hold-tap cloned');
            };
            const deleteHoldTapAction = async (name) => {
                const refs = findHoldTapReferences(config, name);
                if (refs.length > 0) {
                    const msg = `"${name.replace('&', '')}" is still used by ${refs.length === 1 ? refs[0] : `${refs.length} other things`} — deleting it will leave those pointing at a hold-tap that no longer exists.`;
                    if ((await askConfirm({ title: 'Hold-tap still in use', message: msg, confirmLabel: 'Delete Anyway', danger: true })) !== 'confirm') return;
                }
                pushHistory(deleteHoldTap(config, name));
                if (holdTapModalName === name) setHoldTapModalName(null);
                showToast('Hold-tap deleted');
            };

            const saveHoldTapFromModal = (oldName, updatedParsed) => {
                let next = config;
                const newName = updatedParsed.name;
                if (newName !== oldName) next = renameHoldTap(next, oldName, newName);
                next = updateHoldTap(next, newName, updatedParsed);
                pushHistory(next);
                setHoldTapModalName(null);
                showToast('Hold-tap saved');
            };

            const createNewTapDance = () => {
                const { config: newConfig, name } = createTapDance(config, 'my_tap_dance');
                pushHistory(newConfig);
                setTapDanceModalName(name);
            };
            const cloneTapDanceAction = (name) => {
                const { config: newConfig, name: newName } = cloneTapDance(config, name);
                if (!newName) return;
                pushHistory(newConfig);
                showToast('Tap-dance cloned');
            };
            const deleteTapDanceAction = async (name) => {
                const refs = findTapDanceReferences(config, name);
                if (refs.length > 0) {
                    const msg = `"${name.replace('&', '')}" is still used by ${refs.length === 1 ? refs[0] : `${refs.length} other things`} — deleting it will leave those pointing at a tap-dance that no longer exists.`;
                    if ((await askConfirm({ title: 'Tap-dance still in use', message: msg, confirmLabel: 'Delete Anyway', danger: true })) !== 'confirm') return;
                }
                pushHistory(deleteTapDance(config, name));
                if (tapDanceModalName === name) setTapDanceModalName(null);
                showToast('Tap-dance deleted');
            };

            const saveTapDanceFromModal = (oldName, updatedParsed) => {
                let next = config;
                const newName = updatedParsed.name;
                if (newName !== oldName) next = renameTapDance(next, oldName, newName);
                next = updateTapDance(next, newName, updatedParsed);
                pushHistory(next);
                setTapDanceModalName(null);
                showToast('Tap-dance saved');
            };

            const saveCustomJson = () => {
                if (!config || (selectedKey === null && editingComboIdx === null)) return;
                try {
                    const parsed = JSON.parse(jsonStr); if (!parsed.value) throw new Error("Missing 'value' attribute.");
                    const newConfig = structuredClone(config);
                    if (editingComboIdx !== null) newConfig.combos[editingComboIdx].binding = parsed;
                    else newConfig.layers[activeLayer][selectedKey] = parsed;
                    pushHistory(newConfig); setJsonError(""); showToast('Applied');
                } catch (err) { setJsonError(err.message); }
            };

            // ZMK combos only ever fire one binding — there's no hold/tap distinction, no
            // double-tap sequencing, and no shift-conditional output at the combo level (that's
            // all per-key hold-tap/tap-dance/mod-morph behavior, which a combo's single `binding`
            // can point AT, but a combo itself can't branch on hold vs. tap the way a key can).
            // So while editing a combo, only the primary ("tap") slot is ever offered — never
            // shiftTap/hold/doubleTap/label, regardless of what's in manuallyAddedSlots.
            //
            // Slot order below (both when already active and when offered as an "also specify"
            // link) is hold, doubleTap, label, shiftTap — ranked for a non-technical audience by
            // how commonly it's used and how easy it is to understand, not by build history
            // (shiftTap shipped first, which is the only reason it used to lead this list). Hold
            // actions (dual-purpose/home-row-mod keys) are the single most common "extra" a real
            // layout uses; a custom text label needs no ZMK knowledge at all; a Shift-conditional
            // output is the most advanced of the four (it's a mod-morph under the hood), so it's
            // last rather than first.
            const activeSlotKeys = ['tap'];
            if (editingComboIdx === null) {
                if (parsedSlots.hold || manuallyAddedSlots.has('hold')) activeSlotKeys.push('hold');
                if (parsedSlots.doubleTap || manuallyAddedSlots.has('doubleTap')) activeSlotKeys.push('doubleTap');
                const hasCustomLabel = !!currentBinding?.decoration?.label;
                if (hasCustomLabel || manuallyAddedSlots.has('label')) activeSlotKeys.push('label');
                if (parsedSlots.shiftTap || manuallyAddedSlots.has('shiftTap')) activeSlotKeys.push('shiftTap');
            }
            const availableToAdd = editingComboIdx === null
                ? ['hold', 'doubleTap', 'label', 'shiftTap'].filter(k => !activeSlotKeys.includes(k))
                : [];

            return (
                <div className="flex flex-col h-dvh w-screen font-sans text-sm overflow-hidden bg-app-base text-app-text transition-colors duration-300">

                    {/* Persistent, full-width app bar (ui/topBar.js — Stage 3, step 2). File
                        identity (name + unsaved dot) lives here rather than inside the
                        Layers/Combos sidebar, which is now purely about editing content — and
                        New/Import/Export are always-visible, clearly labeled actions rather than
                        a hidden icon-only menu. */}
                    <TopBar
                        config={config}
                        layoutName={layoutName}
                        isDirty={isDirty}
                        showNewMenu={showNewMenu}
                        setShowNewMenu={setShowNewMenu}
                        isFetchingTemplate={isFetchingTemplate}
                        fetchTemplate={fetchTemplate}
                        handleFileUpload={handleFileUpload}
                        handleExport={handleExport}
                        undo={undo}
                        undoStack={undoStack}
                        redo={redo}
                        redoStack={redoStack}
                        setShowSettings={setShowSettings}
                        setShowCapabilities={setShowCapabilities}
                        setShowCommandPalette={setShowCommandPalette}
                        ensureJqEngineLoaded={ensureJqEngineLoaded}
                    />

                <div className="flex flex-1 min-w-0 min-h-0 overflow-hidden" onClick={() => setActiveConfigSlot(null)}>
                    <Sidebar
                        leftPanelSize={leftPanelSize}
                        sidebarSide={sidebarSide}
                        handleLeftResizeStart={handleLeftResizeStart}
                        config={config}
                        leftNavMode={leftNavMode}
                        setLeftNavMode={setLeftNavMode}
                        behaviorLibraryExpanded={behaviorLibraryExpanded}
                        setBehaviorLibraryExpanded={setBehaviorLibraryExpanded}
                        layerNames={layerNames}
                        draggedLayerIdx={draggedLayerIdx}
                        dragOverLayerIdx={dragOverLayerIdx}
                        activeLayer={activeLayer}
                        isZenMode={isZenMode}
                        renamingLayerIdx={renamingLayerIdx}
                        renameValue={renameValue}
                        setRenameValue={setRenameValue}
                        commitRenameLayer={commitRenameLayer}
                        setRenamingLayerIdx={setRenamingLayerIdx}
                        handleLayerPointerDown={handleLayerPointerDown}
                        setActiveLayer={setActiveLayer}
                        setSelectedKey={setSelectedKey}
                        setEditingComboIdx={setEditingComboIdx}
                        startRenameLayer={startRenameLayer}
                        cloneLayer={cloneLayer}
                        deleteLayer={deleteLayer}
                        addLayer={addLayer}
                        createNewCombo={createNewCombo}
                        comboSearchText={comboSearchText}
                        setComboSearchText={setComboSearchText}
                        comboLayerFilter={comboLayerFilter}
                        setComboLayerFilter={setComboLayerFilter}
                        filteredCombos={filteredCombos}
                        editingComboIdx={editingComboIdx}
                        hoveredComboIdx={hoveredComboIdx}
                        setHoveredComboIdx={setHoveredComboIdx}
                        hoveredBehaviorName={hoveredBehaviorName}
                        setHoveredBehaviorName={setHoveredBehaviorName}
                        setActiveVerticalTab={setActiveVerticalTab}
                        pushHistory={pushHistory}
                        showToast={showToast}
                        keyboardGeo={keyboardGeo}
                        createNewMacro={createNewMacro}
                        macroSearchText={macroSearchText}
                        setMacroSearchText={setMacroSearchText}
                        filteredMacros={filteredMacros}
                        setMacroModalName={setMacroModalName}
                        cloneMacroAction={cloneMacroAction}
                        deleteMacroAction={deleteMacroAction}
                        createNewStickyKey={createNewStickyKey}
                        stickyKeySearchText={stickyKeySearchText}
                        setStickyKeySearchText={setStickyKeySearchText}
                        filteredStickyKeys={filteredStickyKeys}
                        setStickyKeyModalName={setStickyKeyModalName}
                        cloneStickyKeyAction={cloneStickyKeyAction}
                        deleteStickyKeyAction={deleteStickyKeyAction}
                        createNewModMorph={createNewModMorph}
                        modMorphSearchText={modMorphSearchText}
                        setModMorphSearchText={setModMorphSearchText}
                        filteredModMorphs={filteredModMorphs}
                        setModMorphModalName={openModMorphModal}
                        cloneModMorphAction={cloneModMorphAction}
                        deleteModMorphAction={deleteModMorphAction}
                        createNewHoldTap={createNewHoldTap}
                        holdTapSearchText={holdTapSearchText}
                        setHoldTapSearchText={setHoldTapSearchText}
                        filteredHoldTaps={filteredHoldTaps}
                        setHoldTapModalName={openHoldTapModal}
                        cloneHoldTapAction={cloneHoldTapAction}
                        deleteHoldTapAction={deleteHoldTapAction}
                        createNewTapDance={createNewTapDance}
                        tapDanceSearchText={tapDanceSearchText}
                        setTapDanceSearchText={setTapDanceSearchText}
                        filteredTapDances={filteredTapDances}
                        setTapDanceModalName={openTapDanceModal}
                        cloneTapDanceAction={cloneTapDanceAction}
                        deleteTapDanceAction={deleteTapDanceAction}
                    />

                    <main style={{ order: sidebarSide === 'right' ? 0 : 2 }} className={`flex-1 flex ${layoutMode === 'right' ? 'flex-row' : 'flex-col'} min-w-0 relative z-10 overflow-hidden`}>
                        <section className="flex-1 flex relative overflow-hidden bg-transparent">
                            {!config ? (
                                <div className="m-auto text-app-textMuted flex flex-col items-center gap-6 bg-app-card p-10 rounded-2xl border border-app-borderHighlight shadow-2xl max-w-md text-center transition-colors">
                                    <div className="w-16 h-16 rounded-full bg-app-surface border border-app-borderHighlight flex items-center justify-center text-app-accent shadow-inner">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                    </div>
                                    <div className="space-y-2">
                                        <h2 className="text-xl font-bold text-app-text">Start a Layout</h2>
                                        <p className="text-sm">A "layout" is just a JSON file describing what every key on your keyboard does — the same file your keyboard's own configurator exports, or one you've saved from GLIDE before. Import one below, or start blank with a template for your keyboard.</p>
                                    </div>
                                    <div className="flex gap-3 w-full">
                                        <label className="flex-1 btn-active font-bold py-3 rounded-xl cursor-pointer transition-all text-center border-none shadow-lg hover:-translate-y-px">Import Layout File<input type="file" accept=".json" className="hidden" onChange={handleFileUpload} /></label>
                                    </div>
                                    <div className="w-full flex items-center gap-4"><div className="h-px bg-app-borderHighlight flex-1"></div><span className="text-[10px] uppercase font-bold tracking-widest text-app-textMuted">Or start blank</span><div className="h-px bg-app-borderHighlight flex-1"></div></div>
                                    <div className="flex gap-3 w-full">
                                        <button onClick={() => fetchTemplate('glove80')} disabled={isFetchingTemplate} className="flex-1 bg-app-surface hover:bg-app-panel border border-app-borderHighlight text-app-text py-2.5 rounded-xl transition-all font-medium shadow-sm hover:-translate-y-px">Glove80</button>
                                        <button onClick={() => fetchTemplate('go60')} disabled={isFetchingTemplate} className="flex-1 bg-app-surface hover:bg-app-panel border border-app-borderHighlight text-app-text py-2.5 rounded-xl transition-all font-medium shadow-sm hover:-translate-y-px">Go60</button>
                                    </div>
                                </div>
                            ) : (
                                <KeyboardContainer keyboardGeo={keyboardGeo} activeLayerBindings={currentLayerBindings} selectedKey={selectedKey} onSelectKey={handleCanvasKeySelect} scale={canvasScale} setScale={setCanvasScale} osMode={effectiveOs} onContextAction={handleKeyContextAction} clipboard={clipboard} styleClipboard={styleClipboard} onSwapKeys={swapKeys} showLeds={showLeds} isGo60={isGo60} config={config} isZenMode={isZenMode} selectedComboKeys={editingComboIdx !== null ? (config.combos[editingComboIdx]?.keyPositions || config.combos[editingComboIdx]?.key_positions || []) : []} usageHighlightKeys={usageHighlightKeys} layerNames={layerNames} stopZenMode={() => setEditingComboIdx(null)} onOpenTouchpad={setTouchpadModalIndex} paintMode={paintMode && activeVerticalTab === 'Lighting'} onPaintKey={applyPaintColorToKey} onPaintStrokeEnd={commitPaintStroke} />
                            )}
                        </section>

                        <InspectorPanel
                            layoutMode={layoutMode}
                            panelSize={panelSize}
                            handleRightResizeStart={handleRightResizeStart}
                            editingComboIdx={editingComboIdx}
                            setEditingComboIdx={setEditingComboIdx}
                            combosContainingSelectedKey={combosContainingSelectedKey}
                            config={config}
                            selectedKey={selectedKey}
                            setSelectedKey={setSelectedKey}
                            askConfirm={askConfirm}
                            clearAllActions={clearAllActions}
                            showComboSettings={showComboSettings}
                            setShowComboSettings={setShowComboSettings}
                            pushHistory={pushHistory}
                            activeLayer={activeLayer}
                            layerNames={layerNames}
                            activeSlotKeys={activeSlotKeys}
                            renderSlot={renderSlot}
                            availableToAdd={availableToAdd}
                            setManuallyAddedSlots={setManuallyAddedSlots}
                            setActiveActionSlot={setActiveActionSlot}
                            modSide={modSide}
                            setModSide={setModSide}
                            armedMods={armedMods}
                            parsedSlots={parsedSlots}
                            activeActionSlot={activeActionSlot}
                            effectiveOs={effectiveOs}
                            toggleModifier={toggleModifier}
                            paletteSearch={paletteSearch}
                            setPaletteSearch={setPaletteSearch}
                            assignAction={assignAction}
                            isItemActive={isItemActive}
                            advancedSearch={advancedSearch}
                            setAdvancedSearch={setAdvancedSearch}
                            advancedCategory={advancedCategory}
                            setAdvancedCategory={setAdvancedCategory}
                            filteredBehaviors={filteredBehaviors}
                            activeVerticalTab={activeVerticalTab}
                            setActiveVerticalTab={setActiveVerticalTab}
                            targetLayerIdx={targetLayerIdx}
                            setTargetLayerIdx={setTargetLayerIdx}
                            assignLayerTap={assignLayerTap}
                            showLeds={showLeds}
                            setShowLeds={setShowLeds}
                            setKeyDecoration={setKeyDecoration}
                            paintColor={paintColor}
                            usedLayoutColors={usedLayoutColors}
                            currentLayerBindings={currentLayerBindings}
                            bgHexInput={bgHexInput}
                            setBgHexInput={setBgHexInput}
                            applyBgHexInput={applyBgHexInput}
                            paintMode={paintMode}
                            setPaintMode={setPaintMode}
                            jsonStr={jsonStr}
                            setJsonStr={setJsonStr}
                            jsonError={jsonError}
                            saveCustomJson={saveCustomJson}
                        />
                    </main>
                </div>

                    <SettingsModal
                        isOpen={showSettings}
                        onClose={() => setShowSettings(false)}
                        themeClass={themeClass}
                        setThemeClass={setThemeClass}
                        layoutMode={layoutMode}
                        setLayoutMode={setLayoutMode}
                        sidebarSide={sidebarSide}
                        setSidebarSide={setSidebarSide}
                        osSetting={osSetting}
                        setOsSetting={setOsSetting}
                    />

                    <CapabilitiesModal
                        isOpen={showCapabilities}
                        onClose={() => { setShowCapabilities(false); setSelectedFlowUid(null); setSelectedFlowCategory(null); setFlowSearchText(''); }}
                        config={config}
                        catalog={flowsCatalog}
                        selectedCategory={selectedFlowCategory}
                        onSelectCategory={setSelectedFlowCategory}
                        selectedUid={selectedFlowUid}
                        onSelectUid={setSelectedFlowUid}
                        paramValues={flowParamValues}
                        onParamChange={(uid, id, val) => setFlowParamValues((prev) => ({ ...prev, [uid]: { ...prev[uid], [id]: val } }))}
                        isApplying={isApplyingFlow}
                        onApply={handleApplyFlow}
                        searchText={flowSearchText}
                        onSearchTextChange={setFlowSearchText}
                        results={flowResults}
                        engineStatus={jqEngineStatus}
                        onRetryEngine={ensureJqEngineLoaded}
                    />

                    <CommandPaletteModal
                        isOpen={showCommandPalette}
                        onClose={() => { setShowCommandPalette(false); setPaletteSearchText(''); }}
                        searchText={paletteSearchText}
                        onSearchTextChange={setPaletteSearchText}
                        flowsCatalog={flowsCatalog}
                        config={config}
                        onOpenFlow={openFlowFromPalette}
                        onOpenBehavior={(category, name) => { openBehaviorEditor(category, name); setShowCommandPalette(false); setPaletteSearchText(''); }}
                    />

                    {touchpadModalIndex !== null && (
                        <TouchpadSettingsModal
                            key={touchpadModalIndex}
                            index={touchpadModalIndex}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setTouchpadModalIndex(null)}
                            onSave={(parsed) => { pushHistory(setTouchpadConfig(config, touchpadModalIndex, parsed)); showToast('Touchpad settings updated'); setTouchpadModalIndex(null); }}
                        />
                    )}

                    {config && macroModalName !== null && (config.macros || []).some((m) => m.name === macroModalName) && (
                        <MacroBuilderModal
                            key={macroModalName}
                            name={macroModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setMacroModalName(null)}
                            onSave={saveMacroFromModal}
                        />
                    )}

                    {config && stickyKeyModalName !== null && (config.stickyKeys || []).some((s) => s.name === stickyKeyModalName) && (
                        <StickyKeyBuilderModal
                            key={stickyKeyModalName}
                            name={stickyKeyModalName}
                            config={config}
                            onClose={() => setStickyKeyModalName(null)}
                            onSave={saveStickyKeyFromModal}
                        />
                    )}

                    {config && modMorphModalName !== null && (config.modMorphs || []).some((m) => m.name === modMorphModalName) && (
                        <ModMorphBuilderModal
                            key={modMorphModalName}
                            name={modMorphModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setModMorphModalName(null)}
                            onSave={saveModMorphFromModal}
                        />
                    )}

                    {config && holdTapModalName !== null && (config.holdTaps || []).some((h) => h.name === holdTapModalName) && (
                        <HoldTapBuilderModal
                            key={holdTapModalName}
                            name={holdTapModalName}
                            config={config}
                            keyboardGeo={keyboardGeo}
                            onClose={() => setHoldTapModalName(null)}
                            onSave={saveHoldTapFromModal}
                        />
                    )}

                    {config && tapDanceModalName !== null && (config.tapDances || []).some((t) => t.name === tapDanceModalName) && (
                        <TapDanceBuilderModal
                            key={tapDanceModalName}
                            name={tapDanceModalName}
                            config={config}
                            layerNames={layerNames}
                            onClose={() => setTapDanceModalName(null)}
                            onSave={saveTapDanceFromModal}
                        />
                    )}

                    <ConfirmDialog state={confirmState} onChoice={handleConfirmChoice} />

                    {toast && (
                        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-full text-xs font-bold shadow-2xl border transition-all animate-bounce ${toast.kind === 'error' ? 'bg-red-950 border-red-600 text-red-200' : 'bg-app-panel border-app-borderHighlight text-app-text'}`}>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
